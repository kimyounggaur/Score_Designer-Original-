<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f7ae5"/><stop offset="1" stop-color="#49b3ff"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11a97d"/><stop offset="1" stop-color="#7ee2bf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1b2430" flood-opacity="0.18"/></filter>
    <style>
      .title{font:700 42px Malgun Gothic,Arial,sans-serif;fill:#172033}
      .label{font:700 24px Malgun Gothic,Arial,sans-serif;fill:#172033}
      .body{font:500 18px Malgun Gothic,Arial,sans-serif;fill:#526072}
      .small{font:500 15px Malgun Gothic,Arial,sans-serif;fill:#667386}
      .card{fill:#fff;stroke:#dfe6ef;stroke-width:2;rx:24;filter:url(#shadow)}
    </style>
  </defs>
  
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="70" y="84" class="title">화면 영역 지도</text>
  <text x="72" y="124" class="body">MXL Studio는 악보를 중심에 두고 양쪽에 도구를 배치한 작업형 화면입니다.</text>
  <rect x="70" y="170" width="1260" height="460" rx="28" fill="#ffffff" stroke="#d8e1ec" stroke-width="3" filter="url(#shadow)"/>
  <rect x="70" y="170" width="1260" height="64" rx="28" fill="#e9eef5"/>
  <text x="105" y="211" class="label">상단 메뉴와 빠른 내보내기</text>
  <rect x="95" y="265" width="70" height="330" rx="18" fill="#edf2f7"/>
  <text x="130" y="448" text-anchor="middle" font-size="42">🎛</text>
  <text x="130" y="520" text-anchor="middle" class="small">왼쪽 도구</text>
  <rect x="190" y="265" width="280" height="330" rx="22" fill="#f7fafc" stroke="#dae3ee"/>
  <text x="330" y="330" text-anchor="middle" class="label">인스펙터</text>
  <text x="330" y="368" text-anchor="middle" class="body">선택한 기능의</text>
  <text x="330" y="398" text-anchor="middle" class="body">세부 설정</text>
  <rect x="500" y="265" width="430" height="330" rx="22" fill="#ffffff" stroke="#dae3ee"/>
  <line x1="560" y1="405" x2="870" y2="405" stroke="#253044" stroke-width="4"/>
  <line x1="560" y1="430" x2="870" y2="430" stroke="#253044" stroke-width="4"/>
  <line x1="560" y1="455" x2="870" y2="455" stroke="#253044" stroke-width="4"/>
  <text x="715" y="350" text-anchor="middle" class="label">악보 영역</text>
  <circle cx="665" cy="423" r="13" fill="#0f7ae5"/>
  <circle cx="735" cy="423" r="13" fill="#0f7ae5"/>
  <circle cx="805" cy="423" r="13" fill="#0f7ae5"/>
  <rect x="960" y="265" width="280" height="330" rx="22" fill="#f7fafc" stroke="#dae3ee"/>
  <text x="1100" y="330" text-anchor="middle" class="label">분석/보조 패널</text>
  <text x="1100" y="370" text-anchor="middle" class="body">코드, 주석,</text>
  <text x="1100" y="400" text-anchor="middle" class="body">내보내기 기능</text>
  <rect x="1265" y="265" width="42" height="330" rx="16" fill="#edf2f7"/>
  <text x="1286" y="448" text-anchor="middle" font-size="32">🔎</text>
  <rect x="70" y="635" width="1260" height="56" rx="20" fill="#e9eef5"/>
  <text x="105" y="671" class="label">하단 재생 바</text>
  <text x="275" y="671" class="body">재생, 정지, 템포, 악기, 볼륨, A-B 반복, 현재 마디를 조절합니다.</text>
</svg>