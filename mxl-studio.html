/* ==============================================================
   PANEL: CHORD TOOLS
   ============================================================== */
const KIND_INTERVALS={
  'major':[0,4,7],'minor':[0,3,7],'augmented':[0,4,8],'diminished':[0,3,6],
  'dominant':[0,4,7,10],'major-seventh':[0,4,7,11],'minor-seventh':[0,3,7,10],
  'diminished-seventh':[0,3,6,9],'half-diminished':[0,3,6,10],'minor-major':[0,3,7,11],
  'augmented-seventh':[0,4,8,10],'suspended-fourth':[0,5,7],'suspended-second':[0,2,7],
  'major-sixth':[0,4,7,9],'minor-sixth':[0,3,7,9],
  'dominant-ninth':[0,4,7,10,14],'major-ninth':[0,4,7,11,14],'minor-ninth':[0,3,7,10,14],
  'dominant-11th':[0,4,7,10,14,17],'major-11th':[0,4,7,11,14,17],'minor-11th':[0,3,7,10,14,17],
  'dominant-13th':[0,4,7,10,14,17,21],'major-13th':[0,4,7,11,14,17,21],'minor-13th':[0,3,7,10,14,17,21],
};
const STEP_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const PC_STEP_ALTER=[['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];

function ChordToolsPanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [rules,setRules]=useState([{from:'',to:''}]);
  const [replaceExisting,setReplaceExisting]=useState(false);
  const [inv,setInv]=useState(1);
  const [log,setLog]=useState([]);

  const addRule=useCallback(()=>setRules(r=>[...r,{from:'',to:''}]),[]);
  const removeRule=useCallback(i=>setRules(r=>r.filter((_,j)=>j!==i)),[]);
  const updateRule=useCallback((i,field,val)=>setRules(r=>r.map((x,j)=>j===i?{...x,[field]:val}:x)),[]);

  const runReplace=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const valid=rules.filter(r=>r.from.trim()&&r.to.trim());
    if(!valid.length){alert('변경 규칙을 입력해주세요.');return}
    setLog([]);showProgress('코드 변경 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;
        doc.querySelectorAll('harmony').forEach(h=>{
          const cs=harmonyToString(h);
          valid.forEach(rule=>{if(cs===rule.from){
            const p=parseChordSymbol(rule.to);if(!p)return;
            h.querySelector('root root-step').textContent=p.rootStep;
            let ra=h.querySelector('root root-alter');
            if(p.rootAlter!==0){if(!ra){ra=doc.createElement('root-alter');h.querySelector('root').appendChild(ra)}ra.textContent=p.rootAlter}
            else if(ra)ra.remove();
            h.querySelector('kind').textContent=p.kind;cnt++;
          }});
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${cnt}개 변경`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'코드 일괄 변경');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,rules,showProgress,hideProgress,onFilesUpdate]);

  const runAutoInsert=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('코드 분석 & 삽입 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let ins=0;
        if(replaceExisting)window.ChordToolsCore.preserveNoChordHarmonies(doc);
        else window.ChordToolsCore.dedupeNoChordHarmonies(doc);
        const parts=doc.querySelectorAll('part');
        const mc=parts[0]?.querySelectorAll('measure')?.length||0;
        for(let m=0;m<mc;m++){
          const ns=[];
          parts.forEach(part=>{const meas=part.querySelectorAll('measure')[m];if(!meas)return;
            meas.querySelectorAll('note').forEach(note=>{if(note.querySelector('rest'))return;
              const p=getNotePitch(note);if(!p)return;ns.push(noteToMidi(p.step,p.alter,p.octave)%12)})});
          const chord=detectChord(ns);if(!chord||chord==='?')continue;
          const meas=parts[0].querySelectorAll('measure')[m];if(!meas)continue;
          if(window.ChordToolsCore.measureHasNoChordHarmony(meas))continue;
          if(!replaceExisting&&meas.querySelector('harmony'))continue;
          const parsed=parseChordSymbol(chord);if(!parsed)continue;
          const harm=doc.createElement('harmony');const root=doc.createElement('root');
          const rs=doc.createElement('root-step');rs.textContent=parsed.rootStep;root.appendChild(rs);
          if(parsed.rootAlter!==0){const ra=doc.createElement('root-alter');ra.textContent=parsed.rootAlter;root.appendChild(ra)}
          harm.appendChild(root);const kind=doc.createElement('kind');kind.textContent=parsed.kind;harm.appendChild(kind);
          const fn=meas.querySelector('note');if(fn)meas.insertBefore(harm,fn);else meas.appendChild(harm);ins++;
        }
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${ins}마디 코드 삽입`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'코드 분석 및 삽입');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,replaceExisting,showProgress,hideProgress,onFilesUpdate]);

  const runInversion=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress(`${inv}st/nd/rd inversion 적용 중...`);await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let ok=0,skip=0;
        doc.querySelectorAll('harmony').forEach(h=>{
          const rootEl=h.querySelector('root');const kindEl=h.querySelector('kind');
          if(!rootEl||!kindEl){skip++;return}
          const rs=rootEl.querySelector('root-step')?.textContent||'';
          const ra=parseInt(rootEl.querySelector('root-alter')?.textContent||'0');
          const kind=kindEl.textContent||'major';
          const intervals=KIND_INTERVALS[kind];if(!intervals){skip++;return}
          if(inv>=intervals.length){skip++;return}
          const rootPc=STEP_SEMI[rs];if(rootPc===undefined){skip++;return}
          const bassPc=((rootPc+ra+intervals[inv])%12+12)%12;
          const [bStep,bAlter]=PC_STEP_ALTER[bassPc];
          h.querySelectorAll('inversion').forEach(e=>e.remove());
          h.querySelectorAll('bass').forEach(e=>e.remove());
          const invEl=doc.createElement('inversion');invEl.textContent=String(inv);
          if(kindEl.nextSibling)kindEl.parentNode.insertBefore(invEl,kindEl.nextSibling);else kindEl.parentNode.appendChild(invEl);
          const bass=doc.createElement('bass');
          const bs=doc.createElement('bass-step');bs.textContent=bStep;bass.appendChild(bs);
          if(bAlter!==0){const baEl=doc.createElement('bass-alter');baEl.textContent=String(bAlter);bass.appendChild(baEl)}
          if(invEl.nextSibling)invEl.parentNode.insertBefore(bass,invEl.nextSibling);else invEl.parentNode.appendChild(bass);
          ok++;
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${ok}개 적용${skip?`, ${skip}개 생략`:''}`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'코드 자리바꿈');
      lines.push({m:'✅ 자리바꿈 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,inv,showProgress,hideProgress,onFilesUpdate]);

  const runInversionReset=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('원위치 복원 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[];const updatedFiles=[];
    for(const file of files){
      const doc=cloneDoc(file.xmlDoc);let n=0;
      doc.querySelectorAll('harmony').forEach(h=>{
        const invEl=h.querySelector('inversion');const bassEl=h.querySelector('bass');
        if(invEl){invEl.remove();n++}if(bassEl){bassEl.remove();n++}
      });
      updatedFiles.push({...file,xmlDoc:doc});
      lines.push({m:`✓ ${file.name}: ${n}개 요소 제거`,t:'ok'});
    }
    onFilesUpdate(updatedFiles,'코드 자리바꿈 원위치');
    lines.push({m:'✅ 원위치 복원 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">코드 도구</h2>
    <p className="panel__description">코드 심볼을 일괄 변경하거나, 마디별 음표 분석을 통해 코드를 자동 삽입합니다.</p>
    <div className="card"><div className="card__title">🔄 코드 심볼 일괄 변경</div>
      <div className="card__text">기존 코드 기호를 찾아 다른 코드로 일괄 교체합니다.</div>
      {rules.map((r,i)=>
        <div className="chord-rule" key={i}>
          <input className="form-input form-input--mono" placeholder="원본 (예: Am)" value={r.from} onChange={e=>updateRule(i,'from',e.target.value)}/>
          <span className="chord-rule__arrow">→</span>
          <input className="form-input form-input--mono" placeholder="변경 (예: Am7)" value={r.to} onChange={e=>updateRule(i,'to',e.target.value)}/>
          <button className="chord-rule__remove" onClick={()=>removeRule(i)}>✕</button>
        </div>
      )}
      <button className="btn btn--secondary" onClick={addRule}>+ 규칙 추가</button>
      <div className="btn-row"><button className="btn btn--primary" onClick={runReplace}>▶ 코드 일괄 변경</button></div>
    </div>
    <div className="card"><div className="card__title">🎸 코드 자동 분석 & 삽입</div>
      <div className="card__text">수직적 음표를 마디 단위로 분석하여 코드를 악보 상단에 자동 삽입합니다.</div>
      <div className="chip-group"><Chip on={replaceExisting} onClick={()=>setReplaceExisting(!replaceExisting)}>기존 코드 덮어쓰기</Chip></div>
      <div className="btn-row"><button className="btn btn--primary" onClick={runAutoInsert}>▶ 코드 분석 & 삽입</button></div>
    </div>
    <div className="card"><div className="card__title">🔁 코드 자리바꿈 (Inversion)</div>
      <div className="card__text">모든 코드 기호에 자리바꿈 번호와 베이스 음을 지정합니다. (예: C major + 1st → C/E)</div>
      <div className="chip-group">
        <Chip on={inv===1} onClick={()=>setInv(1)}>1st inversion</Chip>
        <Chip on={inv===2} onClick={()=>setInv(2)}>2nd inversion</Chip>
        <Chip on={inv===3} onClick={()=>setInv(3)}>3rd inversion</Chip>
        <Chip on={inv===4} onClick={()=>setInv(4)}>4th inversion</Chip>
        <Chip on={inv===5} onClick={()=>setInv(5)}>5th inversion</Chip>
      </div>
      <div className="btn-row">
        <button className="btn btn--primary" onClick={runInversion}>▶ 자리바꿈 적용</button>
        <button className="btn btn--secondary" onClick={runInversionReset}>↺ 원위치</button>
      </div>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: NUMBER NOTATION
   ============================================================== */
function NumberingPanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [mode,setMode]=useState('solfege');
  const [showOct,setShowOct]=useState(true);
  const [showSharp,setShowSharp]=useState(false);
  const [keepLyrics,setKeepLyrics]=useState(false);
  const [log,setLog]=useState([]);
  const baselineRef=useRef(null);
  const lastOutRef=useRef(null);

  useEffect(()=>{
    if(files===lastOutRef.current)return;
    baselineRef.current=files.map(f=>({name:f.name,xmlDoc:cloneDoc(f.xmlDoc)}));
  },[files]);

  const preview=useMemo(()=>{
    if(mode==='original')return[];
    const ex=[{s:'C',a:0,o:4},{s:'D',a:0,o:4},{s:'E',a:0,o:4},{s:'F',a:0,o:4},{s:'G',a:0,o:4},{s:'A',a:0,o:4},{s:'B',a:0,o:4},{s:'C',a:0,o:5},{s:'F',a:1,o:4}];
    return ex.map(n=>({note:n.s+(n.a===1?'#':n.a===-1?'♭':'')+n.o,num:noteToNumStr(n.s,n.a,n.o,0,mode,showOct,showSharp)}));
  },[mode,showOct,showSharp]);

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress(mode==='original'?'기존 가사 복원 중...':'숫자 악보 생성 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      const baseline=baselineRef.current||files.map(f=>({name:f.name,xmlDoc:cloneDoc(f.xmlDoc)}));
      if(!baselineRef.current)baselineRef.current=baseline;
      for(let fi=0;fi<files.length;fi++){
        const file=files[fi];
        if(mode==='original'){
          const baseDoc=baseline[fi]?.xmlDoc;
          if(!baseDoc){lines.push({m:`⚠ ${file.name}: 원본 정보 없음`,t:'warn'});continue}
          const doc=cloneDoc(file.xmlDoc);
          const baseNotes=baseDoc.querySelectorAll('note');
          const curNotes=doc.querySelectorAll('note');
          let cnt=0;
          curNotes.forEach((note,i)=>{
            note.querySelectorAll('lyric').forEach(l=>l.remove());
            const src=baseNotes[i];if(!src)return;
            src.querySelectorAll('lyric').forEach(origLyric=>{
              note.appendChild(doc.importNode(origLyric,true));cnt++;
            });
          });
          updatedFiles.push({...file,xmlDoc:doc});
          lines.push({m:`✓ ${file.name}: ${cnt}개 원본 가사 복원`,t:'ok'});
          continue;
        }
        const doc=cloneDoc(file.xmlDoc);const kr=getKeyRoot(doc);let cnt=0;
        doc.querySelectorAll('note').forEach(note=>{
          if(note.querySelector('rest'))return;
          const p=getNotePitch(note);if(!p)return;
          const numStr=noteToNumStr(p.step,p.alter,p.octave,kr,mode,showOct,showSharp);
          let ln=1;
          if(keepLyrics){note.querySelectorAll('lyric').forEach(l=>{const n=parseInt(l.getAttribute('number')||'1');if(n>=ln)ln=n+1})}
          else note.querySelectorAll('lyric').forEach(l=>l.remove());
          const lyric=doc.createElement('lyric');lyric.setAttribute('number',String(ln));
          const syl=doc.createElement('syllabic');syl.textContent='single';lyric.appendChild(syl);
          const txt=doc.createElement('text');txt.textContent=numStr;lyric.appendChild(txt);
          note.appendChild(lyric);cnt++;
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${cnt}개 숫자 삽입`,t:'ok'});
      }
      lastOutRef.current=updatedFiles;
      onFilesUpdate(updatedFiles,'숫자 악보 생성');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,mode,showOct,showSharp,keepLyrics,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">숫자 악보</h2>
    <p className="panel__description">음높이를 숫자로 변환하여 가사(Lyric) 위치에 삽입합니다.</p>
    <div className="card"><div className="card__title">🔢 번호 체계</div>
      <div className="chip-group">
        <Chip on={mode==='solfege'} onClick={()=>setMode('solfege')}>숫자 (도=1)</Chip>
        <Chip on={mode==='fixed'} onClick={()=>setMode('fixed')}>고정 도법 (C=1)</Chip>
        <Chip on={mode==='movable'} onClick={()=>setMode('movable')}>이동 도법</Chip>
        <Chip on={mode==='korean'} onClick={()=>setMode('korean')}>한국어 계이름</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 옵션</div>
      <div className="chip-group">
        <Chip on={showOct} onClick={()=>setShowOct(!showOct)}>옥타브 점 표시</Chip>
        <Chip on={showSharp} onClick={()=>setShowSharp(!showSharp)}># / ♭ 표시</Chip>
        <Chip on={keepLyrics} onClick={()=>setKeepLyrics(!keepLyrics)}>기존 가사 유지</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">👁️ 미리보기</div>
      <div className="preview-grid">{preview.map((p,i)=>
        <div className="preview-cell preview-cell--number" key={i}>
          <div className="preview-cell__note-label">{p.note}</div>
          <div className="preview-cell__number-value">{p.num}</div>
        </div>
      )}</div>
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 숫자 악보 생성</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: LYRIC STYLE
   ============================================================== */
const LYRIC_FONT_FAMILIES=[
  {id:'',label:'기본값'},
  {id:'Malgun Gothic',label:'맑은 고딕'},
  {id:'Nanum Gothic',label:'나눔고딕'},
  {id:'Nanum Myeongjo',label:'나눔명조'},
  {id:'Gothic',label:'고딕'},
  {id:'Times New Roman',label:'Times New Roman'},
  {id:'Arial',label:'Arial'},
  {id:'Georgia',label:'Georgia'},
  {id:'Courier New',label:'Courier New'},
  {id:'Comic Sans MS',label:'Comic Sans MS'},
];

function LyricStylePanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [size,setSize]=useState(10);
  const [applySize,setApplySize]=useState(true);
  const [bold,setBold]=useState(false);
  const [applyBold,setApplyBold]=useState(true);
  const [italic,setItalic]=useState(false);
  const [applyItalic,setApplyItalic]=useState(true);
  const [family,setFamily]=useState('');
  const [applyFamily,setApplyFamily]=useState(false);
  const [log,setLog]=useState([]);

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('가사 스타일 적용 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;
        doc.querySelectorAll('lyric').forEach(lyric=>{
          const targets=lyric.querySelectorAll('text, syllabic, elision, extend');
          const texts=lyric.querySelectorAll('text');
          if(!texts.length)return;
          texts.forEach(t=>{
            if(applySize)t.setAttribute('font-size',String(size));
            if(applyBold)t.setAttribute('font-weight',bold?'bold':'normal');
            if(applyItalic)t.setAttribute('font-style',italic?'italic':'normal');
            if(applyFamily){if(family)t.setAttribute('font-family',family);else t.removeAttribute('font-family')}
            cnt++;
          });
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${cnt}개 가사 텍스트 수정`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'가사 스타일 적용');
      lines.push({m:'✅ 가사 스타일 적용 완료',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,size,applySize,bold,applyBold,italic,applyItalic,family,applyFamily,showProgress,hideProgress,onFilesUpdate]);

  const runReset=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('가사 스타일 초기화 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[];const updatedFiles=[];
    for(const file of files){
      const doc=cloneDoc(file.xmlDoc);let cnt=0;
      doc.querySelectorAll('lyric text').forEach(t=>{
        ['font-size','font-weight','font-style','font-family','color'].forEach(a=>t.removeAttribute(a));cnt++;
      });
      updatedFiles.push({...file,xmlDoc:doc});
      lines.push({m:`✓ ${file.name}: ${cnt}개 초기화`,t:'ok'});
    }
    onFilesUpdate(updatedFiles,'가사 스타일 초기화');
    lines.push({m:'✅ 초기화 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,showProgress,hideProgress,onFilesUpdate]);

  const runColorByPitch=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('계이름 색상 적용 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;let skipRest=0;
        doc.querySelectorAll('note').forEach(note=>{
          const lyrics=note.querySelectorAll('lyric');if(!lyrics.length)return;
          if(note.querySelector('rest')){skipRest++;return}
          const p=getNotePitch(note);if(!p)return;
          const color=NOTE_COLORS[p.step];if(!color)return;
          lyrics.forEach(lyric=>{
            lyric.querySelectorAll('text').forEach(t=>{t.setAttribute('color',color);cnt++});
          });
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${cnt}개 가사에 계이름 색상 적용`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'가사 색상 적용');
      lines.push({m:'✅ 가사 색상 적용 완료',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,showProgress,hideProgress,onFilesUpdate]);

  const previewStyle={
    fontSize:applySize?`${size*1.5}px`:undefined,
    fontWeight:applyBold?(bold?'bold':'normal'):undefined,
    fontStyle:applyItalic?(italic?'italic':'normal'):undefined,
    fontFamily:applyFamily&&family?family:undefined,
  };

  return <div>
    <h2 className="panel__heading">가사 스타일</h2>
    <p className="panel__description">악보 내 모든 가사(lyric)의 글꼴·크기·굵기·기울기를 일괄 변경합니다.</p>

    <div className="card"><div className="card__title">🔠 크기</div>
      <div className="chip-group"><Chip on={applySize} onClick={()=>setApplySize(!applySize)}>크기 적용</Chip></div>
      <label className="form-label">폰트 크기 (pt)</label>
      <input className="form-input form-input--mono" type="number" value={size} min={4} max={72}
        onChange={e=>setSize(parseFloat(e.target.value)||10)} disabled={!applySize}/>
    </div>

    <div className="card"><div className="card__title">𝐁 굵기</div>
      <div className="chip-group">
        <Chip on={applyBold} onClick={()=>setApplyBold(!applyBold)}>굵기 적용</Chip>
        <Chip on={bold} onClick={()=>setBold(!bold)}>Bold</Chip>
      </div>
    </div>

    <div className="card"><div className="card__title">𝐼 기울기</div>
      <div className="chip-group">
        <Chip on={applyItalic} onClick={()=>setApplyItalic(!applyItalic)}>기울기 적용</Chip>
        <Chip on={italic} onClick={()=>setItalic(!italic)}>Italic</Chip>
      </div>
    </div>

    <div className="card"><div className="card__title">🔤 글꼴</div>
      <div className="chip-group"><Chip on={applyFamily} onClick={()=>setApplyFamily(!applyFamily)}>글꼴 적용</Chip></div>
      <div className="chip-group">
        {LYRIC_FONT_FAMILIES.map(f=><Chip key={f.id||'default'} on={family===f.id} onClick={()=>setFamily(f.id)}>{f.label}</Chip>)}
      </div>
    </div>

    <div className="card"><div className="card__title">👁️ 미리보기</div>
      <div style={{padding:'12px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'6px',textAlign:'center',...previewStyle}}>
        나는 가사입니다 Lyric Sample
      </div>
    </div>

    <div className="card"><div className="card__title">🎨 계이름 색상으로 가사 채색</div>
      <div className="card__text">각 음표(C·D·E·F·G·A·B)의 고유 색상을 해당 가사 텍스트에 적용합니다.</div>
      <div className="chip-group">
        {Object.entries(NOTE_COLORS).map(([n,c])=>
          <span key={n} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 8px',border:'1px solid #e5e7eb',borderRadius:'4px',marginRight:'4px'}}>
            <span style={{width:'10px',height:'10px',borderRadius:'50%',background:c,display:'inline-block'}}/>
            <span style={{color:c,fontWeight:'bold'}}>{n}</span>
          </span>
        )}
      </div>
      <div className="btn-row"><button className="btn btn--primary" onClick={runColorByPitch}>▶ 계이름 색상 적용</button></div>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={run}>▶ 가사 스타일 적용</button>
      <button className="btn btn--secondary" onClick={runReset}>↺ 초기화</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: CHORD ANALYSIS
   ============================================================== */
function ChordsPanel({files,showProgress,hideProgress}){
  const [log,setLog]=useState([]);
  const [harmonyData,setHarmonyData]=useState(null);
  const [harmonyError,setHarmonyError]=useState('');
  const [harmonyEndpoint,setHarmonyEndpoint]=useState(()=>{
    try{return localStorage.getItem('music21HarmonyEndpoint')||DEFAULT_MUSIC21_HARMONY_ENDPOINT}
    catch(e){return DEFAULT_MUSIC21_HARMONY_ENDPOINT}
  });

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('코드 분석 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[];
    for(const file of files){
      lines.push({m:`── ${file.name} ──`,t:'info'});
      const parts=file.xmlDoc.querySelectorAll('part');
      const mc=parts[0]?.querySelectorAll('measure')?.length||0;
      for(let m=0;m<mc;m++){
        const ns=[];
        parts.forEach(part=>{const meas=part.querySelectorAll('measure')[m];if(!meas)return;
          meas.querySelectorAll('note').forEach(note=>{if(note.querySelector('rest'))return;
            const p=getNotePitch(note);if(!p)return;ns.push(noteToMidi(p.step,p.alter,p.octave)%12)})});
        const chord=detectChord(ns);
        if(chord)lines.push({m:`  마디 ${m+1}: ${chord}`});
      }
    }
    lines.push({m:'✅ 분석 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,showProgress,hideProgress]);

  const runIdentify=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('코드 기호 파악 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[];let grandTotal=0;const grandTally={};
    for(const file of files){
      lines.push({m:`── ${file.name} ──`,t:'info'});
      const parts=file.xmlDoc.querySelectorAll('part');
      const mc=parts[0]?.querySelectorAll('measure')?.length||0;
      const tally={};let count=0;
      for(let m=0;m<mc;m++){
        const seen=[];
        parts.forEach(part=>{const meas=part.querySelectorAll('measure')[m];if(!meas)return;
          meas.querySelectorAll('harmony').forEach(h=>{
            const cs=harmonyToString(h);if(!cs)return;
            seen.push(cs);tally[cs]=(tally[cs]||0)+1;grandTally[cs]=(grandTally[cs]||0)+1;count++;grandTotal++;
          });
        });
        if(seen.length)lines.push({m:`  마디 ${m+1}: ${seen.join(', ')}`});
      }
      if(!count){lines.push({m:'  (코드 기호 없음)',t:'warn'});continue}
      const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
      lines.push({m:`  총 ${count}개 · 고유 ${sorted.length}종: ${sorted.map(([k,v])=>`${k}(${v})`).join(', ')}`,t:'ok'});
    }
    if(files.length>1&&grandTotal){
      const sorted=Object.entries(grandTally).sort((a,b)=>b[1]-a[1]);
      lines.push({m:`── 전체 합계 ──`,t:'info'});
      lines.push({m:`총 ${grandTotal}개 · 고유 ${sorted.length}종: ${sorted.map(([k,v])=>`${k}(${v})`).join(', ')}`,t:'ok'});
    }
    lines.push({m:'✅ 코드 기호 파악 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,showProgress,hideProgress]);

  const updateHarmonyEndpoint=useCallback(e=>{
    const next=e.target.value;
    setHarmonyEndpoint(next);
    try{localStorage.setItem('music21HarmonyEndpoint',next)}catch(err){}
  },[]);

  const runMusic21Harmony=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const endpoint=(harmonyEndpoint||DEFAULT_MUSIC21_HARMONY_ENDPOINT).trim();
    if(!endpoint){alert('music21 API 주소를 입력해주세요.');return}
    setHarmonyError('');
    showProgress('music21 화성 분석 중...');
    const payload={
      scores:files.map(file=>({
        name:file.name,
        xml:new XMLSerializer().serializeToString(file.xmlDoc)
      }))
    };
    try{
      const res=await fetch(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      if(!res.ok){
        const msg=await res.text();
        throw new Error(`${res.status} ${msg.slice(0,160)}`);
      }
      setHarmonyData(await res.json());
    }catch(e){
      setHarmonyData(null);
      setHarmonyError(`music21 API 연결 실패: ${e.message}`);
    }finally{
      hideProgress();
    }
  },[files,harmonyEndpoint,showProgress,hideProgress]);

  return <div>
    <h2 className="panel__heading">코드 분석</h2>
    <p className="panel__description">악보에 존재하는 코드 기호(harmony)를 파악하거나, 수직 음향과 music21 로마숫자 분석으로 마디별 화성을 추출합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runIdentify}>🔖 코드 기호 파악</button>
      <button className="btn btn--secondary" onClick={run}>▶ 수직 음향 분석</button>
    </div>

    <div className="card harmony-analysis-card">
      <div className="card__title">music21 고급 코드/화성 분석</div>
      <div className="card__text">music21의 chordify()로 수직 음향을 묶고 romanNumeralFromChord()로 조성 안에서 로마숫자 기능화성을 추정합니다.</div>
      <label className="form-label">music21 API 주소</label>
      <input className="form-input form-input--mono" value={harmonyEndpoint} onChange={updateHarmonyEndpoint}/>
      <div className="btn-row">
        <button className="btn btn--secondary" onClick={runMusic21Harmony}>고급 화성 분석</button>
      </div>
      {harmonyError && <div className="key-analysis-warning">{harmonyError}</div>}
    </div>

    {harmonyData && <div className="harmony-analysis-results">
      {harmonyData.summary && <div className="stats-row">
        <div className="stat-tile"><div className="stat-tile__value">{harmonyData.summary.successful}</div><div className="stat-tile__label">분석 성공</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{harmonyData.summary.failed}</div><div className="stat-tile__label">분석 실패</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{harmonyData.summary.total_chords}</div><div className="stat-tile__label">추출 화성</div></div>
      </div>}
      {harmonyData.results?.map((r,i)=><div className="harmony-result" key={i}>
        <div className="key-result__header">
          <span className="key-result__name">{r.name}</span>
          <span className={`key-result__badge key-result__badge--${r.status||'ok'}`}>{r.status==='ok'?'music21':'오류'}</span>
        </div>
        {r.key && <div className="key-result__sub">분석 조성: {r.key.label_ko||r.key.label}</div>}
        {r.chords?.length
          ? <div className="harmony-table">
              {r.chords.map((c,j)=><div className="harmony-row" key={j}>
                <span className="harmony-row__measure">m.{c.measure}</span>
                <span className="harmony-row__chord">{c.figure||c.common_name}</span>
                <span className="harmony-row__roman">{c.roman||'-'}</span>
                <span className="harmony-row__quality">{c.quality||c.common_name}</span>
              </div>)}
            </div>
          : <div className="key-result__sub">추출된 화성이 없습니다.</div>}
        {r.progressions?.length>0 && <div className="key-result__alts">
          진행: {r.progressions.slice(0,8).map(p=><span key={p.progression} className="composer-tag">{p.progression} ({p.count})</span>)}
        </div>}
        {r.error && <div className="key-analysis-warning">{r.error}</div>}
      </div>)}
    </div>}
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: ROMAN NUMERAL ANALYSIS
   ============================================================== */
function RomanAnalysisPanel({files,activeFile=0,showProgress,hideProgress,onFilesUpdate}){
  const [analysis,setAnalysis]=useState(null);
  const [log,setLog]=useState([]);
  const fileIndex=files[activeFile]?activeFile:0;
  const file=files[fileIndex];
  const cadenceTypes=['완전종지 (PAC)','반종지 (HC)','변격종지 (PC)','위종지 (DC)'];

  const keyInfo=useMemo(()=>{
    if(!file?.xmlDoc||!window.RomanAnalysis)return null;
    return window.RomanAnalysis.getKeyInfo(file.xmlDoc);
  },[file]);

  const runAnalysis=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드하세요.');return}
    if(!window.RomanAnalysis){alert('로마 숫자 분석 모듈을 불러오지 못했습니다.');return}
    setLog([]);
    showProgress('로마 숫자 분석 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const result=window.RomanAnalysis.detectRomanNumeral(file.xmlDoc);
      setAnalysis(result);
      const lines=[
        {m:`${file.name} · ${result.keyName}장조 · ${result.rows.length}개 코드 분석`,t:'info'},
        {m:`종지 ${result.cadences.length}개 · 진행 요약 ${result.progressions.length}개`,t:'ok'},
      ];
      if(!result.rows.length)lines.push({m:'분석 가능한 수직 음향을 찾지 못했습니다.',t:'warn'});
      setLog(lines);
    }catch(e){
      setLog([{m:e.message,t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files.length,file,showProgress,hideProgress]);

  const insertIntoScore=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드하세요.');return}
    if(!window.RomanAnalysis){alert('로마 숫자 분석 모듈을 불러오지 못했습니다.');return}
    showProgress('로마 숫자를 악보에 삽입 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const doc=cloneDoc(file.xmlDoc);
      const source=window.RomanAnalysis.detectRomanNumeral(doc);
      const count=window.RomanAnalysis.insertRomanNumerals(doc,source.rows);
      const xmlString=new XMLSerializer().serializeToString(doc);
      const updatedFiles=files.map((f,i)=>i===fileIndex?{...f,xmlDoc:doc,xmlString}:f);
      onFilesUpdate(updatedFiles,'로마 숫자 삽입');
      setAnalysis(window.RomanAnalysis.detectRomanNumeral(doc));
      setLog([{m:`${count}개 마디에 로마 숫자를 삽입했습니다.`,t:'ok'}]);
    }catch(e){
      setLog([{m:e.message,t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files,file,fileIndex,onFilesUpdate,showProgress,hideProgress]);

  return <div>
    <h2 className="panel__heading">로마 숫자 분석</h2>
    <p className="panel__description">첫 조표를 기준으로 마디별 수직 음향을 로마 숫자 화성으로 해석하고 종지를 요약합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runAnalysis} disabled={!files.length}>
        {keyInfo?`${keyInfo.keyName}장조 분석 시작`:'로마 숫자 분석 시작'}
      </button>
      <button className="btn btn--secondary" onClick={insertIntoScore} disabled={!files.length}>
        악보에 삽입
      </button>
    </div>

    {analysis&&<div className="stats-row roman-cadence-grid">
      {cadenceTypes.map(type=>
        <div className="stat-tile" key={type}>
          <div className="stat-tile__value">{analysis.cadenceCounts?.[type]||0}</div>
          <div className="stat-tile__label">{type}</div>
        </div>
      )}
    </div>}

    {analysis&&<div className="card">
      <div className="card__title">코드 진행 Top 5</div>
      {analysis.progressions.length?
        <ol className="roman-progressions">
          {analysis.progressions.map(item=><li key={item.pair}><span>{item.pair}</span><b>{item.count}</b></li>)}
        </ol>:
        <div className="card__text">반복되는 2-chord 진행이 아직 없습니다.</div>}
    </div>}

    {analysis&&<div className="roman-table-wrap">
      <table className="roman-table">
        <thead><tr><th>마디번호</th><th>박자</th><th>코드명</th><th>로마숫자</th><th>종지여부</th></tr></thead>
        <tbody>
          {analysis.rows.map((row,index)=>
            <tr key={`${row.measure}-${row.beat}-${index}`}>
              <td>{row.measure}</td>
              <td>{row.beat}</td>
              <td>{row.chordName}</td>
              <td className="roman-table__numeral">{row.roman}</td>
              <td>{row.cadence||'-'}</td>
            </tr>
          )}
        </tbody>
      </table>
    </div>}

    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: FINGERING
   ============================================================== */
function RecorderFingeringSvg({pattern,small=false}){
  const values=Array.isArray(pattern)?pattern:[];
  const width=small?30:40;
  const height=small?120:160;
  const r=small?6:8;
  const gap=small?14:18;
  const startY=small?12:14;
  const clipId=useMemo(()=>`half-${Math.random().toString(36).slice(2)}`,[]);
  return <svg className="fingering-recorder" width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-label="리코더 운지">
    <defs><clipPath id={clipId}><rect x="0" y="0" width={width/2} height={height}/></clipPath></defs>
    {values.map((v,i)=>{
      const cy=startY+i*gap;
      return <g key={i}>
        <circle cx={width/2} cy={cy} r={r} fill="#fff" stroke="#222" strokeWidth="1.6"/>
        {v===1&&<circle cx={width/2} cy={cy} r={r} fill="#222"/>}
        {v===0.5&&<circle cx={width/2} cy={cy} r={r} fill="#222" clipPath={`url(#${clipId})`}/>}
      </g>;
    })}
  </svg>;
}

function KalimbaFingeringSvg({tine,small=false}){
  const width=small?132:180;
  const height=small?84:116;
  const count=17;
  const tineW=small?6:8;
  const gap=small?1.5:2;
  const baseY=small?76:104;
  return <svg className="fingering-kalimba" width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-label="칼림바 운지">
    <rect x="6" y={baseY-9} width={width-12} height="8" rx="3" fill="#3d4550"/>
    {Array.from({length:count}).map((_,i)=>{
      const n=i+1;
      const center=Math.abs(i-8);
      const h=(small?70:96)-center*(small?3.2:4.4);
      const x=(width-(count*tineW+(count-1)*gap))/2+i*(tineW+gap);
      const active=n===Number(tine);
      return <rect key={n} x={x} y={baseY-h} width={tineW} height={h} rx="3"
        fill={active?'#f59e0b':'#e5e7eb'} stroke={active?'#b45309':'#9ca3af'} strokeWidth="1"/>;
    })}
    {tine&&<text x={width/2} y={height-2} textAnchor="middle" fontSize={small?10:12} fill="#92400e" fontWeight="700">{tine}</text>}
  </svg>;
}

function FingeringDiagram({item,small=false}){
  if(!item||!item.found)return <span className="fingering-missing">-</span>;
  if(item.type==='kalimba')return <KalimbaFingeringSvg tine={item.value} small={small}/>;
  return <RecorderFingeringSvg pattern={item.value} small={small}/>;
}

function FingeringPanel({files,activeFile=0,showProgress,hideProgress,onFilesUpdate}){
  const [instrument,setInstrument]=useState('recorder');
  const [partId,setPartId]=useState('all');
  const [log,setLog]=useState([]);
  const file=files[activeFile]||files[0];
  const parts=useMemo(()=>file?.xmlDoc&&window.FingeringCore?window.FingeringCore.getParts(file.xmlDoc):[],[file]);
  const rows=useMemo(()=>file?.xmlDoc&&window.FingeringCore?window.FingeringCore.collectNoteFingerings(file.xmlDoc,instrument,partId):[],[file,instrument,partId]);
  const foundCount=rows.filter(r=>r.found).length;
  const missingCount=rows.length-foundCount;
  const previewRows=rows.filter(r=>r.found).slice(0,18);

  useEffect(()=>{
    if(partId!=='all'&&!parts.some(p=>p.id===partId))setPartId('all');
  },[parts,partId]);

  const insertIntoScore=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드하세요.');return}
    if(!window.FingeringCore){alert('운지법 모듈을 불러오지 못했습니다.');return}
    setLog([]);
    showProgress('운지법을 악보에 삽입 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const fileIndex=files[activeFile]?activeFile:0;
      const doc=cloneDoc(files[fileIndex].xmlDoc);
      const result=window.FingeringCore.insertFingerings(doc,instrument,partId);
      const xmlString=new XMLSerializer().serializeToString(doc);
      const updatedFiles=files.map((f,i)=>i===fileIndex?{...f,xmlDoc:doc,xmlString}:f);
      onFilesUpdate(updatedFiles,'운지법 삽입');
      setLog([
        {m:`${result.count}개 음표에 운지법을 삽입했습니다.`,t:'ok'},
        ...(result.missing?[{m:`운지 데이터가 없는 음표 ${result.missing}개는 건너뛰었습니다.`,t:'warn'}]:[]),
      ]);
    }catch(e){
      setLog([{m:e.message,t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files,activeFile,instrument,partId,onFilesUpdate,showProgress,hideProgress]);

  return <div>
    <h2 className="panel__heading">운지법 표시</h2>
    <p className="panel__description">악기별 운지표를 기준으로 음표 옆 운지 다이어그램을 미리보고 MusicXML에 운지 번호를 삽입합니다.</p>
    <div className="card">
      <div className="card__title">🖐 악기 선택</div>
      <select className="form-select" value={instrument} onChange={e=>setInstrument(e.target.value)}>
        {Object.entries(window.FingeringCore?.INSTRUMENTS||{}).map(([id,cfg])=><option key={id} value={id}>{cfg.label}</option>)}
      </select>
      <label className="form-label">파트 선택</label>
      <select className="form-select" value={partId} onChange={e=>setPartId(e.target.value)} disabled={!parts.length}>
        <option value="all">전체 파트</option>
        {parts.map(p=><option key={p.id} value={p.id}>{p.name} ({p.id})</option>)}
      </select>
    </div>

    <div className="stats-row fingering-summary">
      <div className="stat-tile"><div className="stat-tile__value">{rows.length}</div><div className="stat-tile__label">대상 음표</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{foundCount}</div><div className="stat-tile__label">매핑됨</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{missingCount}</div><div className="stat-tile__label">미지원</div></div>
    </div>

    <div className="card">
      <div className="card__title">미리보기</div>
      {!previewRows.length?<div className="card__text">표시할 운지 데이터가 없습니다.</div>:
        <div className="fingering-preview-grid">
          {previewRows.map((row,i)=><div className="fingering-preview-item" key={`${row.partId}-${row.measure}-${row.noteName}-${i}`}>
            <FingeringDiagram item={row} small/>
            <div className="fingering-preview-note">{row.noteName}</div>
            <div className="fingering-preview-text">{row.display}</div>
          </div>)}
        </div>}
    </div>

    <div className="fingering-table-wrap">
      <table className="roman-table fingering-table">
        <thead><tr><th>파트</th><th>마디</th><th>음표</th><th>운지</th><th>다이어그램</th></tr></thead>
        <tbody>
          {rows.slice(0,160).map((row,i)=><tr key={`${row.partId}-${row.measure}-${row.noteName}-${i}`}>
            <td>{row.partId}</td><td>{row.measure}</td><td>{row.noteName}</td>
            <td className={row.found?'':'fingering-missing'}>{row.display}</td>
            <td><FingeringDiagram item={row} small/></td>
          </tr>)}
          {!rows.length&&<tr><td colSpan="5">파일을 업로드하면 음표-운지 매핑이 표시됩니다.</td></tr>}
        </tbody>
      </table>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={insertIntoScore} disabled={!files.length||!foundCount}>악보에 운지 번호 삽입</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: VOICE LEADING
   ============================================================== */
function VoiceLeadingPanel({files,activeFile=0,showProgress,hideProgress}){
  const [analysis,setAnalysis]=useState(null);
  const [showSuggestions,setShowSuggestions]=useState(false);
  const [log,setLog]=useState([]);
  const file=files[activeFile]||files[0];
  const severityLabel={error:'오류',warning:'경고',info:'정보'};

  const runAnalysis=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드하세요.');return}
    if(!window.VoiceLeadingCore){alert('성부 진행 분석 모듈을 불러오지 못했습니다.');return}
    setLog([]);
    setShowSuggestions(false);
    showProgress('성부 진행 분석 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const result=window.VoiceLeadingCore.analyzeVoiceLeading(file.xmlDoc);
      setAnalysis(result);
      setLog([
        {m:`${file.name} · 성부 ${result.parts.length}개 · 위반 ${result.violations.length}건`,t:'info'},
        {m:`성부 진행 점수 ${result.score}점`,t:result.counts.error?'warn':'ok'},
      ]);
    }catch(e){
      setLog([{m:e.message,t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files.length,file,showProgress,hideProgress]);

  const scrollToMeasure=useCallback(measure=>{
    window.dispatchEvent(new CustomEvent('mxl-scroll-measure',{detail:{measure}}));
  },[]);

  const counts=analysis?.counts||{error:0,warning:0,info:0};
  const violations=analysis?.violations||[];

  return <div>
    <h2 className="panel__heading">성부 진행 분석</h2>
    <p className="panel__description">파트 간 진행을 비교해 평행5도, 평행옥타브, 숨은5도, 성부교차, 큰 도약, 연속 도약을 검사합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runAnalysis} disabled={!files.length}>🔍 분석 실행</button>
      <button className="btn btn--secondary" onClick={()=>setShowSuggestions(s=>!s)} disabled={!violations.length}>수정 제안</button>
    </div>

    {analysis&&<div className="stats-row voiceleading-summary">
      <div className="stat-tile"><div className="stat-tile__value">{violations.length}</div><div className="stat-tile__label">총 위반</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{counts.error||0}</div><div className="stat-tile__label">오류</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{counts.warning||0}</div><div className="stat-tile__label">경고</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{analysis.score}</div><div className="stat-tile__label">점수</div></div>
    </div>}

    {showSuggestions&&violations.length>0&&<div className="card">
      <div className="card__title">수정 제안</div>
      <div className="voiceleading-suggestions">
        {violations.map((v,i)=><div className="voiceleading-suggestion" key={`${v.type}-${v.measure}-${v.beat}-${i}`}>{v.suggestion}</div>)}
      </div>
    </div>}

    {analysis&&<div className="voiceleading-table-wrap">
      <table className="roman-table voiceleading-table">
        <thead><tr><th>마디</th><th>박자</th><th>규칙</th><th>설명</th><th>심각도</th></tr></thead>
        <tbody>
          {violations.map((v,i)=><tr key={`${v.type}-${v.measure}-${v.beat}-${i}`} onClick={()=>scrollToMeasure(v.measure)}>
            <td>{v.measure}</td>
            <td>{v.beat}</td>
            <td>{v.type}</td>
            <td>{v.description}</td>
            <td><span className={`severity-pill severity-pill--${v.severity}`}>{severityLabel[v.severity]||v.severity}</span></td>
          </tr>)}
          {!violations.length&&<tr><td colSpan="5">감지된 성부 진행 위반이 없습니다.</td></tr>}
        </tbody>
      </table>
    </div>}

    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: EAR TRAINING
   ============================================================== */
function EarTrainingPanel({files,activeFile=0}){
  const [mode,setMode]=useState('interval');
  const [difficulty,setDifficulty]=useState('normal');
  const [harmonic,setHarmonic]=useState(false);
  const [arpeggio,setArpeggio]=useState(false);
  const [currentQ,setCurrentQ]=useState(null);
  const [dictInput,setDictInput]=useState([]);
  const [dictResult,setDictResult]=useState(null);
  const [state,setState]=useState({score:0,total:0,streak:0,history:[],mistakes:{},lastResult:null});
  const synthRef=useRef(null);
  const file=files[activeFile]||files[0];
  const noteButtons=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'];

  const ensureSynth=useCallback(async()=>{
    if(!window.Tone){alert('Tone.js를 불러오지 못했습니다.');return null}
    await Tone.start();
    if(!synthRef.current)synthRef.current=new Tone.PolySynth(Tone.Synth).toDestination();
    return synthRef.current;
  },[]);

  useEffect(()=>()=>{try{synthRef.current?.dispose?.()}catch(e){}},[]);

  const makeQuestion=useCallback(nextMode=>{
    if(!window.EarTrainingCore)return;
    const m=nextMode||mode;
    setDictResult(null);
    if(m==='interval')setCurrentQ(window.EarTrainingCore.generateIntervalQ(Math.random,difficulty));
    else if(m==='chord')setCurrentQ(window.EarTrainingCore.generateChordQ(Math.random,difficulty));
    else if(file?.xmlDoc){setCurrentQ(window.EarTrainingCore.generateDictationQ(file.xmlDoc,Math.random));setDictInput([]);}
    else setCurrentQ(null);
  },[mode,difficulty,file]);

  useEffect(()=>{makeQuestion(mode)},[mode,difficulty,makeQuestion]);

  const playMidis=useCallback(async(midis,opts={})=>{
    const synth=await ensureSynth();if(!synth)return;
    const notes=midis.map(m=>Tone.Frequency(m,'midi').toNote());
    if(opts.simultaneous)synth.triggerAttackRelease(notes,opts.duration||'1n');
    else notes.forEach((note,i)=>synth.triggerAttackRelease(note,opts.duration||'4n',`+${i*(opts.gap||0.8)}`));
  },[ensureSynth]);

  const playCurrent=useCallback(()=>{
    if(!currentQ)return;
    if(currentQ.mode==='interval')playMidis([currentQ.baseNote,currentQ.targetNote],{simultaneous:harmonic,duration:harmonic?'1n':'4n',gap:0.8});
    if(currentQ.mode==='chord')playMidis(currentQ.notes,{simultaneous:!arpeggio,duration:'1n',gap:0.28});
    if(currentQ.mode==='dictation')playMidis(currentQ.notes.map(n=>n.midi),{simultaneous:false,duration:'4n',gap:0.45});
  },[currentQ,harmonic,arpeggio,playMidis]);

  const answerQuiz=useCallback(answer=>{
    if(!currentQ)return;
    const correct=currentQ.mode==='interval'?currentQ.intervalName:currentQ.type.name;
    setState(prev=>window.EarTrainingCore.gradeAnswer(prev,answer,correct));
    setTimeout(()=>makeQuestion(mode),450);
  },[currentQ,mode,makeQuestion]);

  const gradeDictation=useCallback(()=>{
    if(!currentQ)return;
    const result=window.EarTrainingCore.gradeDictation(currentQ,dictInput);
    setDictResult(result);
    setState(prev=>window.EarTrainingCore.gradeAnswer(prev,result.pitchPercent>=80?'받아쓰기 성공':'받아쓰기 실패','받아쓰기 성공'));
  },[currentQ,dictInput]);

  const resetSession=useCallback(()=>{
    setState({score:0,total:0,streak:0,history:[],mistakes:{},lastResult:null});
    setDictResult(null);
    makeQuestion(mode);
  },[mode,makeQuestion]);

  const accuracy=state.total?Math.round((state.score/state.total)*100):0;
  const weak=window.EarTrainingCore?.topWeak(state.mistakes,3)||[];

  return <div>
    <h2 className="panel__heading">청음 훈련</h2>
    <p className="panel__description">Tone.js로 음정, 코드, 악보 받아쓰기 훈련을 진행하고 세션별 취약 패턴을 추적합니다.</p>
    <div className="card">
      <div className="card__title">모드 선택</div>
      <div className="chip-group">
        <Chip on={mode==='interval'} onClick={()=>setMode('interval')}>음정</Chip>
        <Chip on={mode==='chord'} onClick={()=>setMode('chord')}>코드</Chip>
        <Chip on={mode==='dictation'} onClick={()=>setMode('dictation')}>받아쓰기</Chip>
      </div>
      <label className="form-label">난이도</label>
      <select className="form-select" value={difficulty} onChange={e=>setDifficulty(e.target.value)}>
        <option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움</option>
      </select>
    </div>

    <div className="stats-row eartraining-scoreboard">
      <div className="stat-tile"><div className="stat-tile__value">{state.score}/{state.total}</div><div className="stat-tile__label">정답/전체</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{accuracy}%</div><div className="stat-tile__label">정답률</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{state.streak}</div><div className="stat-tile__label">연속정답</div></div>
    </div>

    <div className={`eartraining-question eartraining-question--${state.lastResult||'idle'}`}>
      <div className="eartraining-question__title">{mode==='interval'?'음정을 듣고 맞혀보세요':mode==='chord'?'코드 유형을 맞혀보세요':'4마디 구간을 듣고 음 이름을 입력하세요'}</div>
      <div className="btn-row">
        <button className="btn btn--primary" onClick={playCurrent} disabled={!currentQ}>▶ 재생</button>
        <button className="btn btn--secondary" onClick={()=>makeQuestion(mode)}>다음 문제</button>
        <button className="btn btn--secondary" onClick={resetSession}>세션 초기화</button>
      </div>
      {mode==='interval'&&<div className="chip-group section-gap"><Chip on={harmonic} onClick={()=>setHarmonic(!harmonic)}>화성적 재생</Chip></div>}
      {mode==='chord'&&<div className="chip-group section-gap"><Chip on={arpeggio} onClick={()=>setArpeggio(!arpeggio)}>아르페지오 재생</Chip></div>}
    </div>

    {mode==='interval'&&<div className="eartraining-answer-grid">
      {window.EarTrainingCore?.INTERVAL_NAMES.map(name=><button className="eartraining-answer" key={name} onClick={()=>answerQuiz(name)}>{name}</button>)}
    </div>}
    {mode==='chord'&&<div className="eartraining-answer-grid">
      {window.EarTrainingCore?.CHORD_TYPES.map(type=><button className="eartraining-answer" key={type.name} onClick={()=>answerQuiz(type.name)}>{type.name}</button>)}
    </div>}
    {mode==='dictation'&&<div className="card">
      <div className="card__title">입력</div>
      {!file?<div className="card__text">받아쓰기에는 업로드된 악보가 필요합니다.</div>:<>
        <div className="eartraining-dict-input">{dictInput.length?dictInput.join(' '):'음표 버튼으로 입력하세요'}</div>
        <div className="eartraining-note-buttons">{noteButtons.map(n=><button className="eartraining-answer" key={n} onClick={()=>setDictInput(v=>[...v,n])}>{n}</button>)}</div>
        <div className="btn-row"><button className="btn btn--secondary" onClick={()=>setDictInput(v=>v.slice(0,-1))}>지우기</button><button className="btn btn--primary" onClick={gradeDictation} disabled={!currentQ}>채점</button></div>
        {dictResult&&<div className="eartraining-dict-result">
          <div>음높이 일치: <b>{dictResult.pitchPercent}%</b></div><div>리듬 일치: <b>{dictResult.rhythmPercent}%</b></div>
          <div className="eartraining-dict-detail">{dictResult.details.map(d=><span className={d.correct?'is-correct':'is-wrong'} key={d.index}>{d.actual||'-'} / {d.expected}</span>)}</div>
        </div>}
      </>}
    </div>}

    <div className="card">
      <div className="card__title">세션 통계</div>
      <div className="eartraining-history">{state.history.map((h,i)=><span key={i} className={h.correct?'is-correct':'is-wrong'}/>)}</div>
      <div className="card__text">취약 패턴: {weak.length?weak.map(w=>`${w.label} ${w.count}회`).join(', '):'아직 누적된 오답이 없습니다.'}</div>
    </div>
  </div>;
}

/* ==============================================================
   PANEL: PATTERN SEARCH
   ============================================================== */
function PatternSearchPanel({files,activeFile=0,onFilesUpdate}){
  const [mode,setMode]=useState('pitch');
  const [pitchInput,setPitchInput]=useState('C D E');
  const [pitchMode,setPitchMode]=useState('pc');
  const [rhythmInput,setRhythmInput]=useState('4 8 8 4');
  const [results,setResults]=useState([]);
  const [motifs,setMotifs]=useState([]);
  const [log,setLog]=useState([]);
  const file=files[activeFile]||files[0];
  const distribution=useMemo(()=>window.PatternSearchCore?.distribution(results)||{byFile:{},byPart:{}},[results]);

  const runSearch=useCallback(()=>{
    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    if(!window.PatternSearchCore){alert('패턴 검색 모듈을 불러오지 못했습니다.');return}
    try{
      let hits=[];
      if(mode==='pitch'){
        const pattern=window.PatternSearchCore.parsePitchPattern(pitchInput);
        if(!pattern.length){alert('검색할 음고 패턴을 입력하세요.');return}
        hits=window.PatternSearchCore.searchPitchPattern(file.xmlDoc,pattern,{mode:pitchMode});
      }else if(mode==='rhythm'){
        const pattern=window.PatternSearchCore.parseRhythmPattern(rhythmInput);
        if(!pattern.length){alert('검색할 리듬 패턴을 입력하세요.');return}
        hits=window.PatternSearchCore.searchRhythmPattern(file.xmlDoc,pattern);
      }else{
        const found=window.PatternSearchCore.detectMotifs(file.xmlDoc);
        setMotifs(found);
        hits=found.flatMap(m=>m.locations.map(loc=>({...loc,motif:m})));
      }
      hits=hits.map(h=>({...h,fileName:file.name}));
      setResults(hits);
      setLog([{m:`${hits.length}개 위치를 찾았습니다.`,t:hits.length?'ok':'warn'}]);
    }catch(e){setLog([{m:e.message,t:'err'}]);}
  },[file,mode,pitchInput,pitchMode,rhythmInput]);

  const appendRhythm=useCallback(token=>{
    setRhythmInput(v=>(v?`${v} `:'')+token);
  },[]);

  const scrollToMeasure=useCallback(measure=>{
    window.dispatchEvent(new CustomEvent('mxl-scroll-measure',{detail:{measure}}));
  },[]);

  const highlight=useCallback(()=>{
    if(!file?.xmlDoc||!results.length)return;
    const doc=cloneDoc(file.xmlDoc);
    let freshMatches=[];
    if(mode==='pitch'){
      const pattern=window.PatternSearchCore.parsePitchPattern(pitchInput);
      freshMatches=window.PatternSearchCore.searchPitchPattern(doc,pattern,{mode:pitchMode});
    }else if(mode==='rhythm'){
      const pattern=window.PatternSearchCore.parseRhythmPattern(rhythmInput);
      freshMatches=window.PatternSearchCore.searchRhythmPattern(doc,pattern);
    }else{
      freshMatches=window.PatternSearchCore.detectMotifs(doc).flatMap(m=>m.locations);
    }
    const result=window.PatternSearchCore.highlightMatches(doc,freshMatches,'#FF6B6B');
    const xmlString=new XMLSerializer().serializeToString(doc);
    const fileIndex=files[activeFile]?activeFile:0;
    const updated=files.map((f,i)=>i===fileIndex?{...f,xmlDoc:doc,xmlString}:f);
    onFilesUpdate(updated,'패턴 하이라이트');
    setLog([{m:`${result.count}개 음표를 하이라이트했습니다.`,t:'ok'}]);
  },[file,files,activeFile,results,mode,pitchInput,pitchMode,rhythmInput,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">음형 패턴 검색</h2>
    <p className="panel__description">음고, 리듬, 반복 모티프를 찾아 위치를 표시하고 MusicXML notehead 색상으로 하이라이트합니다.</p>
    <div className="card">
      <div className="card__title">검색 모드</div>
      <div className="chip-group">
        <Chip on={mode==='pitch'} onClick={()=>setMode('pitch')}>음고 패턴</Chip>
        <Chip on={mode==='rhythm'} onClick={()=>setMode('rhythm')}>리듬 패턴</Chip>
        <Chip on={mode==='motif'} onClick={()=>setMode('motif')}>모티프 자동 감지</Chip>
      </div>
    </div>

    {mode==='pitch'&&<div className="card">
      <div className="card__title">음고 패턴</div>
      <input className="form-input" value={pitchInput} onChange={e=>setPitchInput(e.target.value)} placeholder="C D E F G 또는 도 레 미 파 솔"/>
      <div className="chip-group section-gap">
        <Chip on={pitchMode==='absolute'} onClick={()=>setPitchMode('absolute')}>절대 음고</Chip>
        <Chip on={pitchMode==='pc'} onClick={()=>setPitchMode('pc')}>음계 내 상대 음고</Chip>
      </div>
    </div>}

    {mode==='rhythm'&&<div className="card">
      <div className="card__title">리듬 패턴</div>
      <input className="form-input form-input--mono" value={rhythmInput} onChange={e=>setRhythmInput(e.target.value)} placeholder="4 8 8 4 또는 ♩ ♪ ♪ ♩"/>
      <div className="chip-group section-gap">
        {['♩','♪','♫','2','4','8','16'].map(t=><Chip key={t} on={false} onClick={()=>appendRhythm(t)}>{t}</Chip>)}
      </div>
    </div>}

    <div className="btn-row">
      <button className="btn btn--primary" onClick={runSearch} disabled={!files.length}>🔎 검색 실행</button>
      <button className="btn btn--secondary" onClick={highlight} disabled={!results.length}>하이라이트</button>
    </div>

    <div className="stats-row pattern-summary">
      <div className="stat-tile"><div className="stat-tile__value">{results.length}</div><div className="stat-tile__label">발견 위치</div></div>
      <div className="stat-tile"><div className="stat-tile__value">{Object.keys(distribution.byPart).length}</div><div className="stat-tile__label">파트 수</div></div>
    </div>

    {mode==='motif'&&motifs.length>0&&<div className="card">
      <div className="card__title">모티프 후보</div>
      <div className="pattern-motif-list">
        {motifs.slice(0,12).map(m=><button className="pattern-motif-item" key={m.pattern} onClick={()=>setResults(m.locations.map(loc=>({...loc,fileName:file.name,motif:m})))}>
          <span>{m.pattern}</span><b>{m.count}회</b><em>{m.variant}</em>
        </button>)}
      </div>
    </div>}

    <div className="card">
      <div className="card__title">파트별 분포</div>
      <BarChart data={distribution.byPart} labelWidth={72}/>
    </div>

    <div className="pattern-results">
      <table className="roman-table">
        <thead><tr><th>파일명</th><th>파트</th><th>마디</th><th>박자 위치</th></tr></thead>
        <tbody>
          {results.map((r,i)=><tr key={`${r.partIdx}-${r.measureNum}-${r.beatIdx}-${i}`} onClick={()=>scrollToMeasure(r.measureNum)}>
            <td>{r.fileName}</td><td>{r.partName}</td><td>{r.measureNum}</td><td>{r.beatIdx}</td>
          </tr>)}
          {!results.length&&<tr><td colSpan="4">검색 결과가 없습니다.</td></tr>}
        </tbody>
      </table>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: STATISTICS
   ============================================================== */
function StatsPanel({files,showProgress,hideProgress}){
  const [basicData,setBasicData]=useState(null);
  const [composerData,setComposerData]=useState(null);
  const [difficultyData,setDifficultyData]=useState(null);
  const [keyData,setKeyData]=useState(null);
  const [keyError,setKeyError]=useState('');
  const [keyEndpoint,setKeyEndpoint]=useState(()=>{
    try{return localStorage.getItem('music21KeyEndpoint')||DEFAULT_MUSIC21_KEY_ENDPOINT}
    catch(e){return DEFAULT_MUSIC21_KEY_ENDPOINT}
  });

  const runBasic=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    showProgress('통계 분석 중...');await new Promise(r=>setTimeout(r,50));
    const nc={C:0,D:0,E:0,F:0,G:0,A:0,B:0};const rc={};
    let tn=0,tr=0,tm=0,lo=127,hi=0;
    const rKo={whole:'온음표',half:'2분음표',quarter:'4분음표',eighth:'8분음표','16th':'16분음표','32nd':'32분음표',
      '점whole':'점온음표','점half':'점2분음표','점quarter':'점4분음표','점eighth':'점8분음표'};
    for(const file of files){
      const doc=file.xmlDoc;tm+=doc.querySelectorAll('measure').length;
      doc.querySelectorAll('note').forEach(note=>{
        if(note.querySelector('rest')){tr++;return}
        const p=getNotePitch(note);if(!p)return;tn++;nc[p.step]=(nc[p.step]||0)+1;
        const midi=noteToMidi(p.step,p.alter,p.octave);if(midi<lo)lo=midi;if(midi>hi)hi=midi;
        const te=note.querySelector('type');if(te){let rn=te.textContent;if(note.querySelector('dot'))rn='점'+rn;rc[rn]=(rc[rn]||0)+1}
      });
    }
    const loN=lo<127?midiToNote(lo):null;const hiN=hi>0?midiToNote(hi):null;
    const rcDisplay={};Object.entries(rc).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{rcDisplay[rKo[k]||k]=v});
    setBasicData({fileCount:files.length,totalNotes:tn,totalRests:tr,totalMeasures:tm,
      lowest:fmtNote(loN),highest:fmtNote(hiN),noteCounts:nc,rhythmCounts:rcDisplay});
    hideProgress();
  },[files,showProgress,hideProgress]);

  const runComposer=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    showProgress('작곡 스타일 분석 중...');await new Promise(r=>setTimeout(r,50));
    const allIv={},allProg={},phrases=[];
    let tn=0,tm=0,steps=0,leaps=0,reps=0;
    const ksc={},tsc={},tempos=[];let rMin=127,rMax=0;
    for(const file of files){
      const doc=file.xmlDoc;const measures=doc.querySelectorAll('part:first-of-type > measure');tm+=measures.length;
      const ks=doc.querySelector('key fifths');if(ks){const k=ks.textContent;ksc[k]=(ksc[k]||0)+1}
      const ts=doc.querySelector('time');if(ts){const sig=(ts.querySelector('beats')?.textContent||'?')+'/'+(ts.querySelector('beat-type')?.textContent||'?');tsc[sig]=(tsc[sig]||0)+1}
      const snd=doc.querySelector('sound[tempo]');if(snd)tempos.push(parseFloat(snd.getAttribute('tempo')));
      let prevChord=null,pLen=0;
      measures.forEach(measure=>{const ns=[];
        measure.querySelectorAll('note').forEach(note=>{if(note.querySelector('rest')){if(pLen>0){phrases.push(pLen);pLen=0}return}
          tn++;pLen++;const p=getNotePitch(note);if(!p)return;
          const midi=noteToMidi(p.step,p.alter,p.octave);if(midi<rMin)rMin=midi;if(midi>rMax)rMax=midi;
          ns.push(midi%12)});
        const chord=detectChord(ns);if(chord&&prevChord){const pr=prevChord+' → '+chord;allProg[pr]=(allProg[pr]||0)+1}if(chord)prevChord=chord;
      });if(pLen>0)phrases.push(pLen);
      let pm=null;doc.querySelectorAll('part:first-of-type note').forEach(note=>{
        if(note.querySelector('rest')||note.querySelector('chord'))return;
        const p=getNotePitch(note);if(!p)return;const midi=noteToMidi(p.step,p.alter,p.octave);
        if(pm!==null){const iv=Math.abs(midi-pm);allIv[getIntervalName(Math.min(iv,12))]=(allIv[getIntervalName(Math.min(iv,12))]||0)+1;
          if(iv===0)reps++;else if(iv<=2)steps++;else leaps++}pm=midi});
    }
    const move=steps+leaps+reps||1;
    const avgPh=phrases.length?(phrases.reduce((a,b)=>a+b,0)/phrases.length).toFixed(1):'-';
    const avgTm=tempos.length?(tempos.reduce((a,b)=>a+b,0)/tempos.length).toFixed(0):'-';
    const topProg={};Object.entries(allProg).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([k,v])=>topProg[k]=v);
    const pBk={};phrases.forEach(l=>{const b=l<=4?'1-4':l<=8?'5-8':l<=12?'9-12':l<=16?'13-16':'17+';pBk[b]=(pBk[b]||0)+1});
    const topKeys=Object.entries(ksc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>{const idx=KEY_FIFTHS.indexOf(parseInt(k));return{name:idx>=0?KEY_NAMES[idx]:k,count:v}});
    const topTime=Object.entries(tsc).sort((a,b)=>b[1]-a[1]).slice(0,5);
    setComposerData({fileCount:files.length,totalNotes:tn,totalMeasures:tm,avgTempo:avgTm,
      lowest:fmtNote(rMin<127?midiToNote(rMin):null),highest:fmtNote(rMax>0?midiToNote(rMax):null),
      avgPhrase:avgPh,stepPct:(steps/move*100).toFixed(1),leapPct:(leaps/move*100).toFixed(1),repPct:(reps/move*100).toFixed(1),
      topKeys,topTime,intervals:allIv,progressions:topProg,phraseBuckets:pBk});
    hideProgress();
  },[files,showProgress,hideProgress]);

  const runDifficulty=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    showProgress('난이도/연주성 분석 중...');await new Promise(r=>setTimeout(r,50));
    const results=[];const aggregate={notes:0,rests:0,measures:0,range:0,leapPct:0,fastPct:0,restPct:0,score:0};
    for(const file of files){
      const doc=file.xmlDoc;
      let notes=0,rests=0,lowest=127,highest=0,leaps=0,bigLeaps=0,repeats=0,steps=0,fastNotes=0,dotted=0;
      const rhythmCounts={};const intervalCounts={};const warnings=[];
      const measures=[...doc.querySelectorAll('part:first-of-type > measure')];
      measures.forEach(measure=>{
        let prevMidi=null;
        measure.querySelectorAll('note').forEach(note=>{
          if(note.querySelector('chord'))return;
          const type=note.querySelector('type')?.textContent||'unknown';
          if(note.querySelector('dot'))dotted++;
          rhythmCounts[type]=(rhythmCounts[type]||0)+1;
          if(note.querySelector('rest')){rests++;return}
          const p=getNotePitch(note);if(!p)return;
          const midi=noteToMidi(p.step,p.alter,p.octave);
          notes++;if(midi<lowest)lowest=midi;if(midi>highest)highest=midi;
          if(['16th','32nd','64th'].includes(type))fastNotes++;
          if(prevMidi!==null){
            const iv=Math.abs(midi-prevMidi);
            const ivName=getIntervalName(Math.min(iv,12));
            intervalCounts[ivName]=(intervalCounts[ivName]||0)+1;
            if(iv===0)repeats++;else if(iv<=2)steps++;else leaps++;
            if(iv>=7)bigLeaps++;
          }
          prevMidi=midi;
        });
      });
      const totalEvents=notes+rests||1;
      const rangeSemis=highest>0&&lowest<127?highest-lowest:0;
      const moveTotal=steps+leaps+repeats||1;
      const restPct=rests/totalEvents*100;
      const leapPct=leaps/moveTotal*100;
      const bigLeapPct=bigLeaps/moveTotal*100;
      const fastPct=fastNotes/Math.max(notes,1)*100;
      const density=notes/Math.max(measures.length,1);
      const rhythmVariety=Object.keys(rhythmCounts).filter(k=>k!=='unknown').length;
      let score=0;
      score+=Math.min(24,rangeSemis*0.75);
      score+=Math.min(22,leapPct*0.45+bigLeapPct*0.8);
      score+=Math.min(18,fastPct*0.75);
      score+=Math.min(14,Math.max(0,density-4)*2.2);
      score+=Math.min(10,rhythmVariety*1.7+dotted*0.08);
      score+=Math.min(8,Math.max(0,restPct-22)*0.25);
      score=Math.round(Math.max(0,Math.min(100,score)));
      const level=score>=68?'어려움':score>=38?'보통':'쉬움';
      if(rangeSemis>=24)warnings.push('두 옥타브 이상 음역');
      if(bigLeapPct>=18)warnings.push('큰 도약 많음');
      if(fastPct>=18)warnings.push('빠른 패시지 비율 높음');
      if(density>=8)warnings.push('마디당 음표 밀도 높음');
      if(restPct>=35)warnings.push('쉼표/호흡 지점 많음');
      results.push({
        name:file.name,score,level,notes,rests,measures:measures.length,
        lowest:fmtNote(lowest<127?midiToNote(lowest):null),highest:fmtNote(highest>0?midiToNote(highest):null),
        rangeSemis,leapPct:leapPct.toFixed(1),bigLeapPct:bigLeapPct.toFixed(1),
        fastPct:fastPct.toFixed(1),restPct:restPct.toFixed(1),density:density.toFixed(1),
        rhythmVariety,warnings:warnings.length?warnings:['특별한 위험 요소 적음'],
        intervalCounts,rhythmCounts
      });
      aggregate.notes+=notes;aggregate.rests+=rests;aggregate.measures+=measures.length;
      aggregate.range+=rangeSemis;aggregate.leapPct+=leapPct;aggregate.fastPct+=fastPct;aggregate.restPct+=restPct;aggregate.score+=score;
    }
    const count=results.length||1;
    const avgScore=Math.round(aggregate.score/count);
    const avgLevel=avgScore>=68?'어려움':avgScore>=38?'보통':'쉬움';
    setDifficultyData({
      summary:{
        fileCount:results.length,totalNotes:aggregate.notes,totalRests:aggregate.rests,totalMeasures:aggregate.measures,
        avgScore,avgLevel,avgRange:(aggregate.range/count).toFixed(1),
        avgLeapPct:(aggregate.leapPct/count).toFixed(1),avgFastPct:(aggregate.fastPct/count).toFixed(1),
        avgRestPct:(aggregate.restPct/count).toFixed(1)
      },
      results
    });
    hideProgress();
  },[files,showProgress,hideProgress]);

  const updateKeyEndpoint=useCallback(e=>{
    const next=e.target.value;
    setKeyEndpoint(next);
    try{localStorage.setItem('music21KeyEndpoint',next)}catch(err){}
  },[]);

  const runPreciseKey=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const endpoint=(keyEndpoint||DEFAULT_MUSIC21_KEY_ENDPOINT).trim();
    if(!endpoint){alert('music21 API 주소를 입력해주세요.');return}
    setKeyError('');
    showProgress('music21 조성 분석 중...');
    const payload={
      scores:files.map(file=>({
        name:file.name,
        xml:new XMLSerializer().serializeToString(file.xmlDoc)
      }))
    };
    try{
      const res=await fetch(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      if(!res.ok){
        const msg=await res.text();
        throw new Error(`${res.status} ${msg.slice(0,160)}`);
      }
      const data=await res.json();
      setKeyData(data);
    }catch(e){
      const fallbackResults=files.map(file=>{
        const written=getWrittenKeySummary(file.xmlDoc);
        return {name:file.name,status:'fallback',detected_key:null,written_key:written,alternates:[]};
      });
      setKeyData({results:fallbackResults,summary:null});
      setKeyError(`music21 API 연결 실패: ${e.message}`);
    }finally{
      hideProgress();
    }
  },[files,keyEndpoint,showProgress,hideProgress]);

  return <div>
    <h2 className="panel__heading">통계 분석</h2>
    <p className="panel__description">음표 빈도, 리듬 패턴, 음정 도약, 코드 진행, music21 기반 조성 추정을 분석합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runBasic}>▶ 기본 분석</button>
      <button className="btn btn--secondary" onClick={runComposer}>📋 작곡 스타일 분석</button>
      <button className="btn btn--secondary" onClick={runDifficulty}>난이도/연주성 분석</button>
    </div>

    <div className="card key-analysis-card">
      <div className="card__title">music21 정밀 조성 분석</div>
      <div className="card__text">MusicXML 조표가 아니라 실제 음 분포를 기반으로 조성을 추정하고 확신도와 대체 조성을 확인합니다.</div>
      <label className="form-label">music21 API 주소</label>
      <input className="form-input form-input--mono" value={keyEndpoint} onChange={updateKeyEndpoint}/>
      <div className="btn-row">
        <button className="btn btn--secondary" onClick={runPreciseKey}>정밀 조성 분석</button>
      </div>
      {keyError && <div className="key-analysis-warning">{keyError}<br/>서버가 없으면 아래에는 MusicXML 조표 기준 결과만 표시됩니다.</div>}
    </div>

    {keyData && <div className="key-analysis-results">
      {keyData.summary && <div className="stats-row">
        <div className="stat-tile"><div className="stat-tile__value">{keyData.summary.successful}</div><div className="stat-tile__label">분석 성공</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{keyData.summary.failed}</div><div className="stat-tile__label">분석 실패</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{keyData.summary.top_key||'-'}</div><div className="stat-tile__label">대표 조성</div></div>
      </div>}
      {keyData.results?.map((r,i)=>{
        const dk=r.detected_key;
        const written=r.written_key;
        return <div className="key-result" key={i}>
          <div className="key-result__header">
            <span className="key-result__name">{r.name}</span>
            <span className={`key-result__badge key-result__badge--${r.status||'ok'}`}>{r.status==='ok'?'music21':r.status==='fallback'?'조표 기준':'오류'}</span>
          </div>
          {dk
            ? <div className="key-result__main">
                <div><span className="key-result__label">추정 조성</span><strong>{dk.label_ko||dk.label}</strong></div>
                <div><span className="key-result__label">확신도</span>{dk.correlation!==null&&dk.correlation!==undefined?Number(dk.correlation).toFixed(3):'-'}</div>
                <div><span className="key-result__label">tonal certainty</span>{dk.tonal_certainty!==null&&dk.tonal_certainty!==undefined?Number(dk.tonal_certainty).toFixed(3):'-'}</div>
              </div>
            : <div className="key-result__main">
                <div><span className="key-result__label">조표 기준</span><strong>{written?.label||'-'}</strong></div>
              </div>}
          {written && <div className="key-result__sub">MusicXML 조표: {written.label} ({written.fifths} fifths)</div>}
          {r.alternates?.length>0 && <div className="key-result__alts">
            대체 조성: {r.alternates.map(a=><span key={a.label} className="composer-tag">{a.label_ko||a.label}</span>)}
          </div>}
          {r.error && <div className="key-analysis-warning">{r.error}</div>}
        </div>;
      })}
    </div>}

    {difficultyData && <div className="difficulty-analysis-results">
      <div className="stats-row">
        <div className="stat-tile"><div className={`stat-tile__value difficulty-level difficulty-level--${difficultyData.summary.avgLevel}`}>{difficultyData.summary.avgLevel}</div><div className="stat-tile__label">종합 등급</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{difficultyData.summary.avgScore}</div><div className="stat-tile__label">난이도 점수</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{difficultyData.summary.avgRange}</div><div className="stat-tile__label">평균 음역(반음)</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{difficultyData.summary.avgLeapPct}%</div><div className="stat-tile__label">도약 비율</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{difficultyData.summary.avgFastPct}%</div><div className="stat-tile__label">빠른 음표</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{difficultyData.summary.avgRestPct}%</div><div className="stat-tile__label">쉼표 비율</div></div>
      </div>
      {difficultyData.results.map((r,i)=><div className="difficulty-result" key={i}>
        <div className="key-result__header">
          <span className="key-result__name">{r.name}</span>
          <span className={`difficulty-badge difficulty-badge--${r.level}`}>{r.level} · {r.score}</span>
        </div>
        <div className="difficulty-meter"><div className={`difficulty-meter__bar difficulty-meter__bar--${r.level}`} style={{'--difficulty-score':`${r.score}%`}}/></div>
        <div className="difficulty-grid">
          <div><span className="key-result__label">음역</span><strong>{r.lowest}–{r.highest}</strong><small>{r.rangeSemis}반음</small></div>
          <div><span className="key-result__label">도약</span><strong>{r.leapPct}%</strong><small>큰 도약 {r.bigLeapPct}%</small></div>
          <div><span className="key-result__label">빠른 패시지</span><strong>{r.fastPct}%</strong><small>16분 이하</small></div>
          <div><span className="key-result__label">쉼표</span><strong>{r.restPct}%</strong><small>호흡/휴지</small></div>
          <div><span className="key-result__label">밀도</span><strong>{r.density}</strong><small>음표/마디</small></div>
          <div><span className="key-result__label">리듬</span><strong>{r.rhythmVariety}</strong><small>유형</small></div>
        </div>
        <div className="key-result__alts">
          포인트: {r.warnings.map(w=><span key={w} className="composer-tag">{w}</span>)}
        </div>
      </div>)}
    </div>}

    {basicData && <div>
      <div className="stats-row">
        <div className="stat-tile"><div className="stat-tile__value">{basicData.fileCount}</div><div className="stat-tile__label">파일 수</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalNotes}</div><div className="stat-tile__label">총 음표</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalRests}</div><div className="stat-tile__label">총 쉼표</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalMeasures}</div><div className="stat-tile__label">총 마디</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.lowest}</div><div className="stat-tile__label">최저음</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.highest}</div><div className="stat-tile__label">최고음</div></div>
      </div>
      <div className="card"><div className="card__title">📊 음표 분포</div>
        <BarChart data={basicData.noteCounts} labelWidth={48}/></div>
      <div className="card"><div className="card__title">🎵 리듬 유형</div>
