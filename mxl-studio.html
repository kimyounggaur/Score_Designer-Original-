   PANEL: CLEF
   ============================================================== */
const CLEF_SYMBOLS={treble:'𝄞',bass:'𝄢',alto:'𝄡',tenor:'𝄡',neutral:'𝄥'};

function ClefPanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [targetClef,setTargetClef]=useState('treble');
  const [autoTranspose,setAutoTranspose]=useState(true);
  const [log,setLog]=useState([]);

  const currentClef=useMemo(()=>{
    if(!files.length)return null;
    return getCurrentClef(files[0].xmlDoc);
  },[files]);

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('음자리표 변환 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];
      const cfg=CLEF_CONFIGS.find(c=>c.id===targetClef);
      const updatedFiles=files.map(file=>{
        const doc=cloneDoc(file.xmlDoc);

        // Compute octave shift to bring notes into the new clef's range
        let semiShift=0;
        if(autoTranspose&&cfg.center!==null){
          const pitchedNotes=[...doc.querySelectorAll('note')].filter(n=>!n.querySelector('rest')&&getNotePitch(n));
          if(pitchedNotes.length>0){
            const avgMidi=pitchedNotes.reduce((s,n)=>{
              const p=getNotePitch(n);return s+noteToMidi(p.step,p.alter,p.octave);
            },0)/pitchedNotes.length;
            semiShift=Math.round((cfg.center-avgMidi)/12)*12;
          }
        }

        // Apply octave transposition to all pitched notes
        if(semiShift!==0){
          doc.querySelectorAll('note').forEach(note=>{
            const p=getNotePitch(note);if(!p)return;
            const np=transposeNote(p.step,p.alter,p.octave,semiShift);
            setNotePitch(note,np.step,np.alter,np.octave);
            let acc=note.querySelector('accidental');
            if(acc){if(np.alter===1)acc.textContent='sharp';else if(np.alter===-1)acc.textContent='flat';else acc.remove();}
          });
        }

        // Update clef element in every attributes block
        doc.querySelectorAll('attributes').forEach(attr=>{
          let clefEl=attr.querySelector('clef');
          if(!clefEl){clefEl=doc.createElement('clef');attr.appendChild(clefEl);}
          let signEl=clefEl.querySelector('sign');
          if(!signEl){signEl=doc.createElement('sign');clefEl.insertBefore(signEl,clefEl.firstChild);}
          signEl.textContent=cfg.sign;
          let lineEl=clefEl.querySelector('line');
          if(cfg.sign==='percussion'){if(lineEl)lineEl.remove();}
          else{
            if(!lineEl){lineEl=doc.createElement('line');clefEl.appendChild(lineEl);}
            lineEl.textContent=cfg.line;
          }
        });

        const shiftStr=semiShift!==0?` (${semiShift>0?'+':''}${semiShift}반음 이동)`:'';
        lines.push({m:`✓ ${file.name} → ${cfg.label}${shiftStr}`,t:'ok'});
        return{...file,xmlDoc:doc};
      });
      onFilesUpdate(updatedFiles,'음자리표 변환');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,targetClef,autoTranspose,showProgress,hideProgress,onFilesUpdate]);

  const currentCfg=CLEF_CONFIGS.find(c=>c.id===currentClef);

  return <div>
    <h2 className="panel__heading">음자리표 변환</h2>
    <p className="panel__description">음자리표를 변환합니다. 자동 조옮김 옵션을 켜면 새 음자리표의 음역대에 맞게 옥타브 단위로 자동 이동합니다.</p>

    {currentClef&&<div className="card">
      <div className="card__title">현재 음자리표</div>
      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'6px 0'}}>
        <span style={{fontSize:'32px',fontFamily:"'Bravura','FreeSerif','Times New Roman',serif",lineHeight:1}}>{CLEF_SYMBOLS[currentClef]}</span>
        <div>
          <div style={{fontWeight:600,fontSize:'13px'}}>{currentCfg?.label}</div>
          <div style={{fontSize:'11px',color:'var(--text-muted)'}}>{currentCfg?.sub}</div>
        </div>
      </div>
    </div>}

    <div className="card">
      <div className="card__title">🎼 목표 음자리표</div>
      <div className="clef-grid">
        {CLEF_CONFIGS.map(cfg=>(
          <div key={cfg.id}
            className={`clef-btn${targetClef===cfg.id?' clef-btn--selected':''}`}
            onClick={()=>setTargetClef(cfg.id)}>
            <div className="clef-btn__symbol">{CLEF_SYMBOLS[cfg.id]}</div>
            <div className="clef-btn__label">{cfg.label}</div>
            <div className="clef-btn__sub">{cfg.sub}</div>
          </div>
        ))}
      </div>
    </div>

    <div className="card">
      <div className="toggle-row">
        <div className="card__title">🔀 음역대 자동 조옮김</div>
        <Toggle on={autoTranspose} onClick={()=>setAutoTranspose(v=>!v)}/>
      </div>
      {autoTranspose&&targetClef!=='neutral'&&(
        <div className="card__text">모든 음표를 새 음자리표 중심 음역대로 옥타브 단위 자동 이동합니다.</div>
      )}
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={run}>▶ 변환 실행</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

   PANEL: LAYOUT
   ============================================================== */
function LayoutPanel({files,activeFile=0,showProgress,hideProgress,onFilesUpdate}){
  const defaultForm=useMemo(()=>({
    pageSize:'A4',
    margins:{left:10,right:10,top:12,bottom:12},
    staffDistance:80,
    systemDistance:100,
    scalePercent:100,
    measureNumbering:'system',
    startMeasure:1,
    systemBreakMeasure:'',
    pageBreakMeasure:'',
    removeAllBreaks:false,
    applyScope:'current',
    meta:{title:'',workTitle:'',composer:'',lyricist:'',rights:''},
  }),[]);
  const [form,setForm]=useState(defaultForm);
  const [open,setOpen]=useState({page:true,margins:false,spacing:false,breaks:false,meta:false});
  const [log,setLog]=useState([]);
  const file=files[activeFile]||files[0];
  const pageSizes=window.LayoutCore?.PAGE_SIZES||{};

  useEffect(()=>{
    if(!file?.xmlDoc||!window.LayoutCore?.readMetadata)return;
    setForm(prev=>({...prev,meta:{...prev.meta,...window.LayoutCore.readMetadata(file.xmlDoc)}}));
  },[file]);

  const updateField=useCallback((key,value)=>setForm(prev=>({...prev,[key]:value})),[]);
  const updateMargin=useCallback((key,value)=>setForm(prev=>({...prev,margins:{...prev.margins,[key]:value}})),[]);
  const updateMeta=useCallback((key,value)=>setForm(prev=>({...prev,meta:{...prev.meta,[key]:value}})),[]);
  const toggleSection=useCallback(id=>setOpen(prev=>({...prev,[id]:!prev[id]})),[]);

  const resetDefaults=useCallback(()=>{
    setForm({...defaultForm,meta:window.LayoutCore?.readMetadata?.(file?.xmlDoc)||defaultForm.meta});
    setLog([{m:'레이아웃 입력값을 기본값으로 되돌렸습니다.',t:'info'}]);
  },[defaultForm,file]);

  const apply=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드하세요.');return}
    if(!window.LayoutCore){alert('레이아웃 편집 모듈을 불러오지 못했습니다.');return}
    setLog([]);
    showProgress('레이아웃 편집 적용 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const systemBreaks=form.systemBreakMeasure?String(form.systemBreakMeasure).split(',').map(v=>parseInt(v.trim(),10)).filter(Boolean):[];
      const pageBreaks=form.pageBreakMeasure?String(form.pageBreakMeasure).split(',').map(v=>parseInt(v.trim(),10)).filter(Boolean):[];
      const targetAll=form.applyScope==='all';
      const targetIndex=files[activeFile]?activeFile:0;
      const updated=files.map((f,i)=>{
        if(!targetAll&&i!==targetIndex)return f;
        const doc=cloneDoc(f.xmlDoc);
        window.LayoutCore.applyLayout(doc,{
          pageSize:form.pageSize,
          margins:form.margins,
          staffDistance:form.staffDistance,
          systemDistance:form.systemDistance,
          scalePercent:form.scalePercent,
          measureNumbering:form.measureNumbering,
          startMeasure:form.startMeasure,
          breaks:{system:systemBreaks,page:pageBreaks,removeAll:form.removeAllBreaks},
          meta:form.meta,
        });
        return {...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)};
      });
      onFilesUpdate(updated,'레이아웃 편집');
      setLog([{m:`${targetAll?'모든 파일':'현재 파일'}에 레이아웃 설정을 적용했습니다.`,t:'ok'}]);
    }catch(e){
      setLog([{m:e.message,t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files,activeFile,form,onFilesUpdate,showProgress,hideProgress]);

  const Section=({id,title,children})=><div className="layout-section">
    <button type="button" className="layout-section__head" onClick={()=>toggleSection(id)}>
      <span>{title}</span><span>{open[id]?'−':'+'}</span>
    </button>
    {open[id]&&<div className="layout-section__body">{children}</div>}
  </div>;

  return <div>
    <h2 className="panel__heading">레이아웃 편집</h2>
    <p className="panel__description">페이지 크기, 여백, 보표 간격, 브레이크, 마디 번호와 메타데이터를 MusicXML 조판 정보로 편집합니다.</p>

    <Section id="page" title="페이지">
      <label className="form-label">페이지 크기</label>
      <select className="form-select" value={form.pageSize} onChange={e=>updateField('pageSize',e.target.value)}>
        {Object.entries(pageSizes).map(([id,size])=><option key={id} value={id}>{id} ({size.width}×{size.height} mm)</option>)}
      </select>
      <label className="form-label">음표 크기 {form.scalePercent}%</label>
      <input className="layout-slider" type="range" min="50" max="200" step="5" value={form.scalePercent} onChange={e=>updateField('scalePercent',parseInt(e.target.value,10))}/>
    </Section>

    <Section id="margins" title="여백">
      <div className="layout-grid">
        {['left','right','top','bottom'].map(key=><label className="form-label" key={key}>{key}
          <input className="form-input" type="number" min="0" step="0.5" value={form.margins[key]} onChange={e=>updateMargin(key,e.target.value)}/>
        </label>)}
      </div>
    </Section>

    <Section id="spacing" title="간격">
      <label className="form-label">보표 간격 (tenths)</label>
      <input className="form-input" type="number" min="20" value={form.staffDistance} onChange={e=>updateField('staffDistance',e.target.value)}/>
      <label className="form-label">시스템 간격 (tenths)</label>
      <input className="form-input" type="number" min="20" value={form.systemDistance} onChange={e=>updateField('systemDistance',e.target.value)}/>
    </Section>

    <Section id="breaks" title="브레이크와 마디 번호">
      <label className="form-label">시스템 브레이크 추가 마디</label>
      <input className="form-input" value={form.systemBreakMeasure} onChange={e=>updateField('systemBreakMeasure',e.target.value)} placeholder="예: 4 또는 4,8"/>
      <label className="form-label">페이지 브레이크 추가 마디</label>
      <input className="form-input" value={form.pageBreakMeasure} onChange={e=>updateField('pageBreakMeasure',e.target.value)} placeholder="예: 9"/>
      <label className="layout-check"><input type="checkbox" checked={form.removeAllBreaks} onChange={e=>updateField('removeAllBreaks',e.target.checked)}/> 모든 브레이크 제거 후 적용</label>
      <label className="form-label">마디 번호 스타일</label>
      <select className="form-select" value={form.measureNumbering} onChange={e=>updateField('measureNumbering',e.target.value)}>
        <option value="none">숨김</option><option value="measure">매 마디</option><option value="system">시스템 첫 마디</option>
      </select>
      <label className="form-label">시작 번호</label>
      <input className="form-input" type="number" min="1" value={form.startMeasure} onChange={e=>updateField('startMeasure',e.target.value)}/>
    </Section>

    <Section id="meta" title="제목·작곡가 메타데이터">
      {[
        ['title','movement-title'],['workTitle','work-title'],['composer','composer'],['lyricist','lyricist'],['rights','rights'],
      ].map(([key,label])=><label className="form-label" key={key}>{label}
        <input className="form-input" value={form.meta[key]} onChange={e=>updateMeta(key,e.target.value)}/>
      </label>)}
    </Section>

    <div className="card">
      <div className="card__title">적용 범위</div>
      <select className="form-select" value={form.applyScope} onChange={e=>updateField('applyScope',e.target.value)}>
        <option value="current">현재 파일에만 적용</option>
        <option value="all">모든 파일에 일괄 적용</option>
      </select>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={apply} disabled={!files.length}>적용</button>
      <button className="btn btn--secondary" onClick={resetDefaults}>기본값 초기화</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

function ShareModal({open,onClose,files,activeFile,onNotice}){
  const [shareUrl,setShareUrl]=useState('');
  const [copyState,setCopyState]=useState('');
  const qrRef=useRef(null);
  const file=files[activeFile]||files[0];
  const xmlSize=useMemo(()=>{
    if(!file?.xmlDoc)return 0;
    return new XMLSerializer().serializeToString(file.xmlDoc).length;
  },[file]);

  useEffect(()=>{
    if(!open||!file?.xmlDoc||!window.ShareSessionCore){setShareUrl('');return}
    try{
      setShareUrl(window.ShareSessionCore.generateShareURL(files,files[activeFile]?activeFile:0));
      setCopyState('');
    }catch(e){
      setShareUrl('');
      setCopyState(e.message);
    }
  },[open,file,files,activeFile]);

  useEffect(()=>{
    if(!open||!shareUrl||!qrRef.current)return;
    qrRef.current.innerHTML='';
    if(window.QRCode){
      new QRCode(qrRef.current,{text:shareUrl,width:164,height:164,correctLevel:QRCode.CorrectLevel.M});
    }else{
      qrRef.current.textContent='QR 코드 라이브러리를 불러오지 못했습니다.';
    }
  },[open,shareUrl]);

  const copy=useCallback(async()=>{
    if(!shareUrl)return;
    try{
      await navigator.clipboard.writeText(shareUrl);
      setCopyState('복사되었습니다.');
      onNotice?.('공유 URL을 복사했습니다.');
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=shareUrl;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
      setCopyState('복사되었습니다.');
    }
  },[shareUrl,onNotice]);

  if(!open)return null;
  return <div className="modal-backdrop" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="share-modal">
      <div className="share-modal__header">
        <div>
          <div className="share-modal__title">악보 URL 공유</div>
          <div className="share-modal__subtitle">선택된 단일 파일을 URL 안에 저장합니다.</div>
        </div>
        <button className="share-modal__close" onClick={onClose}>×</button>
      </div>
      {!files.length?<div className="card__text">공유할 파일이 없습니다.</div>:<>
        <textarea className="share-modal__url" readOnly value={shareUrl} />
        {xmlSize>window.ShareSessionCore?.SHARE_SIZE_WARN&&<div className="share-modal__warning">파일이 커서 URL이 길어질 수 있습니다. 현재 {Math.round(xmlSize/1024)}KB</div>}
        <div className="btn-row">
          <button className="btn btn--primary" onClick={copy} disabled={!shareUrl}>복사</button>
          <button className="btn btn--secondary" onClick={onClose}>닫기</button>
        </div>
        {copyState&&<div className="share-modal__status">{copyState}</div>}
        <div className="share-modal__qr-wrap">
          <div className="share-modal__qr" ref={qrRef}/>
        </div>
      </>}
    </div>
  </div>;
}

      </div>

function AnnotationOverlay({annotations,onEdit,onCreate}) {
  const [positions,setPositions]=useState([]);
  const locate=useCallback(()=>{
    const score=document.querySelector('.main-score');
    const container=document.querySelector('.score-container');
    const svg=container?.querySelector('svg');
    if(!score||!container||!svg){setPositions([]);return}
    const scoreRect=score.getBoundingClientRect();
    const measures=Array.from((files=>files)(svg.querySelectorAll('[data-measure],[data-measure-number],g[id*="measure"],g[class*="measure"]')));
    const textNodes=Array.from(svg.querySelectorAll('text'));
    const next=(annotations||[]).map(ann=>{
      let target=measures.find(el=>{
        const v=el.getAttribute('data-measure')||el.getAttribute('data-measure-number')||el.id||'';
        return v===String(ann.measureNum)||v.includes(`-${ann.measureNum}`)||v.includes(`measure-${ann.measureNum}`);
      });
      if(!target){
        target=textNodes.find(t=>(t.textContent||'').trim()===String(ann.measureNum));
      }
      const rect=target?.getBoundingClientRect?.();
      if(rect)return {...ann,left:rect.left-scoreRect.left+4,top:rect.top-scoreRect.top+4};
      const idx=Math.max(0,ann.measureNum-1);
      return {...ann,left:28+(idx%4)*120,top:72+Math.floor(idx/4)*96};
    });
    setPositions(next);
  },[annotations]);
  useEffect(()=>{locate();const t=setTimeout(locate,600);window.addEventListener('resize',locate);return()=>{clearTimeout(t);window.removeEventListener('resize',locate)}},[locate]);
  return <div className="annotation-overlay">
    {positions.map(ann=><button key={ann.id} className={`annotation-pin annotation-pin--${ann.type}`} style={{left:ann.left,top:ann.top,background:ann.color}} onClick={()=>onEdit(ann)} title={`${ann.measureNum}마디: ${ann.text}`}>📝</button>)}
    {onCreate&&<button className="annotation-add-floating" onClick={onCreate} title="현재 마디에 주석 추가">+</button>}
  </div>;
}

function AnnotationsPanel({files,activeFile=0,annotations,setAnnotations,onFilesUpdate,showProgress,hideProgress}){
  const [editing,setEditing]=useState(null);
  const [log,setLog]=useState([]);
  const importRef=useRef(null);
  const file=files[activeFile]||files[0];
  const fileAnnotations=useMemo(()=>annotations.filter(a=>!a.fileName||a.fileName===file?.name),[annotations,file]);

  const create=useCallback(()=>{
    setEditing(window.AnnotationsCore.createAnnotation({measureNum:1,text:'',type:'note',color:'#FFD166',fileName:file?.name||''}));
  },[file]);
  const save=useCallback(ann=>{
    const next={...ann,fileName:file?.name||ann.fileName||''};
    setAnnotations(prev=>[next,...prev.filter(a=>a.id!==next.id)]);
    setEditing(null);
    setLog([{m:'주석을 저장했습니다.',t:'ok'}]);
  },[file,setAnnotations]);
  const del=useCallback(id=>{
    setAnnotations(prev=>prev.filter(a=>a.id!==id));
    setEditing(null);
    setLog([{m:'주석을 삭제했습니다.',t:'warn'}]);
  },[setAnnotations]);
  const persist=useCallback(()=>{
    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    showProgress('주석을 악보에 삽입 중...');
    try{
      const doc=cloneDoc(file.xmlDoc);
      const result=window.AnnotationsCore.insertAnnotations(doc,fileAnnotations);
      const updated=files.map((f,i)=>i===(files[activeFile]?activeFile:0)?{...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)}:f);
      onFilesUpdate(updated,'주석 삽입');
      setLog([{m:`주석 ${result.inserted}개를 악보에 삽입했습니다.`,t:'ok'},...(result.missing?[{m:`마디를 찾지 못한 주석 ${result.missing}개`,t:'warn'}]:[])]);
    }catch(e){setLog([{m:e.message,t:'err'}])}
    hideProgress();
  },[file,fileAnnotations,files,activeFile,onFilesUpdate,showProgress,hideProgress]);
  const exportJson=useCallback(()=>{
    downloadBlob(new Blob([JSON.stringify(fileAnnotations,null,2)],{type:'application/json'}),`${(file?.name||'annotations').replace(/\.[^.]+$/,'')}-annotations.json`);
  },[file,fileAnnotations]);
  const importJson=useCallback(async e=>{
    const json=e.target.files?.[0];e.target.value='';if(!json)return;
    try{
      const data=JSON.parse(await json.text());
      const incoming=(Array.isArray(data)?data:[]).map(a=>window.AnnotationsCore.createAnnotation({...a,fileName:a.fileName||file?.name||''}));
      setAnnotations(prev=>[...incoming,...prev.filter(p=>!incoming.some(i=>i.id===p.id))]);
      setLog([{m:`주석 ${incoming.length}개를 가져왔습니다.`,t:'ok'}]);
    }catch(err){setLog([{m:'주석 JSON 가져오기에 실패했습니다.',t:'err'}])}
  },[file,setAnnotations]);
  const printMode=useCallback(mode=>{
    const printable=window.AnnotationsCore.filterForPrint(fileAnnotations,mode);
    const win=window.open('','_blank');
    if(!win){alert('팝업이 차단되었습니다.');return}
    const svg=document.querySelector('.score-container svg')?.cloneNode(true);
    if(svg){
      const ns='http://www.w3.org/2000/svg';
      printable.forEach((a,i)=>{
        const g=document.createElementNS(ns,'g');
        const x=28+(Math.max(0,a.measureNum-1)%4)*150;
        const y=34+Math.floor(Math.max(0,a.measureNum-1)/4)*90+(i%3)*18;
        const text=document.createElementNS(ns,'text');
        text.setAttribute('x',x);text.setAttribute('y',y);
        text.setAttribute('font-size','12');text.setAttribute('font-family','Noto Sans KR, sans-serif');
        text.setAttribute('fill',a.color||'#FF6B6B');
        text.textContent=`📝 ${a.measureNum}: ${a.text}`;
        g.appendChild(text);svg.appendChild(g);
      });
    }
    const scoreSvg=svg?new XMLSerializer().serializeToString(svg):'';
    const items=printable.map(a=>`<li style="border-left:5px solid ${a.color};padding:8px;margin:8px 0"><b>${a.measureNum}마디</b> [${window.AnnotationsCore.TYPES[a.type]?.label||a.type}] ${a.text}</li>`).join('');
    win.document.write(`<!doctype html><html><head><title>annotations</title><style>body{font-family:sans-serif;padding:24px}svg{max-width:100%;height:auto}li{list-style:none}</style></head><body><h1>${mode==='student'?'학생용':'교사용'} 주석 인쇄</h1>${scoreSvg}<ul>${items}</ul></body></html>`);
    win.document.close();setTimeout(()=>win.print(),500);
  },[fileAnnotations]);

  return <div>
    <h2 className="panel__heading">주석 메모</h2>
    <p className="panel__description">마디별 교사 메모를 악보 위 오버레이로 배치하고, 필요하면 MusicXML에 영구 삽입합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={create}>주석 추가</button>
      <button className="btn btn--secondary" onClick={persist} disabled={!fileAnnotations.length}>악보에 영구 삽입</button>
    </div>
    <div className="btn-row">
      <button className="btn btn--secondary" onClick={()=>printMode('teacher')}>교사용 인쇄</button>
      <button className="btn btn--secondary" onClick={()=>printMode('student')}>학생용 인쇄</button>
    </div>
    <div className="btn-row">
      <button className="btn btn--secondary" onClick={exportJson} disabled={!fileAnnotations.length}>주석 내보내기</button>
      <button className="btn btn--secondary" onClick={()=>importRef.current?.click()}>주석 가져오기</button>
      <input ref={importRef} className="hidden-file-input" type="file" accept="application/json,.json" onChange={importJson}/>
    </div>
    <div className="annotation-list">
      {fileAnnotations.map(a=><button key={a.id} className="annotation-list__item" onClick={()=>setEditing(a)}>
        <span className="annotation-list__dot" style={{background:a.color}}/><b>{a.measureNum}마디</b><span>{window.AnnotationsCore.TYPES[a.type]?.label}</span><small>{a.text}</small>
      </button>)}
      {!fileAnnotations.length&&<div className="card__text">현재 파일에 연결된 주석이 없습니다.</div>}
    </div>
    <AnnotationEditModal annotation={editing} onSave={save} onDelete={del} onClose={()=>setEditing(null)}/>
    <LogPanel lines={log}/>
  </div>;
}

function LyricsPanel({files,activeFile=0,onFilesUpdate,showProgress,hideProgress,bpm=120}){
  const [sourceText,setSourceText]=useState('');
  const [translationText,setTranslationText]=useState('');
  const [mapping,setMapping]=useState([]);
  const [verse,setVerse]=useState('1');
  const [style1,setStyle1]=useState({fontSize:'11',color:'#111111',fontStyle:'normal'});
  const [style2,setStyle2]=useState({fontSize:'10',color:'#888888',fontStyle:'italic'});
  const [log,setLog]=useState([]);
  const importRef=useRef(null);
  const translationRef=useRef(null);
  const file=files[activeFile]||files[0];
  const extracted=useMemo(()=>file?.xmlDoc&&window.LyricsCore?window.LyricsCore.extractLyrics(file.xmlDoc):[],[file]);
  const grouped=useMemo(()=>window.LyricsCore?.groupLyricsByVerse(extracted)||{},[extracted]);

  useEffect(()=>{if(grouped['1']?.text&&!sourceText)setSourceText(grouped['1'].text)},[grouped,sourceText]);

  const splitSource=useCallback(()=>{
    const syllables=window.LyricsCore.splitSyllables(sourceText);
    setSourceText(syllables.join(' '));
    setLog([{m:`${syllables.length}개 음절로 분리했습니다.`,t:'info'}]);
  },[sourceText]);

  const assign=useCallback(()=>{
    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    const syllables=sourceText.trim().split(/\s+/).filter(Boolean);
    const next=window.LyricsCore.mapSyllablesToNotes(file.xmlDoc,syllables);
    setMapping(next);
    setLog([{m:`${next.length}개 음표에 음절을 배정했습니다.${syllables.length>next.length?' 남은 음절이 있습니다.':''}`,t:syllables.length>next.length?'warn':'ok'}]);
  },[file,sourceText]);

  const applyMain=useCallback(()=>{
    if(!file?.xmlDoc||!mapping.length)return;
    showProgress('가사 적용 중...');
    const doc=cloneDoc(file.xmlDoc);
    const fresh=window.LyricsCore.mapSyllablesToNotes(doc,mapping.map(m=>m.syllable));
    const result=window.LyricsCore.applyLyrics(doc,fresh,verse,{'font-size':style1.fontSize,color:style1.color,'font-style':style1.fontStyle});
    const idx=files[activeFile]?activeFile:0;
    onFilesUpdate(files.map((f,i)=>i===idx?{...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)}:f),'가사 편집');
    setLog([{m:`가사 ${result.applied}개를 적용했습니다.`,t:'ok'}]);
    hideProgress();
  },[file,mapping,verse,style1,files,activeFile,onFilesUpdate,showProgress,hideProgress]);

  const insertTranslation=useCallback(()=>{
    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    const syllables=window.LyricsCore.splitSyllables(translationText);
    const doc=cloneDoc(file.xmlDoc);
    const result=window.LyricsCore.addTranslationLyrics(doc,syllables,'2');
    window.LyricsCore.applyVerseStyle(doc,'2',{'font-size':style2.fontSize,color:style2.color,'font-style':style2.fontStyle});
    const idx=files[activeFile]?activeFile:0;
    onFilesUpdate(files.map((f,i)=>i===idx?{...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)}:f),'번역 가사 삽입');
    setLog([{m:`번역 가사 ${result.applied}개를 삽입했습니다.`,t:'ok'}]);
  },[file,translationText,style2,files,activeFile,onFilesUpdate]);

  const applyStyles=useCallback(()=>{
    if(!file?.xmlDoc)return;
    const doc=cloneDoc(file.xmlDoc);
    const c1=window.LyricsCore.applyVerseStyle(doc,'1',{'font-size':style1.fontSize,color:style1.color,'font-style':style1.fontStyle});
    const c2=window.LyricsCore.applyVerseStyle(doc,'2',{'font-size':style2.fontSize,color:style2.color,'font-style':style2.fontStyle});
    const idx=files[activeFile]?activeFile:0;
    onFilesUpdate(files.map((f,i)=>i===idx?{...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)}:f),'가사 스타일 편집');
    setLog([{m:`verse 1 ${c1}개, verse 2 ${c2}개 스타일을 적용했습니다.`,t:'ok'}]);
  },[file,style1,style2,files,activeFile,onFilesUpdate]);

  const importText=useCallback(async(e,setter)=>{const txt=e.target.files?.[0];e.target.value='';if(txt)setter(await txt.text())},[]);
  const exportTxt=useCallback(()=>{if(file?.xmlDoc)downloadBlob(new Blob([window.LyricsCore.exportLyricsText(file.xmlDoc)],{type:'text/plain;charset=utf-8'}),`${(file.name||'lyrics').replace(/\.[^.]+$/,'')}-lyrics.txt`)},[file]);
  const exportSrt=useCallback(()=>{if(file?.xmlDoc)downloadBlob(new Blob([window.LyricsCore.exportLyricsSrt(file.xmlDoc,bpm)],{type:'text/plain;charset=utf-8'}),`${(file.name||'lyrics').replace(/\.[^.]+$/,'')}.srt`)},[file,bpm]);

  return <div>
    <h2 className="panel__heading">가사 편집</h2>

    <div className="card"><div className="card__title">기존 가사</div><div className="lyrics-verse-list">
      {Object.values(grouped).map(g=><div className="lyrics-verse" key={g.verse}><b>Verse {g.verse}</b><span>{g.text||'-'}</span></div>)}

    </div></div>

      <textarea className="annotation-textarea lyrics-textarea" value={sourceText} onChange={e=>setSourceText(e.target.value)} placeholder="가사를 입력하거나 txt 파일을 가져오세요."/>
      <input ref={importRef} className="hidden-file-input" type="file" accept=".txt,text/plain" onChange={e=>importText(e,setSourceText)}/>
      <div className="btn-row"><button className="btn btn--secondary" onClick={()=>importRef.current?.click()}>TXT 가져오기</button><button className="btn btn--secondary" onClick={splitSource}>한국어 음절 분리</button><button className="btn btn--secondary" onClick={assign}>음절 배정</button><button className="btn btn--primary" onClick={applyMain} disabled={!mapping.length}>적용</button></div>
      <label className="form-label">적용할 verse</label><select className="form-select" value={verse} onChange={e=>setVerse(e.target.value)}><option value="1">Verse 1</option><option value="2">Verse 2</option></select>
    </div>
    <div className="lyrics-map-table"><table className="roman-table"><thead><tr><th>마디</th><th>노트</th><th>음절</th></tr></thead><tbody>
      {mapping.slice(0,80).map((m,i)=><tr key={i}><td>{m.measureNum}</td><td>{m.noteIdx+1}</td><td>{m.syllable}</td></tr>)}
      {!mapping.length&&<tr><td colSpan="3">음절 배정 미리보기가 없습니다.</td></tr>}
    </tbody></table></div>
    <div className="card"><div className="card__title">번역 레이어 (Verse 2)</div>
      <textarea className="annotation-textarea lyrics-textarea" value={translationText} onChange={e=>setTranslationText(e.target.value)} placeholder="번역 가사를 입력하세요."/>
      <input ref={translationRef} className="hidden-file-input" type="file" accept=".txt,text/plain" onChange={e=>importText(e,setTranslationText)}/>
      <div className="btn-row"><button className="btn btn--secondary" onClick={()=>translationRef.current?.click()}>번역 TXT 가져오기</button><button className="btn btn--primary" onClick={insertTranslation} disabled={!translationText.trim()}>번역 삽입</button></div>
    </div>
    <div className="card"><div className="card__title">가사 스타일</div><div className="lyrics-style-grid">
      <label className="form-label">Verse 1 크기<input className="form-input" value={style1.fontSize} onChange={e=>setStyle1({...style1,fontSize:e.target.value})}/></label>
      <label className="form-label">Verse 1 색상<input className="form-input" type="color" value={style1.color} onChange={e=>setStyle1({...style1,color:e.target.value})}/></label>
      <label className="form-label">Verse 2 크기<input className="form-input" value={style2.fontSize} onChange={e=>setStyle2({...style2,fontSize:e.target.value})}/></label>
      <label className="form-label">Verse 2 색상<input className="form-input" type="color" value={style2.color} onChange={e=>setStyle2({...style2,color:e.target.value})}/></label>

    <div className="btn-row"><button className="btn btn--secondary" onClick={exportTxt} disabled={!extracted.length}>TXT 내보내기</button><button className="btn btn--secondary" onClick={exportSrt} disabled={!extracted.length}>SRT 내보내기</button></div>
    <LogPanel lines={log}/>
  </div>;
}

function DifficultyRadar({result}){
  if(!result)return null;
  const items=[
    ['음역',result.breakdown.rangeScore],['도약',result.breakdown.leapScore],['리듬',result.breakdown.rhythmScore],
    ['조성',result.breakdown.keyScore],['화성',result.breakdown.harmonyScore],['빠르기',result.breakdown.tempoScore],['다성부',result.breakdown.polyScore],
  ];
  const cx=120,cy=120,r=78;
  const point=(i,value=100)=>{
    const a=-Math.PI/2+i*(Math.PI*2/items.length);
    const rr=r*(value/100);
    return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr];
  };
  const outer=items.map((_,i)=>point(i,100).join(',')).join(' ');
  const filled=items.map((it,i)=>point(i,it[1]).join(',')).join(' ');
  return <svg className="difficulty-radar" viewBox="0 0 240 240">
    <polygon points={outer} fill="none" stroke="var(--border-default)" strokeWidth="1.5"/>
    {[0.25,0.5,0.75].map(s=><polygon key={s} points={items.map((_,i)=>point(i,100*s).join(',')).join(' ')} fill="none" stroke="var(--border-subtle)" strokeWidth="1"/>)}
    {items.map((_,i)=>{const [x,y]=point(i,100);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--border-subtle)"/>})}
    <polygon points={filled} fill={result.color} fillOpacity="0.32" stroke={result.color} strokeWidth="2"/>
    {items.map((it,i)=>{const [x,y]=point(i,115);return <text key={it[0]} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="currentColor">{it[0]} {it[1]}</text>})}
  </svg>;
}

function DifficultyPanel({files,activeFile=0}){

    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    const next=window.DifficultyCore.scoreDifficulty(file.xmlDoc);
    setResult(next);
    setCompare(window.DifficultyCore.compareFiles(files));
  },[file,files]);

  useEffect(()=>{if(file?.xmlDoc&&window.DifficultyCore)run()},[file]);

  const sorted=useMemo(()=>{
    const rows=[...compare];
    rows.sort((a,b)=>sortDir==='asc'?a.total-b.total:b.total-a.total);
    return rows;
  },[compare,sortDir]);

  const bars=result?[['음역 폭',result.breakdown.rangeScore,result.details.rangeLabel],['도약 빈도',result.breakdown.leapScore,`전체 음의 ${result.details.leapPct}%가 도약`],['리듬 복잡도',result.breakdown.rhythmScore,`${result.details.uniqueRatios}종 리듬${result.details.hasTriplets?' + 셋잇단음표':''}`],['조성 난이도',result.breakdown.keyScore,`# / ♭ ${result.details.fifths}개`],['화성 복잡도',result.breakdown.harmonyScore,`${result.details.chordKinds}종 코드`],['빠르기',result.breakdown.tempoScore,`${Math.round(result.details.bpm)} BPM`],['다성부',result.breakdown.polyScore,`${result.details.partCount}파트`]]:[];

  return <div>
    <h2 className="panel__heading">난이도 평가</h2>
    <p className="panel__description">음역, 도약, 리듬, 조성, 화성, 빠르기, 다성부를 종합해 학습자 레벨을 진단합니다.</p>

      <DifficultyRadar result={result}/>
    </div>}
    {result&&<div className="card"><div className="card__title">추천 대상</div><div className="card__text">{window.DifficultyCore.recommendation(result)}</div></div>}
    {result&&<div className="difficulty-bars">
      {bars.map(([name,score,detail])=><div className="difficulty-bar-row" key={name}>
        <div className="difficulty-bar-row__label"><b>{name}</b><span>{score}점 · {detail}</span></div>
        <div className="difficulty-bar-track"><div style={{width:`${score}%`,background:result.color}}/></div>
      </div>)}
    </div>}
    <div className="card">

function FormAnalysisPanel({files,activeFile=0,onFilesUpdate,showProgress,hideProgress}){
  const [analysis,setAnalysis]=useState(null);
  const [phraseLength,setPhraseLength]=useState('');
  const [log,setLog]=useState([]);
  const file=files[activeFile]||files[0];

  const run=useCallback(async()=>{
    if(!file?.xmlDoc){alert('먼저 파일을 업로드하세요.');return}
    if(!window.FormAnalysisCore){alert('형식 분석 모듈을 불러오지 못했습니다.');return}
    showProgress('형식 분석 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const result=window.FormAnalysisCore.analyzeForm(file.xmlDoc,{phraseLength:phraseLength||undefined});
      setAnalysis(result);
      setLog([{m:`${result.phrases.length}개 구절을 감지했습니다.`,t:'ok'}]);
    }catch(e){setLog([{m:e.message,t:'err'}])}
    hideProgress();
  },[file,phraseLength,showProgress,hideProgress]);

  const insertLabels=useCallback(()=>{
    if(!analysis||!file?.xmlDoc)return;
    const doc=cloneDoc(file.xmlDoc);
    const result=window.FormAnalysisCore.insertFormLabels(doc,analysis.phrases);
    const idx=files[activeFile]?activeFile:0;
    const updated=files.map((f,i)=>i===idx?{...f,xmlDoc:doc,xmlString:new XMLSerializer().serializeToString(doc)}:f);
    onFilesUpdate(updated,'형식 라벨 삽입');
    setLog([{m:`형식 라벨 ${result.inserted}개를 삽입했습니다.`,t:'ok'}]);
  },[analysis,file,files,activeFile,onFilesUpdate]);

  const scrollTo=useCallback(measure=>{
    window.dispatchEvent(new CustomEvent('mxl-scroll-measure',{detail:{measure}}));
  },[]);

  const totalMeasures=analysis?.phrases?.length?analysis.phrases[analysis.phrases.length-1].endMeasure:1;

  return <div>
    <h2 className="panel__heading">형식 분석</h2>
    <p className="panel__description">종지, 쉼표, 음고/리듬 유사도를 바탕으로 구절을 나누고 A/B/A' 형식 라벨을 추정합니다.</p>
    <div className="card">
      <div className="card__title">분석 옵션</div>
      <label className="form-label">고정 구절 길이 (선택)</label>
      <input className="form-input" type="number" min="1" placeholder="비우면 자동 감지" value={phraseLength} onChange={e=>setPhraseLength(e.target.value)}/>
    </div>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={run} disabled={!files.length}>형식 분석 시작</button>
      <button className="btn btn--secondary" onClick={insertLabels} disabled={!analysis?.phrases?.length}>악보에 삽입</button>
    </div>

    {analysis&&<div className="card form-summary-card">
      <div className="card__title">{analysis.summary.formName}</div>
      <div className="card__text">총 {analysis.summary.phraseCount}개 구절, 평균 {analysis.summary.averageLength}마디</div>
      <div className="card__text">주요 조성: {analysis.summary.keyPath}</div>
    </div>}

    {analysis&&<div className="form-timeline">
      {analysis.phrases.map(p=>{
        const width=Math.max(12,(p.length/totalMeasures)*100);
        return <button key={`${p.label}-${p.startMeasure}`} className="form-block" style={{width:`${width}%`,background:p.color}} onClick={()=>scrollTo(p.startMeasure)} title={`${p.startMeasure}-${p.endMeasure}마디`}>
          <b>{p.label}</b><span>{p.startMeasure}-{p.endMeasure}</span>

    {analysis&&<div className="form-table-wrap">
      <table className="roman-table">
        <thead><tr><th>구절명</th><th>마디 범위</th><th>길이</th><th>유사 구절</th><th>특징</th></tr></thead>

          {analysis.phrases.map(p=><tr key={`${p.index}-${p.label}`} onClick={()=>scrollTo(p.startMeasure)}>
            <td><b style={{color:p.color}}>{p.label}</b></td>

    </div>}
    <LogPanel lines={log}/>
  </div>;
}

   SCORE VIEW — center panel always-visible score renderer
   ============================================================== */
function applyLyricStylesToSvg(container,xmlDoc){
  const svg=container.querySelector('svg');if(!svg)return;
  const specs=[];
  xmlDoc.querySelectorAll('lyric text').forEach(t=>{
    const fs=t.getAttribute('font-size'),fw=t.getAttribute('font-weight'),
      fst=t.getAttribute('font-style'),ff=t.getAttribute('font-family'),col=t.getAttribute('color');
    if(!fs&&!fw&&!fst&&!ff&&!col)return;
    specs.push({text:(t.textContent||'').trim(),fs,fw,fst,ff,col});
  });
  if(!specs.length)return;
  const byText=new Map();
  specs.forEach(s=>{const k=s.text;if(!k)return;if(!byText.has(k))byText.set(k,[]);byText.get(k).push(s)});
  const used=new Map();
  Array.from(svg.querySelectorAll('text')).forEach(el=>{
    const key=(el.textContent||'').trim();if(!key||!byText.has(key))return;
    const list=byText.get(key);const i=used.get(key)||0;if(i>=list.length)return;
    const spec=list[i];used.set(key,i+1);
    if(spec.fs)el.setAttribute('font-size',spec.fs);
    if(spec.fw)el.setAttribute('font-weight',spec.fw);
    if(spec.fst)el.setAttribute('font-style',spec.fst);
    if(spec.ff)el.setAttribute('font-family',spec.ff);
    if(spec.col){el.setAttribute('fill',spec.col);el.setAttribute('stroke',spec.col)}
  });
}

function ScoreView({files,activeFile,onOsmdReady,playbackMeasure,isPlaying,annotations,onAnnotationEdit,onAnnotationCreate}){
  const containerRef=useRef(null);
  const ossiaRef=useRef(null);
  const osmdRef=useRef(null);
  const ossiaOsmdRef=useRef(null);
  const [rendered,setRendered]=useState(false);

  useEffect(()=>{
    if(!files.length||!containerRef.current){setRendered(false);if(onOsmdReady)onOsmdReady(null);return}
    const file=files[activeFile]||files[0];
    let cancelled=false;
    if(onOsmdReady)onOsmdReady(null);
    (async()=>{
      try{
        containerRef.current.innerHTML='';
        const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(containerRef.current,{
          autoResize:true,backend:'svg',drawTitle:true,drawComposer:true,
          drawPartNames:true,drawMeasureNumbers:true,
        });
        osmdRef.current=osmd;
        await osmd.load(new XMLSerializer().serializeToString(file.xmlDoc));
        if(cancelled)return;
        osmd.render();
        if(onOsmdReady)onOsmdReady(osmd);
        applyLyricStylesToSvg(containerRef.current,file.xmlDoc);

        // Ossia 오버레이 렌더링 (있는 경우)
        if(ossiaRef.current){
          ossiaRef.current.innerHTML='';
          if(file.ossiaMxml){
            try{
              const ossiaOsmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(ossiaRef.current,{
                autoResize:false,backend:'svg',drawTitle:false,drawComposer:false,
                drawPartNames:true,drawMeasureNumbers:true,drawCredits:false,
              });
              ossiaOsmdRef.current=ossiaOsmd;
              await ossiaOsmd.load(file.ossiaMxml);
              if(cancelled)return;
              ossiaOsmd.zoom=0.65;
              ossiaOsmd.render();
            }catch(oe){
              ossiaRef.current.innerHTML='<div style="padding:8px;color:#c33;font-size:11px">Ossia 렌더링 실패: '+oe.message+'</div>';

      }
    })();
    return()=>{cancelled=true};
  },[files,activeFile]);

  useEffect(()=>{
    const handler=e=>{
      const measure=Math.max(1,parseInt(e.detail?.measure||'1',10));
      const box=containerRef.current;
      if(!box||!files.length)return;
      const total=(files[activeFile]||files[0])?.xmlDoc?.querySelector('part')?.querySelectorAll('measure')?.length||1;
      const maxScroll=Math.max(0,box.scrollHeight-box.clientHeight);
      const ratio=total>1?(measure-1)/(total-1):0;
      box.scrollTo({top:maxScroll*ratio,behavior:'smooth'});
    };
    window.addEventListener('mxl-scroll-measure',handler);
    return()=>window.removeEventListener('mxl-scroll-measure',handler);
  },[files,activeFile]);

  if(!files.length)return <div className="main-score">
    <div className="score-empty">
      <div className="score-empty__staff">
        <div className="score-empty__line"/>
        <div className="score-empty__line"/>

  return <div className="main-score">
    <div className={`score-measure-overlay${isPlaying&&playbackMeasure?' score-measure-overlay--visible':''}`}>
      <span className="score-measure-overlay__label">Measure</span>

/* ==============================================================
   TRANSPORT BAR — bottom playback / tempo bar
   ============================================================== */
function CursorTransportBar({files,bpm,onBpmChange,osmdRef}){
  const [isPlaying,setIsPlaying]=useState(false);
  const timerRef=useRef(null);
  const playingRef=useRef(false);
  const bpmRef=useRef(bpm);

  useEffect(()=>{bpmRef.current=bpm;},[bpm]);

  const fileCount=files.length;
  const totalNotes=useMemo(()=>{
    let n=0;files.forEach(f=>{n+=f.xmlDoc.querySelectorAll('note:not([rest])').length});return n;
  },[files]);
  const totalMeasures=useMemo(()=>{
    if(!files.length)return 0;
    return files[0].xmlDoc.querySelector('part')?.querySelectorAll('measure')?.length||0;
  },[files]);

  /* ── 정지 (내부용) ── */
  const doStop=useCallback(()=>{
    clearTimeout(timerRef.current);
    timerRef.current=null;
    playingRef.current=false;
    setIsPlaying(false);
  },[]);

  /* 파일 바뀌면 자동 정지 */
  useEffect(()=>{doStop();},[files,doStop]);

  /* ── 한 스텝씩 커서 전진 ── */
  const tick=useCallback(()=>{
    const osmd=osmdRef?.current;
    if(!osmd?.cursor||!playingRef.current)return;
    try{
      /* 현재 음표 길이(4분음표 단위) 읽기 → 다음 tick 간격 계산 */
      let qLen=1;
      try{
        const notes=osmd.cursor.NotesUnderCursor?.();
        if(notes&&notes.length>0&&notes[0].length?.realValue)
          qLen=notes[0].length.realValue;
      }catch(_){}
      const ms=Math.max(60,Math.round(qLen*(60000/bpmRef.current)));

      timerRef.current=setTimeout(()=>{
        if(!playingRef.current)return;
        const o=osmdRef?.current;
        if(!o?.cursor)return;
        if(o.cursor.Iterator?.EndReached){doStop();return;}
        o.cursor.next();
        if(o.cursor.Iterator?.EndReached){doStop();return;}
        tick();
      },ms);
    }catch(e){doStop();}
  },[osmdRef,doStop]);

  /* ── 재생 / 일시정지 ── */
  const handlePlay=useCallback(()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return;}
    const osmd=osmdRef?.current;
    if(!osmd?.cursor){alert('악보가 아직 렌더링되지 않았습니다.');return;}
    if(playingRef.current){doStop();return;}       /* 일시정지 */
    try{
      osmd.cursor.show();
      playingRef.current=true;
      setIsPlaying(true);
      tick();
    }catch(e){doStop();}
  },[files.length,osmdRef,doStop,tick]);

  /* ── 정지 + 처음으로 ── */
  const handleStop=useCallback(()=>{
    doStop();
    try{const osmd=osmdRef?.current;if(osmd?.cursor){osmd.cursor.reset();osmd.cursor.show();}}catch(_){}
  },[osmdRef,doStop]);

  /* ── 처음으로 (재생 상태 유지) ── */
  const handleRewind=useCallback(()=>{
    const wasPlaying=playingRef.current;
    doStop();
    try{
      const osmd=osmdRef?.current;
      if(osmd?.cursor){osmd.cursor.reset();osmd.cursor.show();}
    }catch(_){}
    if(wasPlaying){
      playingRef.current=true;
      setIsPlaying(true);
      tick();
    }
  },[osmdRef,doStop,tick]);

  return <div className="transport">
    <div className="transport-inner">
      <div className="transport__section">
        <button className="transport__btn" onClick={handleRewind} title="처음으로">⏮</button>
        <button
          className={`transport__btn transport__btn--play${isPlaying?' transport__btn--playing':''}`}
          onClick={handlePlay}
          title={isPlaying?'일시정지':'재생'}>
          {isPlaying?'⏸':'▶'}
        </button>
        <button className="transport__btn" onClick={handleStop} title="정지 / 처음으로">⏹</button>
      </div>

      <div className="transport__divider"/>

      <div className="transport__section">
        <div>
          <div className="transport__label">Tempo</div>
          <div className="transport__value transport__value--accent">{bpm} BPM</div>
        </div>
        <input className="transport__tempo-slider" type="range" min={20} max={300} value={bpm}
          onChange={e=>onBpmChange(parseInt(e.target.value))}/>
      </div>

      <div className="transport__divider"/>

      <div className="transport__section">
        <div>
          <div className="transport__label">마디</div>
          <div className="transport__value">{totalMeasures}</div>
        </div>
      </div>

      <div className="transport__divider"/>

      <div className="transport__section">
        <div>
          <div className="transport__label">음표</div>
          <div className="transport__value">{totalNotes}</div>
        </div>
      </div>

      <div className="transport__section--right">
        <div>
          <div className="transport__label">파일</div>
          <div className="transport__value">{fileCount}개</div>
        </div>
      </div>
    </div>
  </div>;
}

function createMidiSynth(instrument){
  if(!window.Tone)return null;
  const baseEnvelope={attack:0.01,decay:0.1,sustain:0.7,release:0.3};
  const configs={
    piano:{oscillator:{type:'triangle'},envelope:baseEnvelope},
    strings:{oscillator:{type:'sawtooth'},envelope:{...baseEnvelope,attack:0.08,release:0.55}},
    flute:{oscillator:{type:'sine'},envelope:{...baseEnvelope,attack:0.03,release:0.35}},
  };
  const synth=new Tone.PolySynth(Tone.Synth,configs[instrument]||configs.piano);
  synth.maxPolyphony=16;
  let effect=null;
  if(instrument==='strings'){
    effect=new Tone.Filter(800,'lowpass').toDestination();
    synth.connect(effect);
  }else if(instrument==='flute'){
    effect=new Tone.Vibrato(5,0.3).toDestination();
    synth.connect(effect);
  }else{
    synth.toDestination();
  }
  return{synth,effect,dispose(){try{synth.dispose();effect?.dispose();}catch(_){}}};
}

function MidiPlayer({file,fileCount,currentBpm,onBpmChange,onPlaybackUpdate}){
  const [isPlaying,setIsPlaying]=useState(false);
  const [positionSec,setPositionSec]=useState(0);
  const [instrument,setInstrument]=useState('piano');
  const [volumeDb,setVolumeDb]=useState(-8);
  const [selectedParts,setSelectedParts]=useState({});
  const [loopEnabled,setLoopEnabled]=useState(false);
  const [loopStart,setLoopStart]=useState(1);
  const [loopEnd,setLoopEnd]=useState(1);
  const synthRef=useRef(null);
  const isPlayingRef=useRef(false);

  const playbackData=useMemo(()=>{
    if(!file?.xmlDoc)return{events:[],parts:[],measureTimeline:[],totalMeasures:0,totalDuration:0};
    return extractMidiPlaybackData(file.xmlDoc,currentBpm);
  },[file,currentBpm]);

  const partKey=playbackData.parts.map(p=>p.id).join('|');
  const enabledPartIds=useMemo(()=>{
    const ids=playbackData.parts.filter(p=>selectedParts[p.id]!==false).map(p=>p.id);
    return new Set(ids);
  },[playbackData.parts,selectedParts]);

  const playableEvents=useMemo(()=>playbackData.events.filter(e=>enabledPartIds.has(e.partId)),[playbackData.events,enabledPartIds]);
  const totalDuration=Math.max(0.1,playbackData.totalDuration||0);
  const totalMeasures=Math.max(1,playbackData.totalMeasures||1);
  const avgMeasureSec=playbackData.totalMeasures&&playbackData.totalDuration
    ?playbackData.totalDuration/playbackData.totalMeasures
    :0;
  const currentMeasure=avgMeasureSec
    ?Math.min(totalMeasures,Math.max(1,Math.floor(positionSec/avgMeasureSec)+1))
    :0;
  const progressPct=totalDuration?Math.min(100,Math.max(0,(positionSec/totalDuration)*100)):0;

  const getMeasureStart=useCallback(measure=>{
    const idx=Math.max(0,Math.min(totalMeasures-1,measure-1));
    return playbackData.measureTimeline[idx]?.startSec||(avgMeasureSec*idx)||0;
  },[playbackData.measureTimeline,avgMeasureSec,totalMeasures]);

  const getMeasureEnd=useCallback(measure=>{
    const idx=Math.max(0,Math.min(totalMeasures-1,measure-1));
    return playbackData.measureTimeline[idx]?.endSec||(avgMeasureSec*(idx+1))||totalDuration;
  },[playbackData.measureTimeline,avgMeasureSec,totalMeasures,totalDuration]);

  const disposeSynth=useCallback(()=>{
    synthRef.current?.dispose?.();
    synthRef.current=null;
  },[]);

  const ensureSynth=useCallback(()=>{
    if(!window.Tone)return null;
    if(synthRef.current?.instrument===instrument)return synthRef.current;
    disposeSynth();
    const chain=createMidiSynth(instrument);
    if(chain)chain.instrument=instrument;
    synthRef.current=chain;
    return chain;
  },[instrument,disposeSynth]);

  const cancelTransport=useCallback(()=>{
    if(!window.Tone)return;
    Tone.Transport.stop();
    Tone.Transport.cancel();
    Tone.Transport.loop=false;
  },[]);

  const handleStop=useCallback(()=>{
    cancelTransport();
    isPlayingRef.current=false;
    setIsPlaying(false);
    setPositionSec(0);
    onPlaybackUpdate?.({isPlaying:false,currentMeasure:0});
  },[cancelTransport,onPlaybackUpdate]);

  const schedulePlayback=useCallback(()=>{
    if(!window.Tone)return false;
    const chain=ensureSynth();
    if(!chain?.synth)return false;
    Tone.Transport.cancel();
    Tone.Transport.bpm.value=currentBpm;
    playableEvents.forEach(ev=>{
      Tone.Transport.schedule(time=>{
        chain.synth.triggerAttackRelease(
          midiToToneNote(ev.midiNote),
          Math.max(0.05,ev.durationSec),
          time,
          Math.max(0.05,Math.min(1,ev.velocity/127))
        );
      },ev.startSec);
    });
    const startSec=getMeasureStart(loopStart);
    const endSec=Math.max(startSec+0.1,getMeasureEnd(loopEnd));
    Tone.Transport.loop=loopEnabled;
    Tone.Transport.loopStart=startSec;
    Tone.Transport.loopEnd=endSec;
    if(!loopEnabled){
      Tone.Transport.scheduleOnce(()=>{
        Tone.Transport.stop();
        isPlayingRef.current=false;
        setIsPlaying(false);
        setPositionSec(playbackData.totalDuration||0);
        onPlaybackUpdate?.({isPlaying:false,currentMeasure:0});
      },Math.max(0.1,playbackData.totalDuration||0));
    }
    return true;
  },[
    ensureSynth,playableEvents,currentBpm,loopEnabled,loopStart,loopEnd,
    getMeasureStart,getMeasureEnd,playbackData.totalDuration,onPlaybackUpdate
  ]);

  const handlePlay=useCallback(async()=>{
    if(isPlaying)return;
    if(!file){alert('먼저 파일을 업로드해주세요.');return;}
    if(!window.Tone){alert('Tone.js가 아직 로드되지 않았습니다.');return;}
    if(!playableEvents.length){alert('재생할 음표가 없습니다.');return;}
    await Tone.start();
    if(!schedulePlayback())return;
    const basePosition=positionSec>=(playbackData.totalDuration||0)-0.01?0:positionSec;
    const loopA=getMeasureStart(loopStart);
    const loopB=getMeasureEnd(loopEnd);
    const startAt=loopEnabled&&(basePosition<loopA||basePosition>=loopB)
      ?loopA
      :Math.min(Math.max(0,basePosition),playbackData.totalDuration||0);
    Tone.Transport.seconds=startAt;
    Tone.Transport.start();
    isPlayingRef.current=true;
    setIsPlaying(true);
  },[
    isPlaying,file,playableEvents.length,schedulePlayback,positionSec,playbackData.totalDuration,
    loopEnabled,loopStart,loopEnd,getMeasureStart,getMeasureEnd
  ]);

  const handlePause=useCallback(()=>{
    if(!window.Tone)return;
    Tone.Transport.pause();
    isPlayingRef.current=false;
    setIsPlaying(false);
  },[]);

  const handleSeek=useCallback(e=>{
    const next=parseFloat(e.target.value)||0;
    setPositionSec(next);
    if(window.Tone)Tone.Transport.seconds=next;
  },[]);

  const updateLoopStart=useCallback(value=>{
    const next=Math.min(totalMeasures,Math.max(1,parseInt(value,10)||1));
    setLoopStart(next);
    setLoopEnd(end=>Math.max(next,end));
  },[totalMeasures]);

  const updateLoopEnd=useCallback(value=>{
    const next=Math.min(totalMeasures,Math.max(loopStart,parseInt(value,10)||loopStart));
    setLoopEnd(next);
  },[loopStart,totalMeasures]);

  useEffect(()=>{isPlayingRef.current=isPlaying;},[isPlaying]);

  useEffect(()=>{
    if(!file){
      setSelectedParts({});
      setLoopStart(1);
      setLoopEnd(1);
      handleStop();
      return;
    }
    const defaults={};
    playbackData.parts.forEach(part=>{defaults[part.id]=true;});
    setSelectedParts(defaults);
    setLoopStart(1);
    setLoopEnd(Math.max(1,playbackData.totalMeasures||1));
    setPositionSec(0);
  },[file,partKey]);

  useEffect(()=>{
    if(!window.Tone)return;
    const master=Tone.Master||Tone.Destination;
    if(master?.volume)master.volume.value=volumeDb;
  },[volumeDb]);

  useEffect(()=>{
    if(!window.Tone||!isPlayingRef.current)return;
    const startSec=getMeasureStart(loopStart);
    const endSec=Math.max(startSec+0.1,getMeasureEnd(loopEnd));
    Tone.Transport.loop=loopEnabled;
    Tone.Transport.loopStart=startSec;
    Tone.Transport.loopEnd=endSec;
  },[loopEnabled,loopStart,loopEnd,getMeasureStart,getMeasureEnd]);

  useEffect(()=>{
    if(!isPlaying)return;
    const id=setInterval(()=>{
      if(!window.Tone)return;
      const sec=Math.max(0,Tone.Transport.seconds||0);
      setPositionSec(loopEnabled?sec:Math.min(sec,playbackData.totalDuration||sec));
    },100);
    return()=>clearInterval(id);
  },[isPlaying,loopEnabled,playbackData.totalDuration]);

  useEffect(()=>{
    onPlaybackUpdate?.({isPlaying,currentMeasure:isPlaying?currentMeasure:0});
  },[isPlaying,currentMeasure,onPlaybackUpdate]);

  useEffect(()=>()=>{handleStop();disposeSynth();},[handleStop,disposeSynth]);

  useEffect(()=>{
    if(isPlayingRef.current)handleStop();
    else if(window.Tone)Tone.Transport.cancel();
    setPositionSec(0);
  },[file,currentBpm,instrument,partKey,selectedParts,handleStop]);

  return <div className="transport-inner">
    <div className="midi-player" style={{'--midi-progress':`${progressPct}%`}}>
      <div className="midi-player__controls">
        <button className={`transport__btn transport__btn--play${isPlaying?' transport__btn--playing':''}`} onClick={handlePlay} title="재생">▶</button>
        <button className="transport__btn" onClick={handlePause} title="일시정지">⏸</button>
        <button className="transport__btn" onClick={handleStop} title="정지">⏹</button>
      </div>

      <div className="midi-player__progress-wrap">
        <input className="midi-player__progress" type="range" min={0} max={totalDuration} step={0.01}
          value={Math.min(positionSec,totalDuration)} onChange={handleSeek}/>
        <div className="midi-player__time">
          <span>{formatSeconds(positionSec)}</span>
          <span>{formatSeconds(playbackData.totalDuration||0)}</span>
        </div>
      </div>

      <div className="midi-player__stat midi-player__stat--measure">
        <div className="transport__label">마디</div>
        <div className="transport__value transport__value--accent">
          {playbackData.totalMeasures?currentMeasure||1:0}/{playbackData.totalMeasures||0}
        </div>
      </div>

      <div className="midi-player__stat midi-player__stat--files">
        <div className="transport__label">파일</div>
        <div className="transport__value">{fileCount}개</div>
      </div>

      <label className="midi-player__field midi-player__field--tempo">
        <span className="transport__label">Tempo</span>
        <input className="transport__tempo-slider" type="range" min={20} max={300} value={currentBpm}
          onChange={e=>onBpmChange(parseInt(e.target.value,10)||120)}/>
        <span className="transport__value">{currentBpm} BPM</span>
      </label>

      <label className="midi-player__field midi-player__field--instrument">
        <span className="transport__label">악기</span>
        <select className="midi-player__select" value={instrument} onChange={e=>setInstrument(e.target.value)}>
          <option value="piano">Piano</option>
          <option value="strings">Strings</option>
          <option value="flute">Flute</option>
        </select>
      </label>

      <label className="midi-player__field midi-player__field--volume">
        <span className="transport__label">Volume</span>
        <input className="midi-player__mini-range" type="range" min={-40} max={6} step={1}
          value={volumeDb} onChange={e=>setVolumeDb(parseInt(e.target.value,10)||0)}/>
        <span className="transport__value">{volumeDb} dB</span>
      </label>

      <div className="midi-player__loop">
        <button className={`midi-player__toggle${loopEnabled?' midi-player__toggle--active':''}`}
          onClick={()=>setLoopEnabled(v=>!v)}>A-B</button>
        <label className="midi-player__field midi-player__field--compact">
          <span className="transport__label">A</span>
          <input className="midi-player__mini-range" type="range" min={1} max={totalMeasures} value={loopStart}
            onChange={e=>updateLoopStart(e.target.value)}/>
          <span className="transport__value">{loopStart}</span>
        </label>
        <label className="midi-player__field midi-player__field--compact">
          <span className="transport__label">B</span>
          <input className="midi-player__mini-range" type="range" min={1} max={totalMeasures} value={loopEnd}
            onChange={e=>updateLoopEnd(e.target.value)}/>
          <span className="transport__value">{loopEnd}</span>
        </label>
      </div>

      <div className="midi-player__parts">
        {playbackData.parts.map(part=>
          <label className="midi-player__part" key={part.id}>
            <input type="checkbox" checked={selectedParts[part.id]!==false}
              onChange={e=>setSelectedParts(s=>({...s,[part.id]:e.target.checked}))}/>
            <span>{part.label}</span>
          </label>
        )}
      </div>
    </div>
  </div>;
}

function TransportBar({files,activeFile,bpm,onBpmChange,onPlaybackUpdate}){
  const file=files[activeFile]||files[0]||null;
  return <div className="transport">
    <MidiPlayer
      file={file}
      fileCount={files.length}
      currentBpm={bpm}
      onBpmChange={onBpmChange}
      onPlaybackUpdate={onPlaybackUpdate}
    />
  </div>;
}

function App(){
  const [leftPanel,setLeftPanel]=useState('upload');
  const [rightPanel,setRightPanel]=useState('chords');
  const [files,setFiles]=useState([]);
  const [activeFile,setActiveFile]=useState(0);
  const [showLeft,setShowLeft]=useState(true);
  const [showRight,setShowRight]=useState(true);
  const [progress,setProgress]=useState({visible:false,msg:''});
  const [bpm,setBpm]=useState(120);
  const [playback,setPlayback]=useState({isPlaying:false,currentMeasure:0});
  const [history,setHistory]=useState([]);
  const [historyIndex,setHistoryIndex]=useState(-1);
  const [historyNotice,setHistoryNotice]=useState(null);
  const [shareOpen,setShareOpen]=useState(false);
  const [sessionMenuOpen,setSessionMenuOpen]=useState(false);
  const [savedNotice,setSavedNotice]=useState(null);
  const [pendingRestore,setPendingRestore]=useState(null);
  const [sessionSlots,setSessionSlots]=useState([]);
  const [annotations,setAnnotations]=useState([]);
  const [overlayEditing,setOverlayEditing]=useState(null);
  const importSessionRef=useRef(null);
  const sessionBootRef=useRef(false);
  const osmdRef=useRef(null);
  const handleOsmdReady=useCallback(osmd=>{osmdRef.current=osmd;},[]);
  const handlePlaybackUpdate=useCallback(next=>{
    setPlayback(prev=>
      prev.isPlaying===next.isPlaying&&prev.currentMeasure===next.currentMeasure?prev:next
    );
  },[]);

  const showProgress=useCallback(msg=>setProgress({visible:true,msg}),[]);
  const hideProgress=useCallback(()=>setProgress({visible:false,msg:''}),[]);

  const pushHistory=useCallback((nextFiles,label='변환')=>{
    const next=GlobalHistoryCore.pushHistoryEntry(history,historyIndex,nextFiles,label);
    setHistory(next.history);
    setHistoryIndex(next.index);
    setHistoryNotice({m:`기록: ${label}`,t:'info'});
  },[history,historyIndex]);

  const restoreHistoryAt=useCallback((newIdx,notice)=>{
    if(newIdx<0||newIdx>=history.length)return;
    const restored=GlobalHistoryCore.restoreHistoryFiles(history[newIdx]);
    setHistoryIndex(newIdx);
    setFiles(restored);
    setActiveFile(prev=>Math.max(0,Math.min(prev,Math.max(0,restored.length-1))));
    if(notice)setHistoryNotice({m:notice,t:'info'});
  },[history]);

  const undo=useCallback(()=>{
    if(historyIndex<=0)return;
    restoreHistoryAt(historyIndex-1,`↩ 실행 취소: ${history[historyIndex].label}`);
  },[history,historyIndex,restoreHistoryAt]);

  const redo=useCallback(()=>{
    if(historyIndex>=history.length-1)return;
    restoreHistoryAt(historyIndex+1,`↪ 다시 실행: ${history[historyIndex+1].label}`);
  },[history,historyIndex,restoreHistoryAt]);

  const jumpHistory=useCallback(idx=>{
    restoreHistoryAt(idx,`● 히스토리 이동: ${history[idx]?.label||''}`);
  },[history,restoreHistoryAt]);

  const clearHistory=useCallback(()=>{
    setHistory([]);
    setHistoryIndex(-1);
    setHistoryNotice({m:'히스토리를 모두 지웠습니다.',t:'warn'});
    try{localStorage.removeItem('mxlStudioHistoryMeta')}catch(e){}
  },[]);

  /* Detect tempo from first file */
  useEffect(()=>{
    if(!files.length)return;
    const doc=files[0].xmlDoc;
    const s=doc.querySelector('sound[tempo]');
    if(s){const t=parseFloat(s.getAttribute('tempo'));if(t>0){setBpm(t);return}}
    const pm=doc.querySelector('metronome per-minute');
    if(pm){const t=parseFloat(pm.textContent);if(t>0){setBpm(t);return}}
    setBpm(120);
  },[files]);

  useEffect(()=>{
    try{
      const meta=GlobalHistoryCore.serializeHistoryMeta(history);
      localStorage.setItem('mxlStudioHistoryMeta',JSON.stringify(meta));
    }catch(e){}
  },[history]);

  useEffect(()=>{
    const handler=e=>{
      const tag=(e.target?.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||e.target?.isContentEditable)return;
      const key=(e.key||'').toLowerCase();
      if((e.ctrlKey||e.metaKey)&&key==='z'&&!e.shiftKey){e.preventDefault();undo();}
      if((e.ctrlKey||e.metaKey)&&(key==='y'||(key==='z'&&e.shiftKey))){e.preventDefault();redo();}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[undo,redo]);

  const convertMsczFile=useCallback(async(file)=>{
    const endpoint=(()=>{try{return localStorage.getItem('msczConvertEndpoint')||DEFAULT_MSCZ_CONVERT_ENDPOINT}catch(e){return DEFAULT_MSCZ_CONVERT_ENDPOINT}})();
    const form=new FormData();
    form.append('file',file,file.name);
    const res=await fetch(endpoint,{method:'POST',body:form});
    if(!res.ok){
      let msg='';
      try{const data=await res.json();msg=data.detail||JSON.stringify(data)}
      catch(e){msg=await res.text()}
      throw new Error(`MSCZ 변환 실패: ${msg||res.status}`);
    }
    const data=await res.json();
    if(data.status==='error')throw new Error(data.detail||'MSCZ 변환 실패');
    if(!data.xml)throw new Error('MSCZ 변환 결과에 MusicXML이 없습니다.');
    return {xmlString:data.xml,name:data.name||file.name.replace(/\.mscz$/i,'.musicxml')};
  },[]);

  const addFiles=useCallback(async(fileList)=>{
    showProgress('파일 읽는 중...');
    const newFiles=[];
    for(const file of fileList){
      try{
        const ext=file.name.split('.').pop().toLowerCase();
        let xmlString;let importedName=file.name;
        if(ext==='mxl'){
          const zip=await JSZip.loadAsync(file);let xmlFile=null;
          const container=zip.file('META-INF/container.xml');
          if(container){const cx=await container.async('string');const cd=new DOMParser().parseFromString(cx,'text/xml');
            const rf=cd.querySelector('rootfile');if(rf){xmlFile=zip.file(rf.getAttribute('full-path'))}}
          if(!xmlFile)zip.forEach((path,entry)=>{if(!entry.dir&&path.endsWith('.xml')&&!path.startsWith('META-INF'))xmlFile=entry});
          if(!xmlFile)throw new Error('XML not found in MXL');
          xmlString=await xmlFile.async('string');
        }else if(ext==='mscz'){
          showProgress(`${file.name} 변환 중...`);
          const converted=await convertMsczFile(file);
          xmlString=converted.xmlString;
          importedName=converted.name;
        }else{xmlString=await file.text()}
        const xmlDoc=new DOMParser().parseFromString(xmlString,'text/xml');
        if(xmlDoc.querySelector('parsererror'))throw new Error('XML 파싱 오류');
        newFiles.push({name:importedName,xmlDoc,xmlString,sourceName:file.name});
      }catch(e){alert(`${file.name}: ${e.message}`)}
    }
    if(newFiles.length){
      const merged=[...files,...newFiles];
      setFiles(merged);
      pushHistory(merged,'파일 업로드');
    }
    hideProgress();
  },[files,showProgress,hideProgress,convertMsczFile,pushHistory]);

  const removeFile=useCallback(i=>{
    const updated=files.filter((_,j)=>j!==i);
    setFiles(updated);
    pushHistory(updated,'파일 제거');
    if(activeFile>=files.length-1)setActiveFile(Math.max(0,files.length-2));
  },[activeFile,files,pushHistory]);

  const clearFiles=useCallback(()=>{
    setFiles([]);
    setActiveFile(0);
    pushHistory([],'파일 모두 지우기');
  },[pushHistory]);

  const updateFiles=useCallback((newFiles,label='변환')=>{
    setFiles(newFiles);
    pushHistory(newFiles,label);
  },[pushHistory]);
  const panelProps={files,activeFile,showProgress,hideProgress,onFilesUpdate:updateFiles,annotations,setAnnotations};

  const restoreSessionData=useCallback((session,label='세션 복원')=>{
    if(!window.ShareSessionCore)return;
    const hydrated=window.ShareSessionCore.hydrateSession(session);
    setFiles(hydrated.files);
    setActiveFile(Math.min(hydrated.selectedFileIdx||0,Math.max(0,hydrated.files.length-1)));
    if(hydrated.activePanel)setLeftPanel(hydrated.activePanel);
    if(hydrated.rightPanel)setRightPanel(hydrated.rightPanel);
    pushHistory(hydrated.files,label);
    setPendingRestore(null);
    setHistoryNotice({m:label,t:'ok'});
  },[pushHistory]);

  useEffect(()=>{
    if(!window.ShareSessionCore)return;
    if(sessionBootRef.current)return;
    sessionBootRef.current=true;
    setSessionSlots(window.ShareSessionCore.readJson(window.ShareSessionCore.SLOT_KEY)||[]);
    try{
      const shared=window.ShareSessionCore.parseShareURL(window.location.href);
      if(shared){
        const loaded=[shared];
        setFiles(loaded);
        setActiveFile(0);
        pushHistory(loaded,'공유 악보 불러오기');
        setHistoryNotice({m:'공유 악보를 불러왔습니다.',t:'ok'});
        return;
      }
    }catch(e){
      setHistoryNotice({m:'공유 링크 파싱 실패',t:'err'});
    }
    const saved=window.ShareSessionCore.readJson(window.ShareSessionCore.SESSION_KEY);
    if(saved?.files?.length)setPendingRestore(saved);
    try{
      const savedAnnotations=JSON.parse(localStorage.getItem('mxlstudio_annotations_v1')||'[]');
      if(Array.isArray(savedAnnotations))setAnnotations(savedAnnotations);
    }catch(e){}
  },[pushHistory]);

  useEffect(()=>{
    try{localStorage.setItem('mxlstudio_annotations_v1',JSON.stringify(annotations))}catch(e){}
  },[annotations]);

  useEffect(()=>{
    if(!window.ShareSessionCore||!files.length)return;
    const timer=setTimeout(()=>{
      try{
        const session=window.ShareSessionCore.serializeSession({
          files,
          activePanel:leftPanel,
          rightPanel,
          selectedFileIdx:activeFile,
        });
        window.ShareSessionCore.writeJson(window.ShareSessionCore.SESSION_KEY,session);
        setSavedNotice(`저장됨 ${window.ShareSessionCore.shortTime(session.savedAt)}`);
        setTimeout(()=>setSavedNotice(null),2000);
      }catch(e){}
    },5000);
    return()=>clearTimeout(timer);
  },[files,leftPanel,rightPanel,activeFile]);

  const saveSessionSlot=useCallback(()=>{
    if(!files.length)return;
    const name=prompt('저장할 세션 이름을 입력하세요.','MXL Studio Session');
    if(!name)return;
    try{
      const session=window.ShareSessionCore.serializeSession({files,activePanel:leftPanel,rightPanel,selectedFileIdx:activeFile});
      const slot={...session,id:`slot-${Date.now()}`,name};
      const next=window.ShareSessionCore.upsertSessionSlot(sessionSlots,slot);
      window.ShareSessionCore.writeJson(window.ShareSessionCore.SLOT_KEY,next);
      setSessionSlots(next);
      setHistoryNotice({m:'현재 세션을 저장했습니다.',t:'ok'});
    }catch(e){setHistoryNotice({m:e.message,t:'err'})}
  },[files,leftPanel,rightPanel,activeFile,sessionSlots]);

  const exportSessionJson=useCallback(()=>{
    if(!files.length)return;
    const session=window.ShareSessionCore.serializeSession({files,activePanel:leftPanel,rightPanel,selectedFileIdx:activeFile});
    downloadBlob(new Blob([JSON.stringify(session,null,2)],{type:'application/json'}),`mxlstudio-session-${Date.now()}.json`);
    setHistoryNotice({m:'세션 JSON을 내보냈습니다.',t:'ok'});
  },[files,leftPanel,rightPanel,activeFile]);

  const importSessionJson=useCallback(async(e)=>{
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      restoreSessionData(data,'세션 가져오기');
    }catch(err){setHistoryNotice({m:'세션 가져오기 실패',t:'err'})}
  },[restoreSessionData]);

  const exportMXL=useCallback(()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const file=files[activeFile]||files[0];
    const xmlStr=new XMLSerializer().serializeToString(file.xmlDoc);
    const blob=new Blob([xmlStr],{type:'text/xml'});
    downloadBlob(blob,file.name.replace(/\.(mxl|xml|musicxml)$/i,'')+'.xml');
  },[files,activeFile]);

  const exportPNG=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const svgEl=document.querySelector('.main-score svg');
    if(!svgEl){alert('악보가 렌더링되지 않았습니다.');return}
    showProgress('PNG 생성 중...');
    try{
      const svgRect=svgEl.getBoundingClientRect();
      const scale=2;
      const w=svgRect.width*scale;const h=svgRect.height*scale;
      const svgClone=svgEl.cloneNode(true);
      svgClone.setAttribute('width',svgRect.width);svgClone.setAttribute('height',svgRect.height);
      const svgData=new XMLSerializer().serializeToString(svgClone);
      const svgBlob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(svgBlob);
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>{
          if(!blob){hideProgress();return}
          const fn=(files[activeFile]||files[0]).name.replace(/\.(mxl|xml|musicxml)$/i,'');
          downloadBlob(blob,fn+'.png');
          hideProgress();
        },'image/png');
      };
      img.onerror=()=>{URL.revokeObjectURL(url);hideProgress()};
      img.src=url;
    }catch(e){alert(e.message);hideProgress()}
  },[files,activeFile,showProgress,hideProgress]);

  const exportPDF=useCallback(()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    const svgEl=document.querySelector('.main-score svg');
    if(!svgEl){alert('악보가 렌더링되지 않았습니다.');return}
    const fn=(files[activeFile]||files[0]).name.replace(/\.(mxl|xml|musicxml)$/i,'');
    const svgClone=svgEl.cloneNode(true);
    const svgRect=svgEl.getBoundingClientRect();
    svgClone.setAttribute('width',svgRect.width);svgClone.setAttribute('height',svgRect.height);
    const svgData=new XMLSerializer().serializeToString(svgClone);
    const win=window.open('','_blank');
    if(!win){alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도해주세요.');return}
    win.document.write(`<!DOCTYPE html><html><head><title>${fn}</title><style>@page{margin:10mm}body{margin:0;padding:0;background:#fff}svg{max-width:100%;height:auto}</style></head><body>${svgData}</body></html>`);
    win.document.close();
    setTimeout(()=>win.print(),800);
  },[files,activeFile]);

  const selectLeftPanel=useCallback(id=>{setLeftPanel(id);setShowLeft(true);},[]);
  const selectRightPanel=useCallback(id=>{setRightPanel(id);setShowRight(true);},[]);

  const ALL_PANELS={
    upload:<UploadPanel files={files} onFilesAdd={addFiles} onRemove={removeFile} onClear={clearFiles}/>,
    transpose:<TransposePanel {...panelProps}/>,
    keychange:<KeyChangePanel {...panelProps}/>,
    capo:<CapoPanel {...panelProps}/>,
    range:<RangePanel {...panelProps}/>,
    instrument:<InstrumentPanel {...panelProps}/>,
    tempo:<TempoPanel {...panelProps}/>,
    tempochange:<TempoChangePanel {...panelProps}/>,
    ossia:<OssiaPanel {...panelProps}/>,
    clef:<ClefPanel {...panelProps}/>,
    layout:<LayoutPanel {...panelProps}/>,
    parts:<PartsPanel {...panelProps}/>,
    notation:<NotationPanel {...panelProps}/>,
    lyrics:<LyricsPanel {...panelProps} bpm={bpm}/>,
    export:<ExportPanel {...panelProps}/>,
    color:<ColorPanel {...panelProps}/>,
    harmony:<HarmonyPanel {...panelProps}/>,
    chordtools:<ChordToolsPanel {...panelProps}/>,
    numbering:<NumberingPanel {...panelProps}/>,
    eartraining:<EarTrainingPanel {...panelProps}/>,
    lyricstyle:<LyricStylePanel {...panelProps}/>,
    chords:<ChordsPanel {...panelProps}/>,
    roman:<RomanAnalysisPanel {...panelProps}/>,
    fingering:<FingeringPanel {...panelProps}/>,
    voiceleading:<VoiceLeadingPanel {...panelProps}/>,
    patternsearch:<PatternSearchPanel {...panelProps}/>,
    annotations:<AnnotationsPanel {...panelProps}/>,
    formanalysis:<FormAnalysisPanel {...panelProps}/>,
    difficulty:<DifficultyPanel {...panelProps}/>,
    stats:<StatsPanel {...panelProps}/>,
  };

  const rootClass=`app-root${!showLeft?' app-root--left-closed':''}${!showRight?' app-root--right-closed':''}`;

  return <div className={rootClass}>
    {/* ── HEADER (메뉴바 포함) ── */}
    <header className="header">
      <div className="header__left">
        <div className="header__brand">
          <div className="header__icon">♫</div>
          <h1 className="header__title">악보 디자이너</h1>
        </div>
      </div>
      <MenuBar
        onSelectLeft={selectLeftPanel}
        onSelectRight={selectRightPanel}
        onExportMXL={exportMXL}
        onExportPNG={exportPNG}
        onExportPDF={exportPDF}
        files={files}
      />
      <div className="header__right">
        <button className={`header__toggle${showLeft?' header__toggle--active':''}`}
          onClick={()=>setShowLeft(!showLeft)} title="인스펙터 토글">☰</button>
        <div className="header__badge">파일 {files.length}개</div>
        {savedNotice&&<div className="header__saved">{savedNotice}</div>}
        <button className="header__export-btn" onClick={()=>setShareOpen(true)} disabled={!files.length} title="URL 공유">공유</button>
        <div className="session-menu-wrap">
          <button className="header__export-btn" onClick={()=>setSessionMenuOpen(v=>!v)} title="세션 저장/불러오기">세션</button>
          <SessionMenu
            open={sessionMenuOpen}
            onClose={()=>setSessionMenuOpen(false)}
            slots={sessionSlots}
            onSaveSlot={()=>{saveSessionSlot();setSessionMenuOpen(false)}}
            onLoadSlot={slot=>{restoreSessionData(slot,'세션 불러오기');setSessionMenuOpen(false)}}
            onExport={()=>{exportSessionJson();setSessionMenuOpen(false)}}
            onImportClick={()=>{importSessionRef.current?.click();setSessionMenuOpen(false)}}
            onRestoreAuto={()=>restoreSessionData(pendingRestore,'이전 세션 복원')}
            onIgnoreAuto={()=>setPendingRestore(null)}
            pendingRestore={pendingRestore}
            disabled={!files.length}
          />
        </div>
        <input ref={importSessionRef} className="hidden-file-input" type="file" accept="application/json,.json" onChange={importSessionJson}/>
        <div className="header__export-group">
          <button className="header__export-btn" onClick={exportMXL} disabled={!files.length} title="MXL 내보내기">MXL</button>
          <button className="header__export-btn" onClick={exportPNG} disabled={!files.length} title="PNG 내보내기">PNG</button>
          <button className="header__export-btn" onClick={exportPDF} disabled={!files.length} title="PDF 내보내기">PDF</button>
        </div>
      </div>
    </header>
    {pendingRestore&&<div className="restore-banner">
      <span>이전 세션 복원 ({window.ShareSessionCore?.formatSavedAt(pendingRestore.savedAt)}, 파일 {pendingRestore.files?.length||0}개)</span>
      <button onClick={()=>restoreSessionData(pendingRestore,'이전 세션 복원')}>복원하기</button>
      <button onClick={()=>setPendingRestore(null)}>무시하기</button>
    </div>}
    <ShareModal open={shareOpen} onClose={()=>setShareOpen(false)} files={files} activeFile={activeFile} onNotice={m=>setHistoryNotice({m,t:'ok'})}/>

    {/* ── LEFT ACTIVITY BAR (icon strip) ── */}
    <nav className="activity-bar">
      {LEFT_ACTIVITY_ITEMS.map(item=>
        item.sep

              {item.icon==='capo_svg'?<svg id="Fill" enableBackground="new 0 0 64 64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style={{width:'1em',height:'1em'}}><g><g><g><g><path d="m53.9844437 12.04v1.2600002l-22.1299992 3.71-9.5599995 1.6100006c-2.1276703.2700176-2.8390522 3.2936745-1.0499039 4.4800148 4.4422474 3.2166824 24.5818214 17.7894573 29.4199028 21.2899837l-.4599991.5900002-18.4500007-11.2000007c-.2600002-.1499977-.5799999-.1800003-.8600006-.079998-.2799988.0999985-.5099983.3199997-.6099987.6100006l-4.1800003 12.0099983h-1.2900009l3.4400005-13.8400002c.1000004-.4300003-.0799999-.8699989-.4599991-1.1000004l-9.9099998-6.0099983c-1.2125359-.7878056-2.9595737.191925-2.9099655 1.6400509-.0032091 6.0960388.0022526 18.8394089-.0000353 24.9899483h-2.3599997l-2.5799999-32.2999992c-.3102512-3.0670624 2.248661-5.9857826 5.3400478-6.0399542-.0000486-.0000468 38.6099511-1.6200466 38.6099511-1.6200466zm-36.0699997 6.8399992c-.101759-3.9959745-5.9388266-3.9951725-6.0399981.0000916.1043539 3.9818439 5.9362364 3.981039 6.0399981-.0000916z" fill="currentColor"/><path d="m16.974 34.39h.97v13.3h-.97z" fill="currentColor"/><path d="m14.8944445 17.8500004c1.3369493.0188828 1.3467607 2.0289402-.000041 2.0499973-1.344841-.0265503-1.3345757-2.0260124.000041-2.0499973z" fill="currentColor"/></g></g></g></g></svg>:item.icon==='panflute_svg'?<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style={{width:'1em',height:'1em'}}><g><rect x="8" y="4" width="6" height="12" rx="3" fill="currentColor"/><rect x="16" y="4" width="6" height="14" rx="3" fill="currentColor"/><rect x="24" y="4" width="6" height="16" rx="3" fill="currentColor"/><rect x="32" y="4" width="6" height="18" rx="3" fill="currentColor"/><rect x="40" y="4" width="6" height="16" rx="3" fill="currentColor"/><rect x="48" y="4" width="6" height="14" rx="3" fill="currentColor"/><path d="M6 22 Q6 16 12 16 L52 16 Q58 16 58 22 L58 28 Q58 30 56 30 L8 30 Q6 30 6 28 Z" fill="#E85A5A"/><circle cx="14" cy="24"
