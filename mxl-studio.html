function useModalA11y(open,onClose,dialogRef){
  const closeRef=useRef(onClose);
  closeRef.current=onClose;
  useEffect(()=>{
    if(!open)return;
    const previous=document.activeElement;
    const dialog=dialogRef.current;
    if(!dialog)return;
    const focusable=()=>Array.from(dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex="0"]')).filter(element=>element.getClientRects().length);
    const focusTimer=setTimeout(()=>{(focusable()[0]||dialog).focus();},0);
    const keydown=event=>{
      if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeRef.current();}
      if(event.key==='Tab'){
        const list=focusable(),first=list[0],last=list[list.length-1];
        if(!first){event.preventDefault();dialog.focus();return;}
        if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}
        else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}
      }
    };
    document.addEventListener('keydown',keydown,true);
    return()=>{clearTimeout(focusTimer);document.removeEventListener('keydown',keydown,true);if(previous?.isConnected)previous.focus();};
  },[open,dialogRef]);
}

function SessionModal({open,onClose,files,activeFile,onRestore,notify,sessionStatus,onStorageChange}){
  const dialogRef=useRef(null);
  const [name,setName]=useState('');
  const [sessions,setSessions]=useState([]);
  const [pending,setPending]=useState(null);
  const [busy,setBusy]=useState(false);
  const [renameId,setRenameId]=useState(null);
  const [renameValue,setRenameValue]=useState('');
  useModalA11y(open,onClose,dialogRef);
  const refresh=useCallback(async()=>{
    if(!window.SessionStoreCore)return;
    setSessions(await window.SessionStoreCore.listSessions());onStorageChange?.();
  },[onStorageChange]);
  useEffect(()=>{if(open){setName(`악보 세션 ${new Date().toLocaleString('sv-SE').slice(0,16)}`);setPending(null);setRenameId(null);refresh().catch(error=>notify(friendlyError(error),'err'));}},[open,refresh]);
  const perform=async(action)=>{
    if(busy)return;
    setBusy(true);
    try{await action();}catch(error){notify(error?.message?friendlyError(error):'세션 처리에 실패했습니다.','err');}finally{setBusy(false);}
  };
  const currentSession=()=>buildSessionSnapshot({id:`slot-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,name:name.trim()||'악보 세션',files,activeFile});
  const save=()=>perform(async()=>{
    if(!files.length){notify('먼저 파일을 업로드하세요.','warn');return;}
    if(!window.SessionStoreCore)throw new Error('세션 저장소를 사용할 수 없습니다.');
    const result=await window.SessionStoreCore.saveSession(currentSession());
    if(!result.ok)throw new Error(sessionSaveMessage(result));
    await refresh();notify('세션을 저장했습니다.','ok');
  });
  const restore=async session=>{
    await onRestore(session);setPending(null);onClose();notify('세션을 불러왔습니다.','ok');
  };
  const askRestore=async session=>{
    if(!session)throw new Error('세션을 찾지 못했습니다.');
    if(files.length)setPending({type:'restore',session});else await restore(session);
  };
  const confirm=()=>perform(async()=>{
    if(pending.type==='restore')await restore(pending.session);
    else{
      // 지우지 못했으면 성공이라고 알리지 않고 목록을 저장소 상태 그대로 다시 읽습니다(D13).
      const deleted=await window.SessionStoreCore.deleteSession(pending.id);
      setPending(null);await refresh();
      if(deleted)notify('세션을 삭제했습니다.','ok');
      else notify('세션을 완전히 삭제하지 못했습니다. 브라우저 저장소 상태를 확인한 뒤 다시 시도하세요.','err');
    }
  });
  const exportJson=session=>{
    const safe=(session.name||session.id||'세션').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,13).replace('T','-');
    downloadBlob(new Blob([JSON.stringify(session,null,2)],{type:'application/json'}),`mxl-session-${safe}-${stamp}.json`);
  };
  const importJson=event=>{
    const file=event.target.files?.[0];event.target.value='';if(!file)return;
    perform(async()=>{
      if(file.size>4*1024*1024)throw new Error('세션 JSON은 4MB 이하만 가져올 수 있습니다.');
      const session=JSON.parse(await file.text());
      if(session?.version!==1||!Array.isArray(session.files)||!session.files.length||session.files.length>MAX_FILES)throw new Error('지원하는 세션 JSON 형식이 아닙니다.');
      const {failures}=hydrateSessionFilesDetailed(session);
      if(failures.length)throw new Error(`세션 안의 MusicXML 악보를 읽을 수 없습니다. ${sessionFailureText(failures)}`);
      await askRestore({...session,name:session.name||file.name});
    });
  };
  const rename=session=>perform(async()=>{
    if(!renameValue.trim())throw new Error('세션 이름을 입력하세요.');
    const result=await window.SessionStoreCore.saveSession({...session,name:renameValue.trim()});
    if(!result.ok)throw new Error(`세션 이름을 저장하지 못했습니다. ${sessionSaveMessage(result)}`);
    setRenameId(null);await refresh();notify('세션 이름을 변경했습니다.','ok');
  });
  if(!open)return null;
  return <div className="share-modal-backdrop" onClick={onClose}>
    <section className="share-modal session-modal" role="dialog" aria-modal="true" aria-labelledby="session-title" tabIndex={-1} ref={dialogRef} onClick={event=>event.stopPropagation()}>
      <div className="share-modal__header"><h2 id="session-title">세션 관리</h2><button type="button" className="share-modal__close" onClick={onClose} aria-label="세션 관리 닫기">×</button></div>
      <h3>현재 세션 저장</h3>
      <div className="session-save-row"><label htmlFor="session-name">세션 이름</label><input id="session-name" className="form-input" value={name} onChange={event=>setName(event.target.value)}/><button type="button" className="btn btn--primary" disabled={busy||!files.length} onClick={save}>저장</button><button type="button" className="btn btn--secondary" disabled={busy||!files.length} onClick={()=>exportJson(currentSession())}>JSON 내보내기</button></div>
      <h3>저장된 세션</h3>
      {sessionStatus.autosaveError&&<p className="session-autosave-error" role="status">자동 저장 · 마지막 저장 실패: {sessionStatus.autosaveError}</p>}
      <div className="session-table-wrap"><table className="session-table"><thead><tr><th>이름</th><th>파일</th><th>저장 시각</th><th>크기</th><th>작업</th></tr></thead>
        <tbody>{sessions.map(session=><tr key={session.id} data-session-id={session.id}>
          <td>{renameId===session.id?<input className="form-input" aria-label="변경할 세션 이름" value={renameValue} onChange={event=>setRenameValue(event.target.value)}/>:session.id==='autosave'?'자동 저장':session.name||session.id}</td>
          <td>{session.files?.length||0}</td><td>{new Date(session.savedAt).toLocaleString('ko-KR')}</td><td>{formatBytes(new TextEncoder().encode(JSON.stringify(session)).length)}</td>
          <td><div className="session-row-actions"><button type="button" disabled={busy} onClick={()=>perform(async()=>askRestore(await window.SessionStoreCore.loadSession(session.id)))}>불러오기</button><button type="button" onClick={()=>exportJson(session)}>JSON</button>
            {session.id!=='autosave'&&<><button type="button" disabled={busy} onClick={()=>setPending({type:'delete',id:session.id})}>삭제</button>{renameId===session.id?<button type="button" onClick={()=>rename(session)}>이름 저장</button>:<button type="button" onClick={()=>{setRenameId(session.id);setRenameValue(session.name||session.id);}}>이름 변경</button>}</>}
          </div></td></tr>)}</tbody></table>{!sessions.length&&<p>저장된 세션이 없습니다.</p>}</div>
      {pending&&<div className="session-confirm" role="alert"><p>{pending.type==='restore'?'현재 작업을 덮어씁니다. 계속할까요?':'이 세션을 삭제할까요?'}</p><button type="button" className="btn btn--primary" onClick={confirm} disabled={busy}>확인</button><button type="button" className="btn btn--secondary" onClick={()=>setPending(null)}>취소</button></div>}
      <h3>JSON 가져오기</h3><input type="file" accept=".json" aria-label="세션 JSON 가져오기" disabled={busy} onChange={importJson}/>
      <p className="session-storage">저장소: {sessionStatus.backend==='idb'?'IndexedDB':'Local'} · {formatBytes(sessionStatus.usage)} / {formatBytes(sessionStatus.quota)}</p>
    </section>
  </div>;
}

function App(){
  const [isMobile,setIsMobile]=useState(()=>window.matchMedia('(max-width:700px)').matches);
  const [drawer,setDrawer]=useState({open:false,side:'left',view:'list'});
  const drawerRef=useRef(null);
  const closeDrawer=useCallback(()=>setDrawer(value=>({...value,open:false})),[]);
  useModalA11y(isMobile&&drawer.open?`${drawer.side}-${drawer.view}`:false,closeDrawer,drawerRef);
  useEffect(()=>{
    const media=window.matchMedia('(max-width:700px)');
    const change=()=>{setIsMobile(media.matches);if(!media.matches)closeDrawer();};
    media.addEventListener('change',change);return()=>media.removeEventListener('change',change);
  },[closeDrawer]);

  const [toasts,setToasts]=useState([]);
  const toastTimers=useRef(new Map());
  const toastCounter=useRef(0);
  const lastToast=useRef(null);
  const dismissToast=useCallback(id=>{
    clearTimeout(toastTimers.current.get(id));toastTimers.current.delete(id);
    setToasts(list=>list.filter(toast=>toast.id!==id));
  },[]);
  const notify=useCallback((message,type='info',{duration=3500}={})=>{
    message=String(message);
    if(!/[.!?。]$/.test(message))message+='.';
    const now=Date.now();
    if(lastToast.current?.message===message&&now-lastToast.current.time<500)return;
    lastToast.current={message,time:now};
    const id=++toastCounter.current;
    setToasts(list=>[...list,{id,message,type}].slice(-4));
    if(duration>0)toastTimers.current.set(id,setTimeout(()=>dismissToast(id),duration));
  },[dismissToast]);
  useEffect(()=>()=>{toastTimers.current.forEach(timer=>clearTimeout(timer));},[]);

  const [leftPanel,setLeftPanel]=useState('upload');
  const [mountedPanels,setMountedPanels]=useState(()=>new Set(['upload','chords']));
  const [rightPanel,setRightPanel]=useState('chords');
  const [files,setFiles]=useState([]);
  const [uploadLog,setUploadLog]=useState([]);
  const uploadingRef=useRef(false);
  const [activeFile,setActiveFile]=useState(0);
  const [showLeft,setShowLeft]=useState(true);
  const [showRight,setShowRight]=useState(true);
  const [scope,setScopeState]=useState(()=>{try{return localStorage.getItem('mxlStudio.scope')==='active'?'active':'all';}catch(_){return 'all';}});
  const setScope=useCallback(value=>{const next=value==='active'?'active':'all';setScopeState(next);try{localStorage.setItem('mxlStudio.scope',next);}catch(_){}},[]);
  const [progress,setProgress]=useState({visible:false,msg:''});
  const [bpm,setBpm]=useState(120);
  const [playback,setPlayback]=useState({isPlaying:false,currentMeasure:0});
  const [history,setHistory]=useState([]);
  const [historyIndex,setHistoryIndex]=useState(-1);
  const historyStateRef=useRef({history:[],index:-1});
  const [historyNotice,setHistoryNotice]=useState(null);
  const [restoreSession,setRestoreSession]=useState(null);
  const lastSavedHashRef=useRef(null);
  const [sessionStatus,setSessionStatus]=useState({backend:'',usage:null,quota:null,savedAt:null,error:null,autosaveError:null});
  // 자동 저장 실패 알림은 같은 이유마다 이 페이지에서 한 번만 띄웁니다(5초마다 반복되지 않게).
  const autosaveNoticeRef=useRef(new Set());
  const [shareModal,setShareModal]=useState(null);
  const [sessionModalOpen,setSessionModalOpen]=useState(false);
  const shareDialogRef=useRef(null);
  const closeShare=useCallback(()=>setShareModal(null),[]);
  const closeSessions=useCallback(()=>setSessionModalOpen(false),[]);
  useModalA11y(Boolean(shareModal),closeShare,shareDialogRef);
  const shareLoadedRef=useRef(false);
  const osmdRef=useRef(null);
  // OSMD 인스턴스는 P5-3 재생 커서 동기화에 사용합니다.
  const handleOsmdReady=useCallback(osmd=>{osmdRef.current?.cursor?.hide();osmdRef.current?.cursor?.reset();osmdRef.current=osmd;},[]);
  const handlePlaybackUpdate=useCallback(next=>{
    setPlayback(prev=>
      prev.isPlaying===next.isPlaying&&prev.currentMeasure===next.currentMeasure?prev:next
    );
  },[]);

  useEffect(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem('mxlStudio.layout')||'{}');
      for(const [side,key] of [['left','--inspector-w'],['right','--analysis-w']]){
        if(Number.isFinite(saved[side]))document.documentElement.style.setProperty(key,`${Math.max(220,Math.min(520,saved[side]))}px`);
      }
    }catch(_){}
  },[]);
  const showProgress=useCallback(msg=>setProgress({visible:true,msg}),[]);
  const hideProgress=useCallback(()=>setProgress({visible:false,msg:''}),[]);

  const pushHistory=useCallback((nextFiles,label='변환')=>{
    const previous=historyStateRef.current;
    const next=GlobalHistoryCore.pushHistoryEntry(previous.history,previous.index,nextFiles,label);
    historyStateRef.current=next;
    setHistory(next.history);
    setHistoryIndex(next.index);
    setHistoryNotice({m:`기록: ${label}`,t:'info'});
  },[]);

  const restoreHistoryAt=useCallback((newIdx,notice)=>{
    if(newIdx<0||newIdx>=history.length)return;
    const restored=GlobalHistoryCore.restoreHistoryFiles(history[newIdx]).map(trustParsedFile);
    historyStateRef.current={history:historyStateRef.current.history,index:newIdx};
    setHistoryIndex(newIdx);
    setFiles(restored);
    setActiveFile(prev=>Math.max(0,Math.min(prev,Math.max(0,restored.length-1))));
    if(notice)setHistoryNotice({m:notice,t:'info'});
  },[history]);

  const undo=useCallback(()=>{
    if(historyIndex<=0)return;
    restoreHistoryAt(historyIndex-1,`↩ 실행 취소: ${history[historyIndex].label}`);
  },[history,historyIndex,restoreHistoryAt]);

  const redo=useCallback(()=>{
    if(historyIndex>=history.length-1)return;
    restoreHistoryAt(historyIndex+1,`↪ 다시 실행: ${history[historyIndex+1].label}`);
  },[history,historyIndex,restoreHistoryAt]);

  const jumpHistory=useCallback(idx=>{
    restoreHistoryAt(idx,`● 히스토리 이동: ${history[idx]?.label||''}`);
  },[history,restoreHistoryAt]);

  // 기록을 지워도 지금 악보는 기준점 한 칸으로 남겨, 다음 편집을 되돌리면 지우기 전 상태로 돌아옵니다(B07, D6).
  const clearHistory=useCallback(()=>{
    if(!files.length){
      historyStateRef.current={history:[],index:-1};
      setHistory([]);
      setHistoryIndex(-1);
      setHistoryNotice({m:'히스토리를 모두 지웠습니다.',t:'warn'});
      return;
    }
    const next=GlobalHistoryCore.pushHistoryEntry([],-1,files,'기준점 (지우기 전 상태)');
    historyStateRef.current=next;
    setHistory(next.history);
    setHistoryIndex(next.index);
    setHistoryNotice({m:'이전 기록을 지우고 현재 악보를 기준점으로 남겼습니다.',t:'warn'});
  },[files]);
  // 기록이 기준점 한 칸뿐이면 지울 것이 없습니다. 파일이 없을 때 남은 한 칸은 지울 수 있습니다.
  const canClearHistory=history.length>1||(history.length===1&&!files.length);

  const buildSession=useCallback((id='autosave',extra={})=>({
    id,
    version:1,
    savedAt:new Date().toISOString(),
    activeFile,
    files:serializeSessionFiles(files),
    ...extra,
  }),[files,activeFile]);

  const refreshStorageUsage=useCallback(async()=>{
    if(!window.SessionStoreCore)return;
    const estimate=await window.SessionStoreCore.estimateUsage();
    setSessionStatus(prev=>({
      ...prev,
      backend:window.SessionStoreCore.backend(),
      usage:estimate?.usage ?? null,
      quota:estimate?.quota ?? null,
    }));
  },[]);

  const restoreSavedSession=useCallback(()=>{
    const restored=hydrateSessionFiles(restoreSession);
    if(!restored.length){setRestoreSession(null);return}
    setFiles(restored);
    setActiveFile(Math.max(0,Math.min(restoreSession.activeFile||0,restored.length-1)));
    pushHistory(restored,'세션 복원');
    setRestoreSession(null);
    setHistoryNotice({m:'이전 세션을 복원했습니다.',t:'info'});
  },[restoreSession,pushHistory]);

  const saveSessionSlot=useCallback(()=>setSessionModalOpen(true),[]);
  const restoreManagedSession=useCallback(async session=>{
    const {files:restored,failures}=hydrateSessionFilesDetailed(session);
    if(!restored.length||failures.length||restored.length!==session.files?.length)throw new Error(`세션 안의 악보를 읽을 수 없습니다.${failures.length?` ${sessionFailureText(failures)}`:''}`);
    setFiles(restored);
    setActiveFile(Math.max(0,Math.min(Number(session.activeFile)||0,restored.length-1)));
    pushHistory(restored,`세션 불러오기: ${session.name||session.id||'가져온 세션'}`);
    setRestoreSession(null);
  },[pushHistory]);

  const openShareModal=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    if(!window.ShareSessionCore){notify('공유 기능을 사용할 수 없습니다.','err');return}
    showProgress('공유 링크 생성 중...');
    try{
      const file=files[activeFile]||files[0];
      const info=await window.ShareSessionCore.buildShareURLv2Info(file,window.location.href.split('#')[0]);
      setShareModal({...info,copied:false});
    }catch(error){
      notify(error?.message?friendlyError(error):'공유 링크 생성에 실패했습니다.','err');
    }finally{
      hideProgress();
    }
  },[files,activeFile,showProgress,hideProgress]);

  const copyShareURL=useCallback(async()=>{
    if(!shareModal?.url)return;
    try{
      await navigator.clipboard.writeText(shareModal.url);
      setShareModal(prev=>({...prev,copied:true}));
    }catch(_){
      const input=document.querySelector('.share-modal__url');
      input?.select?.();
      document.execCommand?.('copy');
      setShareModal(prev=>({...prev,copied:true}));
    }
  },[shareModal]);

  /* Detect tempo from the active score. */
  useEffect(()=>{
    if(!files.length)return;
    const doc=activeDoc(files,activeFile);
    const s=doc.querySelector('sound[tempo]');
    if(s){const t=parseFloat(s.getAttribute('tempo'));if(t>0){setBpm(t);return}}
    const pm=doc.querySelector('metronome per-minute');
    if(pm){const t=parseFloat(pm.textContent);if(t>0){setBpm(t);return}}
    setBpm(120);
  },[files,activeFile]);


  useEffect(()=>{
    if(shareLoadedRef.current||!window.ShareSessionCore||!window.location.hash)return;
    shareLoadedRef.current=true;
    let cancelled=false;
    (async()=>{
      try{
        const shared=await window.ShareSessionCore.parseShareURLAny(window.location.href);
        if(cancelled||!shared?.xml)return;
        const xmlDoc=new DOMParser().parseFromString(shared.xml,'text/xml');
        if(xmlDoc.querySelector('parsererror'))throw new Error('공유 악보 XML을 읽을 수 없습니다.');
        const reason=unsupportedScoreReason(xmlDoc);
        if(reason)throw new Error(reason);
        const restored=[trustParsedFile({
          name:shared.name||'공유 악보.musicxml',
          sourceName:shared.sourceName||shared.name||'공유 악보.musicxml',
          xmlString:shared.xml,
          xmlDoc,
          ossiaMxml:validOssia(shared.ossiaMxml),
          ossiaMeta:shared.ossiaMeta,
        })];
        setFiles(restored);
        setActiveFile(0);
        pushHistory(restored,'공유 악보 불러오기');
        setHistoryNotice({m:'공유 악보를 불러왔습니다.',t:'info'});
      }catch(error){
        setHistoryNotice({m:`공유 링크를 읽지 못했습니다: ${friendlyError(error)}`,t:'warn'});
      }
    })();
    return()=>{cancelled=true};
  },[pushHistory]);

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      for(let attempt=0;attempt<100&&!window.SessionStoreCore;attempt++){
        await new Promise(resolve=>setTimeout(resolve,100));
        if(cancelled)return;
      }
      if(!window.SessionStoreCore){
        return;
      }
      if(cancelled)return;
      await new Promise(resolve=>setTimeout(resolve,500));
      if(cancelled)return;
      let autosave=window.SessionStoreCore.loadLocalSession?.('autosave') || null;
      for(let attempt=0;attempt<10;attempt++){
        if(autosave?.files?.length)break;
        try{
          autosave=await Promise.race([
            window.SessionStoreCore.loadSession('autosave'),
            new Promise(resolve=>setTimeout(()=>resolve(null),1200)),
          ]);
        }catch(error){
          setSessionStatus(prev=>({...prev,error:error?.message?friendlyError(error):'자동 저장을 불러오지 못했습니다'}));
          autosave=null;
        }
        if(autosave?.files?.length)break;
        await new Promise(resolve=>setTimeout(resolve,250));
        if(cancelled)return;
      }
      if(cancelled)return;
      if(autosave?.files?.length)setRestoreSession(autosave);
      await refreshStorageUsage();
      window.SessionStoreCore.migrateFromLocalStorage().catch(()=>{});
    })();
    return()=>{cancelled=true};
  },[refreshStorageUsage]);

  useEffect(()=>{
    if(!files.length||!window.SessionStoreCore)return;
    const timer=setTimeout(async()=>{
      const session=buildSession('autosave');
      const {savedAt,...content}=session;
      const hash=sessionHash(JSON.stringify(content));
      if(hash===lastSavedHashRef.current)return;
      const result=await window.SessionStoreCore.saveSession(session);
      if(result.ok){
        lastSavedHashRef.current=hash;
        setSessionStatus(prev=>({
          ...prev,
          backend:window.SessionStoreCore.backend(),
          savedAt:new Date().toISOString(),
          error:null,
          autosaveError:null,
        }));
        refreshStorageUsage();
      }else{
        const message=sessionSaveMessage(result);
        setSessionStatus(prev=>({...prev,backend:prev.backend||window.SessionStoreCore.backend(),error:message,autosaveError:message}));
        const reason=result.reason||'storage-error';
        if(!autosaveNoticeRef.current.has(reason)){
          autosaveNoticeRef.current.add(reason);
          notify(`자동 저장 실패: ${message}`,'warn',{duration:8000});
        }
      }
    },5000);
    return()=>clearTimeout(timer);
  },[files,activeFile,buildSession,refreshStorageUsage,notify]);

  useEffect(()=>{
    const handler=e=>{
      const tag=(e.target?.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select'||e.target?.isContentEditable)return;
      const key=(e.key||'').toLowerCase();
      if((e.ctrlKey||e.metaKey)&&key==='b'){e.preventDefault();if(e.shiftKey)setShowRight(v=>!v);else setShowLeft(v=>!v);}
      if((e.ctrlKey||e.metaKey)&&key==='z'&&!e.shiftKey){e.preventDefault();undo();}
      if((e.ctrlKey||e.metaKey)&&(key==='y'||(key==='z'&&e.shiftKey))){e.preventDefault();redo();}
    };
    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);
  },[undo,redo]);

  const addFiles=useCallback(async(fileList)=>{
    if(uploadingRef.current){setUploadLog(l=>[...l,{m:'파일을 읽는 중입니다. 완료 후 다시 추가하세요.',t:'warn'}]);return;}
    uploadingRef.current=true;
    const incoming=Array.from(fileList||[]),newFiles=[],lines=[];
    const used=new Set(files.map(file=>file.name));
    setUploadLog([]);
    try{
      for(let i=0;i<incoming.length;i++){
        const file=incoming[i];
        showProgress(`파일 읽는 중... (${i+1}/${incoming.length})`);
        await new Promise(resolve=>setTimeout(resolve,0));
        try{
          if(files.length+newFiles.length>=MAX_FILES){lines.push({m:'파일은 최대 30개까지 열 수 있습니다.',t:'warn'});break;}
          if(file.size>MAX_FILE_BYTES)throw new Error('20MB를 넘는 파일은 열 수 없습니다.');
          const ext=file.name.split('.').pop().toLowerCase();
          if(!['mxl','xml','musicxml'].includes(ext))throw new Error(ext==='pdf'?'PDF는 직접 불러올 수 없습니다. MusicXML로 내보낸 뒤 업로드하세요.':'지원하지 않는 파일 형식입니다. MusicXML 파일을 업로드하세요.');
          let xmlString;
          if(ext==='mxl'){
            if(!window.JSZip)throw new Error('MXL 압축 라이브러리를 불러오지 못했습니다.');
            const zip=await JSZip.loadAsync(file);let xmlFile=null;
            const container=zip.file('META-INF/container.xml');
            if(container){
              const containerDoc=new DOMParser().parseFromString(await container.async('string'),'text/xml');
              const rootfiles=containerDoc.querySelectorAll('rootfile');
              if(rootfiles.length>1)lines.push({m:`rootfile ${rootfiles.length}개 중 첫 번째를 열었습니다.`,t:'info'});
              if(rootfiles[0])xmlFile=zip.file(rootfiles[0].getAttribute('full-path'));
            }
            if(!xmlFile)zip.forEach((name,entry)=>{if(!xmlFile&&!entry.dir&&/\.(xml|musicxml)$/i.test(name)&&!name.startsWith('META-INF/'))xmlFile=entry;});
            if(!xmlFile)throw new Error('압축 파일에서 MusicXML 악보를 찾지 못했습니다.');
            if(xmlFile._data?.uncompressedSize>MAX_FILE_BYTES)throw new Error('압축 해제한 악보가 20MB를 넘습니다.');
            xmlString=await xmlFile.async('string');
          }else xmlString=await file.text();
          if(new TextEncoder().encode(xmlString).length>MAX_FILE_BYTES)throw new Error('20MB를 넘는 악보는 열 수 없습니다.');
          const xmlDoc=new DOMParser().parseFromString(xmlString,'text/xml');
          if(xmlDoc.querySelector('parsererror'))throw new Error('XML 파싱 오류입니다. 파일을 확인하세요.');
          const reason=unsupportedScoreReason(xmlDoc);
          if(reason)throw new Error(reason);
          const name=uniqueFileName(file.name,used);
          newFiles.push(trustParsedFile({name,sourceName:file.name,xmlDoc,xmlString}));
          if(name!==file.name)lines.push({m:`중복 이름을 ${name}(으)로 변경했습니다.`,t:'info'});
        }catch(error){lines.push({m:`${file.name}: ${friendlyError(error)}`,t:'err'});}
      }
      if(newFiles.length){const merged=[...files,...newFiles];setFiles(merged);pushHistory(merged,'파일 업로드');}
      setUploadLog(lines);
    }finally{uploadingRef.current=false;hideProgress();}
  },[files,showProgress,hideProgress,pushHistory]);

  const removeFile=useCallback(i=>{
    const updated=files.filter((_,j)=>j!==i);
    setFiles(updated);
    pushHistory(updated,'파일 제거');
    setActiveFile(prev=>updated.length===0?0:i<prev?prev-1:i===prev?Math.min(i,updated.length-1):prev);
  },[activeFile,files,pushHistory]);
  const clearFiles=useCallback(()=>{
    setFiles([]);
    setActiveFile(0);
    pushHistory([],'파일 모두 지우기');
  },[pushHistory]);

  const updateFiles=useCallback((newFiles,label='변환')=>{
    // 이미 commitFile을 거친 파일(대상이 아니어서 그대로 둔 파일 포함)은 같은 객체를 유지합니다.
    const committed=newFiles.map(file=>committedFiles.has(file)?file:commitFile(file,file.xmlDoc));
    setFiles(committed);
    pushHistory(committed,label);
  },[pushHistory]);
  const panelProps={files,activeFile,scope,onSelectActiveFile:setActiveFile,showProgress,hideProgress,onFilesUpdate:updateFiles};

  // 테스트 훅: window.__mxlGetState / __mxlSetActiveFile은 E2E가 앱 상태를 읽고 바꾸는 창구입니다.
  // window.__mxlRenderCount는 ScoreView의 OSMD 인스턴스가 render()를 부를 때마다 1씩 늘어나는 숫자입니다(trackScoreRender, OSMD 내부 호출 포함).
  // 27-phase-b-regressions가 "불러오기 1회·확대 1회·폭 변경 1회에 렌더 1번"을 이 값의 증가분으로 확인하며, 화면 동작에는 쓰지 않습니다.
  useEffect(()=>{
    window.__mxlSetActiveFile=index=>setActiveFile(Math.max(0,Math.min(index,files.length-1)));
    window.__mxlGetState=()=>({
      files,
      activeFile,
      history,
      historyIndex,
      restoreSession,
      sessionStatus,
      shareModal,
      leftPanel,
      rightPanel,
      bpm,
      scope,
    });
    return()=>{delete window.__mxlGetState;delete window.__mxlSetActiveFile};
  },[files,activeFile,history,historyIndex,restoreSession,sessionStatus,shareModal,leftPanel,rightPanel,bpm,scope]);

  // Ossia는 별도 문서(ossiaMxml)라 MusicXML에 들어가지 않습니다. 내보내기 전에 알립니다(결정 D7).
  const warnOssiaNotExported=useCallback(file=>{
    if(file?.ossiaMxml)notify(`${file.ossiaMeta?.label||'Ossia'}은(는) MusicXML에 포함되지 않습니다. 세션·공유·PNG/SVG에는 포함됩니다.`,'warn');
  },[notify]);

  const exportXML=useCallback(()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    const file=files[activeFile]||files[0];
    warnOssiaNotExported(file);
    const xmlStr=serializeScore(file.xmlDoc);
    const blob=new Blob([xmlStr],{type:'text/xml'});
    downloadBlob(blob,file.name.replace(/\.(mxl|xml|musicxml)$/i,'')+'.xml');
  },[files,activeFile,warnOssiaNotExported]);

  const exportMXL=useCallback(async()=>{
    if(!files.length)return;
    try{
      const file=files[activeFile]||files[0];
      const blob=await buildMxlBlob(file);
      if(blob){warnOssiaNotExported(file);downloadBlob(blob,file.name.replace(/\.(mxl|xml|musicxml)$/i,'')+'.mxl');}
      else{exportXML();setHistoryNotice({m:'JSZip을 불러오지 못해 비압축 XML로 저장했습니다.',t:'warn'});}
    }catch(error){setHistoryNotice({m:'MXL 내보내기 실패: '+friendlyError(error),t:'err'});}
  },[files,activeFile,exportXML,warnOssiaNotExported]);

  const exportPNG=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    const file=files[activeFile]||files[0];
    showProgress('PNG 생성 중...');
    await new Promise(resolve=>setTimeout(resolve,50));
    let rendered=null;
    try{
      // 뷰어 화면(확대율·창 폭)을 쓰지 않고 이미지 패널과 같은 화면 밖 고정 폭 렌더를 씁니다. 크기는 폭 1100px × 배율 2로 늘 같습니다.
      // Ossia가 있으면 본보 위에 함께 넣습니다.
      rendered=await renderForExport(file,{width:window.ExportCore.DEFAULT_EXPORT_WIDTH});
      if(!rendered?.main){notify('악보를 렌더링하지 못했습니다.','warn');return}
      const {blob}=await svgMarkupToPngBlob(stackSvgMarkup([rendered.ossia,rendered.main]),{scale:2,bgWhite:true});
      const fn=file.name.replace(/\.(mxl|xml|musicxml)$/i,'');
      downloadBlob(blob,fn+'.png');
    }catch(e){notify(friendlyError(e),'err');}
    finally{rendered?.dispose();hideProgress();}
  },[files,activeFile,showProgress,hideProgress]);

  // 헤더·메뉴의 PDF: 현재 파일을 A4 세로로 인쇄합니다. 용지를 고르려면 이미지 / PDF 패널을 씁니다.
  const exportPDF=useCallback(async()=>{
    const file=files[activeFile];
    if(!file){notify('먼저 파일을 업로드하세요.','warn');return;}
    showProgress('인쇄 준비 중...');
    await new Promise(resolve=>setTimeout(resolve,50));
    try{await printScore(file,'A4_P',{beforePrint:hideProgress});}
    catch(e){notify(friendlyError(e),'err');}
    finally{hideProgress();}
  },[files,activeFile,notify,showProgress,hideProgress]);
  // 사용자가 Ctrl+P로 직접 인쇄하면 뷰어 화면 대신 안내 한 줄(.print-hint)만 인쇄되므로, 내보내기 버튼을 쓰라고 알립니다.
  useEffect(()=>{
    const warnDirectPrint=()=>{if(!document.querySelector('.print-root'))notify('인쇄는 내보내기의 PDF 버튼을 사용하세요.','info');};
    window.addEventListener('beforeprint',warnDirectPrint);
    return()=>window.removeEventListener('beforeprint',warnDirectPrint);
  },[notify]);

  const selectLeftPanel=useCallback(id=>{setLeftPanel(id);setShowLeft(true);},[]);
  const selectRightPanel=useCallback(id=>{setRightPanel(id);setShowRight(true);},[]);

  const selectDrawerPanel=id=>{
    const side=RIGHT_PANEL_IDS.has(id)?'right':'left';
    if(side==='left'){setLeftPanel(id);setShowLeft(true);}else{setRightPanel(id);setShowRight(true);}
    setDrawer({open:true,side,view:'panel'});
  };
  const drawerHeader=<div className="drawer-panel-header"><button type="button" onClick={()=>setDrawer(value=>({...value,view:'list'}))}>← 목록</button><button type="button" onClick={closeDrawer} aria-label="도구 닫기">닫기</button></div>;
  useEffect(()=>{setMountedPanels(previous=>previous.has(leftPanel)&&previous.has(rightPanel)?previous:new Set([...previous,leftPanel,rightPanel]));},[leftPanel,rightPanel]);
  const ALL_PANELS={upload:UploadPanel,transpose:TransposePanel,keychange:KeyChangePanel,capo:CapoPanel,range:RangePanel,instrument:InstrumentPanel,tempo:TempoPanel,tempochange:TempoChangePanel,ossia:OssiaPanel,clef:ClefPanel,parts:PartsPanel,notation:NotationPanel,export:ExportPanel,color:ColorPanel,harmony:HarmonyPanel,chordtools:ChordToolsPanel,numbering:NumberingPanel,lyricstyle:LyricStylePanel,chords:ChordsPanel,roman:RomanAnalysisPanel,stats:StatsPanel};
  const panelFor=(id,Component)=><Component {...(id==='upload'?{activeFile,onSelect:setActiveFile,uploadLog,files,onFilesAdd:addFiles,onRemove:removeFile,onClear:clearFiles}:panelProps)} isActive={id===leftPanel||id===rightPanel}/>;

  const rootClass=`app-root${!showLeft?' app-root--left-closed':''}${!showRight?' app-root--right-closed':''}${isMobile&&drawer.open?' app-root--drawer-open':''}`;

  return <NotifyContext.Provider value={notify}><div className={rootClass}>
    {/* ── HEADER (메뉴바 포함) ── */}
    <header className="header">
      <div className="header__left">
        <div className="header__brand">
          <div className="header__icon">♫</div>
          <h1 className="header__title">악보 디자이너</h1>
        </div>
      </div>
      <PanelErrorBoundary label="메뉴"><MenuBar
        onSelectLeft={selectLeftPanel}
        onSelectRight={selectRightPanel}
        onSession={saveSessionSlot}
        onExportMXL={exportMXL}
        onExportXML={exportXML}
        onExportPNG={exportPNG}
        onExportPDF={exportPDF}
        files={files}
      /></PanelErrorBoundary>
      <div className="header__right">
        <button type="button" className="mobile-tools header__export-btn" aria-haspopup="dialog" onClick={()=>setDrawer({open:true,side:'left',view:'list'})}>도구</button>
        <details className="mobile-actions"><summary aria-label="내보내기 및 세션 메뉴">⋯</summary><div className="mobile-actions__menu">
          {[['공유',openShareModal,true],['세션',saveSessionSlot,false],['MXL',exportMXL,true],['PNG',exportPNG,true],['PDF',exportPDF,true]].map(([label,action,needsFiles])=><button type="button" key={label} disabled={needsFiles&&!files.length} onClick={event=>{event.currentTarget.closest('details').open=false;action();}}>{label}</button>)}
        </div></details>
        <button className={`header__toggle${showLeft?' header__toggle--active':''}`}
          aria-label="인스펙터 패널 토글" aria-pressed={showLeft} onClick={()=>setShowLeft(!showLeft)} title="인스펙터 토글">☰</button>
        <div className="header__badge">파일 {files.length}개{files.length>0?` · 현재: ${files[activeFile]?.name}`:''}</div>
        {sessionStatus.backend&&<div className="session-status" title={sessionStatus.error?`세션 오류: ${sessionStatus.error}`:'세션 저장 상태'}>
          저장소: {sessionStatus.usage!=null&&sessionStatus.quota!=null?`${formatBytes(sessionStatus.usage)}/${formatBytes(sessionStatus.quota)}`:'확인 중'} ({sessionStatus.backend==='idb'?'IndexedDB':'Local'})
        </div>}
        <button type="button" className={`header__toggle${showRight?' header__toggle--active':''}`} aria-label="도구 패널 토글" aria-pressed={showRight} onClick={()=>setShowRight(value=>!value)}>우측</button>
        <div className="header__export-group">
          <button className="header__export-btn" onClick={openShareModal} disabled={!files.length} title="압축 공유 링크 생성">공유</button>
          <button className="header__export-btn" onClick={saveSessionSlot} title="세션 관리">세션</button>
          <button className="header__export-btn" onClick={exportMXL} disabled={!files.length} title="MXL 내보내기">MXL</button>
          <button className="header__export-btn" onClick={exportPNG} disabled={!files.length} title="PNG 내보내기">PNG</button>
          <button className="header__export-btn" onClick={exportPDF} disabled={!files.length} title="인쇄 / PDF로 저장">PDF</button>
        </div>
      </div>
    </header>

    {restoreSession&&<div className="session-restore-banner">
      <div>
        <strong>이전 세션이 있습니다</strong>
        <span>{restoreSession.files?.length||0}개 파일 · {restoreSession.savedAt?new Date(restoreSession.savedAt).toLocaleString('ko-KR'):''}</span>
      </div>
      <button className="session-restore-banner__btn session-restore-banner__btn--primary" onClick={restoreSavedSession}>복원하기</button>
      <button className="session-restore-banner__btn" onClick={()=>setRestoreSession(null)}>닫기</button>
    </div>}

    {isMobile&&drawer.open&&<>
      <div className="drawer-backdrop" onClick={closeDrawer}/>
      {drawer.view==='list'&&<section className="mobile-drawer-menu" ref={drawerRef} role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabIndex={-1}>
        <div className="drawer-menu-header"><h2 id="drawer-title">악보 도구</h2><button type="button" onClick={closeDrawer} aria-label="도구 닫기">닫기</button></div>
        {NAV.map(group=><section key={group.section}><h3>{group.section}</h3><div className="drawer-tool-grid">{group.items.map(item=><button type="button" key={item.id} onClick={()=>selectDrawerPanel(item.id)}><ActivityIcon icon={item.icon}/>{item.label}</button>)}</div></section>)}
      </section>}
    </>}

    <SessionModal open={sessionModalOpen} onClose={closeSessions} files={files} activeFile={activeFile} onRestore={restoreManagedSession} notify={notify} sessionStatus={sessionStatus} onStorageChange={refreshStorageUsage}/>

    {shareModal&&<div className="share-modal-backdrop" role="presentation" onClick={()=>setShareModal(null)}>
      <section ref={shareDialogRef} tabIndex={-1} className="share-modal" role="dialog" aria-modal="true" aria-label="공유 링크" onClick={e=>e.stopPropagation()}>
        <div className="share-modal__header">
          <h2>공유 링크</h2>
          <button className="share-modal__close" onClick={()=>setShareModal(null)} aria-label="닫기">×</button>
        </div>
        <input className="share-modal__url" aria-label="공유 링크 주소" value={shareModal.url} readOnly onFocus={e=>e.target.select()}/>
        <div className="share-modal__stats">
          원본 {formatBytes(shareModal.originalBytes)} → 압축 {formatBytes(shareModal.compressedBytes)} ({shareModal.ratio}% 절감)
        </div>
        {shareModal.tooLarge&&<div className="share-modal__warning">링크가 너무 큽니다. 파일을 줄인 뒤 다시 시도하세요.</div>}
        {!shareModal.tooLarge&&shareModal.warn&&<div className="share-modal__warning">링크가 큽니다. 일부 메신저에서는 잘릴 수 있습니다.</div>}
        <div className="share-modal__actions">
          <button className="btn btn--primary" onClick={copyShareURL}>{shareModal.copied?'복사됨':'링크 복사'}</button>
          <button className="btn btn--secondary" onClick={()=>setShareModal(null)}>닫기</button>
        </div>
      </section>
    </div>}

    {/* ── LEFT ACTIVITY BAR (icon strip) ── */}
    <nav className="activity-bar">
      {LEFT_ACTIVITY_ITEMS.map(item=>
        item.sep
          ? <div className="activity-bar__sep" key={item.id}/>
          : <button key={item.id}
              className={`activity-bar__btn${leftPanel===item.id?' activity-bar__btn--active':''}`}
              onClick={()=>{if(leftPanel===item.id)setShowLeft(value=>!value);else{setLeftPanel(item.id);setShowLeft(true);}}}
              aria-label={PANEL_LABELS[item.id]||item.id} aria-pressed={RIGHT_PANEL_IDS.has(item.id)?showRight&&rightPanel===item.id:showLeft&&leftPanel===item.id} title={PANEL_LABELS[item.id]||item.id}>
              <ActivityIcon icon={item.icon}/>
            </button>
      )}
    </nav>

    {/* ── RIGHT ACTIVITY BAR (icon strip) ── */}
    <nav className="right-activity-bar">
      {RIGHT_ACTIVITY_ITEMS.map(item=>
        item.sep
          ? <div className="activity-bar__sep" key={item.id}/>
          : <button key={item.id}
              className={`activity-bar__btn${rightPanel===item.id?' activity-bar__btn--active':''}`}
              onClick={()=>{if(rightPanel===item.id)setShowRight(value=>!value);else{setRightPanel(item.id);setShowRight(true);}}}
              aria-label={PANEL_LABELS[item.id]||item.id} aria-pressed={RIGHT_PANEL_IDS.has(item.id)?showRight&&rightPanel===item.id:showLeft&&leftPanel===item.id} title={PANEL_LABELS[item.id]||item.id}>
              <ActivityIcon icon={item.icon}/>
            </button>
      )}
    </nav>

    {/* ── INSPECTOR (left panel) ── */}
    <aside className="inspector" data-drawer-active={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='left'} ref={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='left'?drawerRef:undefined} role={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='left'?'dialog':undefined} aria-modal={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='left'?'true':undefined} aria-label="인스펙터 도구" tabIndex={-1}>
      {drawerHeader}
      <ResizeHandle side="left"/>
      <div className="inspector__header">
        <div className="inspector__title">🛠 인스펙터 — {PANEL_LABELS[leftPanel]||leftPanel}</div>
        <ScopeToggle scope={scope} onChange={setScope} files={files} activeFile={activeFile} label="인스펙터 적용 대상"/>
      </div>
      <div className="inspector__content">
        {Object.entries(ALL_PANELS).filter(([id])=>!RIGHT_PANEL_IDS.has(id)&&mountedPanels.has(id)).map(([id,comp])=>
          <div key={id} className={`panel${leftPanel===id?' panel--visible':''}`}><PanelErrorBoundary label={PANEL_LABELS[id]}>{panelFor(id,comp)}</PanelErrorBoundary></div>
        )}
      </div>
      <HistoryPanel
        history={history}
        historyIndex={historyIndex}
        onUndo={undo}
        onRedo={redo}
        onJump={jumpHistory}
        onClear={clearHistory}
        canClear={canClearHistory}
        notice={historyNotice}
      />
    </aside>

    {/* ── MAIN SCORE VIEW (center) ── */}
    <PanelErrorBoundary label="악보"><ScoreView
      files={files}
      activeFile={activeFile}
      onSelect={setActiveFile}
      onClose={removeFile}
      onOsmdReady={handleOsmdReady}
      playbackMeasure={playback.currentMeasure}
      isPlaying={playback.isPlaying}
      showProgress={showProgress}
      hideProgress={hideProgress}
    /></PanelErrorBoundary>

    {/* ── RIGHT PANEL (mirrors inspector for right activity bar) ── */}
    <aside className="analysis" data-drawer-active={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='right'} ref={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='right'?drawerRef:undefined} role={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='right'?'dialog':undefined} aria-modal={isMobile&&drawer.open&&drawer.view==='panel'&&drawer.side==='right'?'true':undefined} aria-label="분석 도구" tabIndex={-1}>
      {drawerHeader}
      <ResizeHandle side="right"/>
      <div className="inspector__header">
        <div className="inspector__title">🧰 도구 — {PANEL_LABELS[rightPanel]||rightPanel}</div>
        <ScopeToggle scope={scope} onChange={setScope} files={files} activeFile={activeFile} label="도구 적용 대상"/>
      </div>
      <div className="inspector__content">
        {Object.entries(ALL_PANELS).filter(([id])=>RIGHT_PANEL_IDS.has(id)&&mountedPanels.has(id)).map(([id,comp])=>
          <div key={id} className={`panel${rightPanel===id?' panel--visible':''}`}><PanelErrorBoundary label={PANEL_LABELS[id]}>{panelFor(id,comp)}</PanelErrorBoundary></div>
        )}
      </div>
    </aside>

    {/* ── TRANSPORT BAR (bottom) ── */}
    <PanelErrorBoundary label="재생"><TransportBar
      files={files}
      activeFile={activeFile}
      bpm={bpm}
      onBpmChange={setBpm}
      onPlaybackUpdate={handlePlaybackUpdate}
      osmdRef={osmdRef}
    /></PanelErrorBoundary>

    {/* ── PROGRESS OVERLAY ── */}
    <div className={`progress-overlay${progress.visible?'':' progress-overlay--hidden'}`}>
      <div className="progress-box">
        <div className="progress-spinner"/>
        <div className="progress-message">{progress.msg}</div>
      </div>
    </div>
    <div className="toast-stack" role="status" aria-live="polite" aria-atomic="false">
      {toasts.map(toast=><div className={`toast toast--${toast.type}`} key={toast.id} role={toast.type==='err'?'alert':'status'} aria-live={toast.type==='err'?'assertive':'polite'}>
        <span>{toast.message}</span><button type="button" onClick={()=>dismissToast(toast.id)} aria-label="알림 닫기">×</button>
      </div>)}
    </div>
  </div></NotifyContext.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<PanelErrorBoundary label="앱"><App/></PanelErrorBoundary>);
</script>
</body>
</html>
