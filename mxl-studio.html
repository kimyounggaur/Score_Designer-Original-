        <BarChart data={composerData.intervals} barColor="var(--green)" labelWidth={80}/></div>
      <div className="card"><div className="card__title">🎹 코드 진행 Top 10</div>
        <BarChart data={composerData.progressions} barColor="var(--amber)" labelWidth={140}/></div>
      <div className="card"><div className="card__title">📏 프레이즈 길이</div>
        <BarChart data={composerData.phraseBuckets} labelWidth={48}/></div>
    </div>}
  </div>;
}

/* ==============================================================
   PANEL: CLEF
   ============================================================== */
const CLEF_SYMBOLS={treble:'𝄞',bass:'𝄢',alto:'𝄡',tenor:'𝄡',neutral:'𝄥'};

function applyClefConfig(doc,clef,cfg){
  let sign=xmlChild(clef,'sign');
  if(!sign){sign=doc.createElement('sign');clef.insertBefore(sign,clef.firstChild);}
  sign.textContent=cfg.sign;
  let line=xmlChild(clef,'line');
  if(cfg.sign==='percussion')line?.remove();
  else{
    if(!line){line=doc.createElement('line');clef.insertBefore(line,sign.nextSibling);}
    line.textContent=String(cfg.line);
  }
  // 옥타브 음자리표 표기(8vb 등)는 이전 음자리표에 묶인 정보이므로 제거합니다.
  xmlChild(clef,'clef-octave-change')?.remove();
}

function ClefPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [targetClef,setTargetClef]=useState('treble');
  const [autoTranspose,setAutoTranspose]=useState(true);
  const [targetPart,setTargetPart]=useState('all');
  const [targetStaff,setTargetStaff]=useState('all');
  const [log,setLog]=useState([]);

  const currentClef=useMemo(()=>{
    if(!files.length)return null;
    return getCurrentClef(activeDoc(files,activeFile));
  },[files,activeFile]);
  const partInfo=useMemo(()=>getPartInfo(activeDoc(files,activeFile)),[files,activeFile]);
  const staffCount=useMemo(()=>{
    if(targetPart==='all')return 1;
    const part=Array.from(activeDoc(files,activeFile)?.querySelectorAll('score-partwise > part')||[]).find(element=>element.getAttribute('id')===targetPart);
    return Math.max(1,...Array.from(part?.querySelectorAll('attributes > staves')||[],staves=>Number(staves.textContent)||1));
  },[files,activeFile,scope,targetPart]);
  useEffect(()=>{if(targetPart!=='all'&&!partInfo.some(part=>part.id===targetPart))setTargetPart('all');},[partInfo,targetPart]);
  useEffect(()=>{setTargetStaff('all');},[targetPart]);

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('음자리표 변환 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];
      const cfg=CLEF_CONFIGS.find(c=>c.id===targetClef);
      const onTargetStaff=note=>targetStaff==='all'||xmlText(note,'staff','1')===targetStaff;
      const isTargetClef=clef=>targetStaff==='all'||(clef.getAttribute('number')||'1')===targetStaff;
      const updatedFiles=targetFiles(files,activeFile,scope).map(({file})=>{
        const doc=cloneDoc(file.xmlDoc);
        const parts=Array.from(doc.querySelectorAll('score-partwise > part')).filter(part=>targetPart==='all'||part.getAttribute('id')===targetPart);
        if(!parts.length){lines.push({m:`⚠ ${file.name}: 대상 파트(${targetPart})가 없어 건너뜁니다.`,t:'warn'});return file;}
        const shifts=[];
        for(const part of parts){
          // 대상 보표 음표의 평균 높이로 옥타브 수를 정하고, 옥타브만 옮겨 철자를 보존합니다.
          const notes=Array.from(part.querySelectorAll('note')).filter(note=>PitchCore.readPitch(note)&&onTargetStaff(note));
          let octaves=0;
          if(autoTranspose&&cfg.center!==null&&notes.length){
            const average=notes.reduce((sum,note)=>sum+PitchCore.pitchToMidi(PitchCore.readPitch(note)),0)/notes.length;
            octaves=Math.round((cfg.center-average)/12);
          }
          if(octaves){notes.forEach(note=>PitchCore.shiftNoteOctave(note,octaves));shifts.push(`${part.getAttribute('id')} ${octaves>0?'+':''}${octaves}옥타브`);}
          // 기존 음자리표만 바꾸고, 대상 보표에 음자리표가 하나도 없으면 첫 마디에 만듭니다.
          let changed=0;
          part.querySelectorAll('attributes').forEach(attributes=>{
            xmlChildren(attributes,'clef').filter(isTargetClef).forEach(clef=>{applyClefConfig(doc,clef,cfg);changed++;});
          });
          const firstMeasure=xmlChild(part,'measure');
          if(!changed&&firstMeasure){
            const clef=doc.createElement('clef');
            if(targetStaff!=='all')clef.setAttribute('number',targetStaff);
            applyClefConfig(doc,clef,cfg);
            MeasureCore.insertAttributesChild(MeasureCore.leadingAttributes(firstMeasure,true),clef);
          }
        }
        const shiftStr=shifts.length?` (${shifts.join(', ')})`:'';
        // 옥타브를 옮긴 경우에만 범위를 확인합니다. 음자리표만 바꾸는 변환은 음높이를 바꾸지 않습니다.
        if(shifts.length&&!guardPitchRange(file,doc,lines,{label:file.name}))return file;
        lines.push({m:`✓ ${file.name} → ${cfg.label}${shiftStr}`,t:'ok'});
        return commitFile(file,doc);
      });
      commitIfChanged(onFilesUpdate,files,mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('음자리표 변환',files,scope),lines);
      setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,targetClef,autoTranspose,targetPart,targetStaff,showProgress,hideProgress,onFilesUpdate]);

  const currentCfg=CLEF_CONFIGS.find(c=>c.id===currentClef);

  return <div>
    <h2 className="panel__heading">음자리표 변환</h2>
    <p className="panel__description">음자리표를 변환합니다. 자동 조옮김 옵션을 켜면 새 음자리표의 음역대에 맞게 옥타브 단위로 자동 이동합니다.</p>

    {currentClef&&<div className="card">
      <div className="card__title">현재 음자리표</div>
      <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'6px 0'}}>
        <span style={{fontSize:'32px',fontFamily:"'Bravura','FreeSerif','Times New Roman',serif",lineHeight:1}}>{CLEF_SYMBOLS[currentClef]}</span>
        <div>
          <div style={{fontWeight:600,fontSize:'13px'}}>{currentCfg?.label}</div>
          <div style={{fontSize:'11px',color:'var(--text-muted)'}}>{currentCfg?.sub}</div>
        </div>
      </div>
    </div>}

    <div className="card">
      <div className="card__title">🎼 목표 음자리표</div>
      <div className="clef-grid">
        {CLEF_CONFIGS.map(cfg=>(
          <button type="button" key={cfg.id}
            className={`clef-btn${targetClef===cfg.id?' clef-btn--selected':''}`}
            aria-pressed={targetClef===cfg.id} onClick={()=>setTargetClef(cfg.id)}>
            <div className="clef-btn__symbol" aria-hidden="true">{CLEF_SYMBOLS[cfg.id]}</div>
            <div className="clef-btn__label">{cfg.label}</div>
            <div className="clef-btn__sub">{cfg.sub}</div>
          </button>
        ))}
      </div>
    </div>

    {partInfo.length>0&&<div className="card">
      <div className="card__title">🎯 대상 파트</div>
      <select className="form-select" aria-label="음자리표를 바꿀 파트" value={targetPart} onChange={e=>setTargetPart(e.target.value)}>
        <option value="all">모든 파트</option>
        {partInfo.map(part=><option key={part.id} value={part.id}>{part.label} ({part.id})</option>)}
      </select>
      {staffCount>1&&<>
        <label className="form-label">보표</label>
        <div className="chip-group">
          <Chip on={targetStaff==='all'} onClick={()=>setTargetStaff('all')}>전체 보표</Chip>
          {Array.from({length:staffCount},(_,i)=>String(i+1)).map(number=><Chip key={number} on={targetStaff===number} onClick={()=>setTargetStaff(number)}>{number}번 보표</Chip>)}
        </div>
      </>}
    </div>}

    <div className="card">
      <div className="toggle-row">
        <div className="card__title">🔀 음역대 자동 조옮김</div>
        <Toggle label="음자리표에 맞게 옥타브 자동 이동" on={autoTranspose} onClick={()=>setAutoTranspose(v=>!v)}/>
      </div>
      {autoTranspose&&targetClef!=='neutral'&&(
        <div className="card__text">대상 파트·보표의 음표를 새 음자리표 중심 음역대로 옥타브 단위 이동합니다. 음이름과 임시표는 그대로 둡니다.</div>
      )}
    </div>

/* ==============================================================
   SCORE VIEW — center panel always-visible score renderer
   ============================================================== */
function applyLyricStylesToSvg(container,xmlDoc){
  const svg=container.querySelector('svg');if(!svg)return;
  const specs=[];
  xmlDoc.querySelectorAll('lyric text').forEach(t=>{
    const fs=t.getAttribute('font-size'),fw=t.getAttribute('font-weight'),
      fst=t.getAttribute('font-style'),ff=t.getAttribute('font-family'),col=t.getAttribute('color');
    if(!fs&&!fw&&!fst&&!ff&&!col)return;
    specs.push({text:(t.textContent||'').trim(),fs,fw,fst,ff,col});
  });
  if(!specs.length)return;
  const byText=new Map();
  specs.forEach(s=>{const k=s.text;if(!k)return;if(!byText.has(k))byText.set(k,[]);byText.get(k).push(s)});
  const used=new Map();
  Array.from(svg.querySelectorAll('text')).forEach(el=>{
    const key=(el.textContent||'').trim();if(!key||!byText.has(key))return;
    const list=byText.get(key);const i=used.get(key)||0;if(i>=list.length)return;
    const spec=list[i];used.set(key,i+1);
    if(spec.fs)el.setAttribute('font-size',spec.fs);
    if(spec.fw)el.setAttribute('font-weight',spec.fw);
    if(spec.fst)el.setAttribute('font-style',spec.fst);
    if(spec.ff)el.setAttribute('font-family',spec.ff);
    if(spec.col){el.setAttribute('fill',spec.col);el.setAttribute('stroke',spec.col)}
  });
}

function ResizeHandle({side}){
  const dragRef=useRef(null);
  const [width,setWidth]=useState(300);
  const cssName=side==='left'?'--inspector-w':'--analysis-w';
  const saveWidth=next=>{
    next=Math.max(220,Math.min(520,next));setWidth(next);
    document.documentElement.style.setProperty(cssName,`${next}px`);
    try{const layout=JSON.parse(localStorage.getItem('mxlStudio.layout')||'{}');layout[side]=next;localStorage.setItem('mxlStudio.layout',JSON.stringify(layout));}catch(_){}
  };
  return <div className={`resize-handle resize-handle--${side}`} role="separator" aria-label={side==='left'?'인스펙터 너비':'도구 패널 너비'} aria-orientation="vertical" aria-valuemin="220" aria-valuemax="520" aria-valuenow={width} tabIndex={0}
    onPointerDown={event=>{event.currentTarget.setPointerCapture(event.pointerId);dragRef.current={x:event.clientX,width:parseFloat(getComputedStyle(document.documentElement).getPropertyValue(cssName))||300};}}
    onPointerMove={event=>{if(dragRef.current)saveWidth(dragRef.current.width+(event.clientX-dragRef.current.x)*(side==='left'?1:-1));}}
    onPointerUp={event=>{dragRef.current=null;if(event.currentTarget.hasPointerCapture(event.pointerId))event.currentTarget.releasePointerCapture(event.pointerId);}}
    onPointerCancel={()=>{dragRef.current=null;}}
    onKeyDown={event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const current=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(cssName))||300;saveWidth(current+(event.key==='ArrowRight'?10:-10)*(side==='left'?1:-1));}}}/>;
}

function FileTabs({files,activeFile,onSelect,onClose}){
  const tabsRef=useRef(null);
  useEffect(()=>{tabsRef.current?.querySelector('[aria-selected="true"]')?.scrollIntoView({inline:'nearest',block:'nearest'});},[activeFile,files.length]);
  if(files.length<2)return null;
  const move=(event,index)=>{
    let next;
    if(event.key==='ArrowRight')next=(index+1)%files.length;
    if(event.key==='ArrowLeft')next=(index-1+files.length)%files.length;
    if(event.key==='Home')next=0;
    if(event.key==='End')next=files.length-1;
    if(event.key==='Delete'){event.preventDefault();onClose(index);return;}
    if(next!==undefined){event.preventDefault();onSelect(next);tabsRef.current.querySelectorAll('[role="tab"]')[next]?.focus();}
  };
  return <div className="file-tabs" role="tablist" aria-label="열린 악보" ref={tabsRef}>
    {files.map((file,index)=><div className="file-tab-wrap" role="presentation" key={file.name}>
      <button type="button" id={`file-tab-${index}`} role="tab" aria-selected={activeFile===index} aria-controls="score-panel" tabIndex={activeFile===index?0:-1}
        className={`file-tab${activeFile===index?' file-tab--active':''}`} onClick={()=>onSelect(index)} onKeyDown={event=>move(event,index)}>{file.name.replace(/\.(musicxml|xml|mxl)$/i,'')}</button>
      <button type="button" className="file-tab__close" onClick={()=>onClose(index)} aria-label={`파일 닫기: ${file.name}`}>×</button>
    </div>)}

}

// ScoreView가 만드는 OSMD 인스턴스의 render()를 감쌉니다. window.__mxlRenderCount는 E2E 테스트 훅으로,
// "불러오기 1회·확대 1회·폭 변경 1회에 렌더 1번"(성능 규칙 N-1)을 27-phase-b-regressions가 확인합니다. 화면 동작에는 쓰지 않습니다.
// ScoreView 코드가 부르는 render()뿐 아니라 OSMD가 autoResize로 안에서 스스로 부르는 render()도 세어야 이중 렌더를 잡을 수 있어
// 호출하는 곳마다 숫자를 올리지 않고 인스턴스에서 한 번에 감쌉니다.
function trackScoreRender(osmd){
  const render=osmd.render;
  osmd.render=function(...args){window.__mxlRenderCount=(window.__mxlRenderCount||0)+1;return render.apply(this,args);};
  return osmd;
}
const LONG_SCORE_NOTES=2000;       // 음표가 이 수 이상이면 렌더 한 번이 수백 ms~수 초라 진행 표시를 먼저 그립니다(성능 규칙 N-2).
const SCORE_RESIZE_THRESHOLD=4;    // px. 악보 영역 폭이 이보다 덜 바뀌면 다시 그리지 않습니다.
const SCORE_RESIZE_DEBOUNCE=250;   // ms. 창 크기·패널 폭을 끄는 동안에는 기다렸다가 마지막에 한 번만 그립니다.
const scoreNoteCount=file=>file?.xmlDoc?.getElementsByTagName('note').length||0;
// 진행 표시가 화면에 그려진 뒤에 무거운 동기 렌더를 시작하도록 한 프레임을 양보합니다(숨겨진 탭에서는 rAF가 멈추므로 바로 넘깁니다).
const yieldFrame=()=>new Promise(resolve=>{
  if(document.hidden||typeof requestAnimationFrame!=='function'){setTimeout(resolve,0);return;}
  requestAnimationFrame(()=>setTimeout(resolve,0));
});

function ScoreView({files,activeFile,onSelect,onClose,onOsmdReady,playbackMeasure,isPlaying,showProgress,hideProgress}){
  const containerRef=useRef(null);
  const ossiaRef=useRef(null);
  const scoreRenderRef=useRef(null);
  const osmdRef=useRef(null);
  const ossiaOsmdRef=useRef(null);
  const [zoom,setZoom]=useState(()=>{try{const value=Number(localStorage.getItem('mxlStudio.zoom'));return Number.isFinite(value)&&value>=.5&&value<=2?value:1;}catch(_){return 1;}});
  const zoomRef=useRef(zoom);zoomRef.current=zoom;
  const readyRef=useRef(false);
  const lastWidthRef=useRef(0);        // 마지막 렌더 직후의 악보 영역 폭(px). 폭 감시가 "정말 바뀌었는지" 비교하는 기준입니다.
  const redrawSeqRef=useRef(0);        // 세대 번호. 새 다시 그리기 요청이 오면 이전 요청은 그리지 않고 물러납니다.
  const redrawRef=useRef(null);        // 가장 최근의 redraw. 타이머·옵저버가 오래된 클로저를 쓰지 않게 합니다.
  const playingRef=useRef(isPlaying);playingRef.current=isPlaying;
  const widthPendingRef=useRef(false); // 재생 중에 미뤄 둔 폭 변경 재렌더(정지하면 한 번 실행)
  const progressDepthRef=useRef(0);    // 진행 표시를 켠 요청 수. 마지막 요청이 끝날 때 한 번만 끕니다.
  const [rendered,setRendered]=useState(false);
  const [renderError,setRenderError]=useState(null);
  const [ossiaError,setOssiaError]=useState(null);
  const [renderAttempt,setRenderAttempt]=useState(0);
  const changeZoom=useCallback(value=>setZoom(Math.round(Math.max(.5,Math.min(2,value))*10)/10),[]);
  const startProgress=useCallback(()=>{progressDepthRef.current+=1;showProgress?.('악보를 그리는 중...');},[showProgress]);
  const stopProgress=useCallback(()=>{progressDepthRef.current=Math.max(0,progressDepthRef.current-1);if(!progressDepthRef.current)hideProgress?.();},[hideProgress]);
  // 확대·폭 변경이 지나는 유일한 다시 그리기 경로입니다. 렌더 한 번에 render()를 한 번만 부르고,
  // 빠르게 여러 번 불리면 세대 번호가 맞는 마지막 요청만 그립니다. 오류는 모두 setRenderError로 가므로 Promise는 거부되지 않습니다.
  const redraw=useCallback(async value=>{
    if(!readyRef.current||!osmdRef.current)return;
    const osmd=osmdRef.current;
    const seq=++redrawSeqRef.current;
    const long=scoreNoteCount(files[activeFile]||files[0])>=LONG_SCORE_NOTES;
    if(long)startProgress();
    try{
      if(long)await yieldFrame();
      if(seq!==redrawSeqRef.current||osmd!==osmdRef.current||!readyRef.current)return; // 더 새 요청이나 다른 파일이 이 요청을 대신했습니다.
      onOsmdReady?.(null);
      osmd.zoom=value;
      osmd.render();
      lastWidthRef.current=scoreRenderRef.current?.clientWidth||0;
      onOsmdReady?.(osmd);
      applyLyricStylesToSvg(scoreRenderRef.current,activeDoc(files,activeFile));
    }catch(error){setRenderError(friendlyError(error));}
    finally{if(long)stopProgress();}
  },[files,activeFile,onOsmdReady,startProgress,stopProgress]);
  redrawRef.current=redraw;
  const requestRedraw=useCallback(value=>{
    const task=redrawRef.current?.(value);
    task?.catch(error=>setRenderError(friendlyError(error)));
  },[]);
  const widthChanged=useCallback(()=>{
    const element=scoreRenderRef.current;
    return !!element&&element.clientWidth>0&&Math.abs(element.clientWidth-lastWidthRef.current)>=SCORE_RESIZE_THRESHOLD;
  },[]);
  const fitZoom=useCallback(()=>{
    const svg=scoreRenderRef.current?.querySelector('svg');
    if(!svg||!containerRef.current)return;
    const width=parseFloat(svg.getAttribute('width'))||svg.getBoundingClientRect().width;
    if(width>0)changeZoom(zoomRef.current*(containerRef.current.clientWidth-40)*.95/width);
  },[changeZoom]);
  useEffect(()=>{try{localStorage.setItem('mxlStudio.zoom',String(zoom));}catch(_){}requestRedraw(zoom);},[zoom]);
  useEffect(()=>{
    const keydown=event=>{
      if(!(event.ctrlKey||event.metaKey)||/^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName)||event.target?.isContentEditable)return;
      if(['=','+','-','0'].includes(event.key)){event.preventDefault();changeZoom(event.key==='0'?1:zoomRef.current+(event.key==='-'?-.1:.1));}
    };
    window.addEventListener('keydown',keydown);
    return()=>window.removeEventListener('keydown',keydown);
  },[changeZoom]);
  // 폭 감시. OSMD 자체 autoResize는 첫 렌더 직후 한 번 더 그려 불러오기가 두 배로 걸리므로 끄고(P1),
  // 악보 영역의 폭이 실제로 4px 이상 바뀌었을 때만 250ms 디바운스 뒤 한 번 다시 그립니다(창 크기·패널 여닫기).
  const hasFiles=files.length>0;
  useEffect(()=>{
    const element=scoreRenderRef.current;
    if(!hasFiles||!element)return;
    let timer=0;
    const settle=()=>{
      timer=0;
      if(!readyRef.current||!widthChanged())return;           // 첫 렌더가 진행 중이면 그 렌더가 최신 폭을 씁니다.
      if(playingRef.current){widthPendingRef.current=true;return;} // 재생 중에는 커서가 사라지지 않게 정지 뒤로 미룹니다.
      requestRedraw(zoomRef.current);
    };
    const onResize=()=>{
      if(!widthChanged())return;
      clearTimeout(timer);timer=setTimeout(settle,SCORE_RESIZE_DEBOUNCE);
    };
    let observer=null;
    if(typeof ResizeObserver==='function'){observer=new ResizeObserver(onResize);observer.observe(element);}
    else window.addEventListener('resize',onResize);
    return()=>{observer?.disconnect();window.removeEventListener('resize',onResize);clearTimeout(timer);};
  },[hasFiles,requestRedraw,widthChanged]);
  useEffect(()=>{
    if(isPlaying||!widthPendingRef.current)return;
    widthPendingRef.current=false;
    if(readyRef.current&&widthChanged())requestRedraw(zoomRef.current);
  },[isPlaying,requestRedraw,widthChanged]);
  useEffect(()=>()=>{if(progressDepthRef.current>0){progressDepthRef.current=0;hideProgress?.();}},[]);

  useEffect(()=>{
    if(!files.length||!containerRef.current||!scoreRenderRef.current){setRendered(false);if(onOsmdReady)onOsmdReady(null);return}
    const file=files[activeFile]||files[0];
    setRenderError(null);setOssiaError(null);setRendered(false);
    let cancelled=false;readyRef.current=false;
    if(onOsmdReady)onOsmdReady(null);
    const renderTimer=setTimeout(async()=>{
      const long=scoreNoteCount(file)>=LONG_SCORE_NOTES;
      if(long)startProgress();
      try{
        if(long){await yieldFrame();if(cancelled)return;}
        scoreRenderRef.current.innerHTML='';
        const osmd=trackScoreRender(new opensheetmusicdisplay.OpenSheetMusicDisplay(scoreRenderRef.current,{
          autoResize:false,backend:'svg',drawTitle:true,drawComposer:true,
          drawPartNames:true,drawMeasureNumbers:true,
        }));
        osmdRef.current=osmd;
        await osmd.load(serializeScore(file.xmlDoc));
        if(cancelled)return;
        osmd.zoom=zoomRef.current;
        osmd.render();
        lastWidthRef.current=scoreRenderRef.current.clientWidth;
        readyRef.current=true;
        if(onOsmdReady)onOsmdReady(osmd);
        applyLyricStylesToSvg(scoreRenderRef.current,file.xmlDoc);

        // Ossia 오버레이 렌더링 (있는 경우)
        if(ossiaRef.current){
          ossiaRef.current.innerHTML='';
          if(file.ossiaMxml){
            try{
              const ossiaOsmd=trackScoreRender(new opensheetmusicdisplay.OpenSheetMusicDisplay(ossiaRef.current,{
                autoResize:false,backend:'svg',drawTitle:false,drawComposer:false,
                drawPartNames:true,drawMeasureNumbers:true,drawCredits:false,
              }));
              ossiaOsmdRef.current=ossiaOsmd;
              await ossiaOsmd.load(withXmlDeclaration(file.ossiaMxml));
              if(cancelled)return;
              ossiaOsmd.zoom=0.65;
              ossiaOsmd.render();
            }catch(oe){
              if(!cancelled)setOssiaError(friendlyError(oe));
            }
          }
        }

        setRendered(true);
      }catch(e){
        if(!cancelled)setRenderError(friendlyError(e));
      }finally{
        if(long)stopProgress();
      }
    },150);
    return()=>{clearTimeout(renderTimer);cancelled=true;readyRef.current=false};
  },[files,activeFile,renderAttempt]);

  if(!files.length)return <div className="main-score">
    <div className="score-empty">
      <div className="score-empty__staff">
        <div className="score-empty__line"/>
        <div className="score-empty__line"/>
        <div className="score-empty__line"/>
        <div className="score-empty__line"/>
        <div className="score-empty__line"/>
      </div>
      <div className="score-empty__title">메인 악보 편집 영역</div>
      <div className="score-empty__subtitle">좌측 인스펙터에서 파일을 업로드하세요</div>
    </div>
  </div>;

  return <div className="main-score">
    <FileTabs files={files} activeFile={activeFile} onSelect={onSelect} onClose={onClose}/>
    <div className={`score-measure-overlay${isPlaying?' score-measure-overlay--visible':''}`}>
      <span className="score-measure-overlay__label">Measure</span>
      <span className="score-measure-overlay__value">{playbackMeasure??0}</span>
    </div>
    {renderError&&<div className="score-error" role="alert">악보를 렌더링하지 못했습니다. {renderError}<button type="button" className="btn btn--secondary" onClick={()=>setRenderAttempt(n=>n+1)}>다시 렌더</button></div>}
    {ossiaError&&<div className="ossia-inline__error" role="alert">Ossia 렌더링 실패: {ossiaError}</div>}
    <div className="score-container" ref={containerRef} id="score-panel" role={files.length>1?'tabpanel':undefined} aria-labelledby={files.length>1?`file-tab-${activeFile}`:undefined}>
      <div className="ossia-inline" ref={ossiaRef}/>
      <div className="score-main-render" ref={scoreRenderRef}/>
    </div>
    <div className="score-zoom" aria-label="악보 확대 및 축소">
      <button type="button" aria-label="악보 축소" onClick={()=>changeZoom(zoom-.1)}>－</button>
      <button type="button" aria-label="악보 확대율 초기화" onClick={()=>changeZoom(1)}>{Math.round(zoom*100)}%</button>
      <button type="button" aria-label="악보 확대" onClick={()=>changeZoom(zoom+.1)}>＋</button>
      <button type="button" aria-label="악보 너비 맞춤" onClick={fitZoom}>맞춤</button>
    </div>
  </div>;
}

/* ==============================================================
   TRANSPORT BAR — bottom playback / tempo bar
   ============================================================== */
function createMidiSynth(instrument){
  if(!window.Tone)return null;
  const baseEnvelope={attack:0.01,decay:0.1,sustain:0.7,release:0.3};
  const configs={
    piano:{oscillator:{type:'triangle'},envelope:baseEnvelope},
    strings:{oscillator:{type:'sawtooth'},envelope:{...baseEnvelope,attack:0.08,release:0.55}},
    flute:{oscillator:{type:'sine'},envelope:{...baseEnvelope,attack:0.03,release:0.35}},
  };
  const synth=new Tone.PolySynth(Tone.Synth,configs[instrument]||configs.piano);
  synth.maxPolyphony=16;
  let effect=null;
  if(instrument==='strings'){
    effect=new Tone.Filter(800,'lowpass').toDestination();
    synth.connect(effect);
  }else if(instrument==='flute'){
    effect=new Tone.Vibrato(5,0.3).toDestination();
    synth.connect(effect);
  }else{
    synth.toDestination();
  }
  return{synth,effect,dispose(){try{synth.dispose();effect?.dispose();}catch(_){}}};
}

function MidiPlayer({file,fileCount,currentBpm,onBpmChange,onPlaybackUpdate,osmdRef}){
  const notify=useNotify();
  const [isPlaying,setIsPlaying]=useState(false);
  const [toneState,setToneState]=useState(window.Tone?'ready':'idle');
  const playRequestRef=useRef(0);
  const toneLoadingRef=useRef(false);
  const [positionSec,setPositionSec]=useState(0);
  const [instrument,setInstrument]=useState('piano');
  const [volumeDb,setVolumeDb]=useState(-8);
  const [selectedParts,setSelectedParts]=useState({});
  const [loopEnabled,setLoopEnabled]=useState(false);
  const [expandRepeats,setExpandRepeats]=useState(true);
  const [loopStart,setLoopStart]=useState(1);
  const [loopEnd,setLoopEnd]=useState(1);
  const synthRef=useRef(null);
  const isPlayingRef=useRef(false);
  // 반복 없이 끝까지 재생할 때만 쓰는 곡 끝 정지 이벤트 id입니다(Tone.Transport.scheduleOnce 반환값).
  const endEventIdRef=useRef(null);
  const cursorStateRef=useRef({cursor:null,index:-1});
  const resetCursor=useCallback(()=>{
    const cursor=osmdRef?.current?.cursor;
    cursor?.hide();cursor?.reset();cursorStateRef.current={cursor:null,index:-1};
  },[osmdRef]);
  const syncCursor=useCallback((sec,timeline)=>{
    const cursor=osmdRef?.current?.cursor,entry=window.PlaybackCore?.measureAtTime(timeline,sec);
    if(!cursor?.iterator||!entry)return;
    const previous=cursorStateRef.current;
    if(previous.cursor===cursor&&previous.index===entry.index&&!cursor.hidden)return;
    // OSMD 1.8.9 public getter is CurrentMeasureIndex (capital C).
    // Source index, not unfolded index/printed number, also handles pickup 0.
    if(previous.cursor!==cursor||entry.sourceIndex<cursor.iterator.CurrentMeasureIndex)cursor.reset();
    let steps=0;
    while(cursor.iterator.CurrentMeasureIndex<entry.sourceIndex&&!cursor.iterator.EndReached&&steps++<500)cursor.next();
    cursor.show();cursorStateRef.current={cursor,index:entry.index};
    const element=cursor.cursorElement;
    if(element){
      element.setAttribute('aria-hidden','true');element.dataset.sourceMeasure=String(entry.measure);
      const box=element.getBoundingClientRect(),viewport=element.closest('.score-container')?.getBoundingClientRect();
      if(viewport&&(box.top<viewport.top||box.bottom>viewport.bottom||box.left<viewport.left||box.right>viewport.right))element.scrollIntoView({block:'center',inline:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    }
  },[osmdRef]);

  const playbackData=useMemo(()=>{
    if(!file?.xmlDoc||!window.PlaybackCore)return{events:[],parts:[],measureTimeline:[],totalMeasures:0,totalDuration:0};
    return PlaybackCore.extractPlaybackData(file.xmlDoc,{bpm:currentBpm,expandRepeats});
  },[file,currentBpm,expandRepeats]);

  const partKey=playbackData.parts.map(p=>p.id).join('|');
  const enabledPartIds=useMemo(()=>{
    const ids=playbackData.parts.filter(p=>selectedParts[p.id]!==false).map(p=>p.id);
    return new Set(ids);
  },[playbackData.parts,selectedParts]);

  const playableEvents=useMemo(()=>playbackData.events.filter(e=>enabledPartIds.has(e.partId)),[playbackData.events,enabledPartIds]);
  const totalDuration=Math.max(0.1,playbackData.totalDuration||0);
  const totalMeasures=Math.max(1,playbackData.totalMeasures||1);
  const currentTimeline=window.PlaybackCore?.measureAtTime(playbackData.measureTimeline,positionSec);
  const currentMeasure=currentTimeline?.measure??0;
  // 재생이 반영하지 못하는 것: 따르지 못한 이동 기호와 소리가 나지 않는 타악기 파트(B-7). 둘 다 없으면 경고 줄을 그리지 않습니다.
  const skippedPlayback=[...(playbackData.navigationMarks||[]),...(playbackData.mutedParts||[]).map(label=>`타악기 ${label}`)];
  const progressPct=totalDuration?Math.min(100,Math.max(0,(positionSec/totalDuration)*100)):0;
  const getMeasureStart=useCallback(measure=>playbackData.measureTimeline[Math.max(0,measure-1)]?.startSec??0,[playbackData.measureTimeline]);
  const getMeasureEnd=useCallback(measure=>playbackData.measureTimeline[Math.max(0,measure-1)]?.endSec??totalDuration,[playbackData.measureTimeline,totalDuration]);

  const disposeSynth=useCallback(()=>{
    synthRef.current?.dispose?.();
    synthRef.current=null;
  },[]);

  const ensureSynth=useCallback(()=>{
    if(!window.Tone)return null;
    if(synthRef.current?.instrument===instrument)return synthRef.current;
    disposeSynth();
    const chain=createMidiSynth(instrument);
    if(chain)chain.instrument=instrument;
    synthRef.current=chain;
    return chain;
  },[instrument,disposeSynth]);

  const cancelTransport=useCallback(()=>{
    if(!window.Tone)return;
    Tone.Transport.stop();
    Tone.Transport.cancel();
    Tone.Transport.loop=false;
  },[]);

  const clearEnd=useCallback(()=>{
    const id=endEventIdRef.current;endEventIdRef.current=null;
    if(id!==null&&window.Tone)Tone.Transport.clear(id);
  },[]);

  const handleStop=useCallback(()=>{
    playRequestRef.current++;clearEnd();cancelTransport();resetCursor();
    isPlayingRef.current=false;
    setIsPlaying(false);
    setPositionSec(0);
    onPlaybackUpdate?.({isPlaying:false,currentMeasure:0});
  },[clearEnd,cancelTransport,onPlaybackUpdate,resetCursor]);

  // 곡 끝 도달: 커서를 지우고 위치를 곡 길이에 둡니다. 예약 이벤트와 위치 폴링 안전망이 함께 부릅니다.
  const finishPlayback=useCallback(()=>{
    clearEnd();
    if(window.Tone)Tone.Transport.stop();
    resetCursor();
    isPlayingRef.current=false;
    setIsPlaying(false);
    setPositionSec(playbackData.totalDuration||0);
    onPlaybackUpdate?.({isPlaying:false,currentMeasure:0});
  },[clearEnd,resetCursor,playbackData.totalDuration,onPlaybackUpdate]);

  const scheduleEnd=useCallback(()=>{
    if(!window.Tone)return;
    clearEnd();
    const id=Tone.Transport.scheduleOnce(()=>{
      if(endEventIdRef.current===id)endEventIdRef.current=null;
      finishPlayback();
    },Math.max(0.1,playbackData.totalDuration||0));
    endEventIdRef.current=id;
  },[clearEnd,finishPlayback,playbackData.totalDuration]);

  const schedulePlayback=useCallback(()=>{
    if(!window.Tone)return false;
    const chain=ensureSynth();
    if(!chain?.synth)return false;
    Tone.Transport.cancel();
    Tone.Transport.bpm.value=currentBpm;
    playableEvents.forEach(ev=>{
      Tone.Transport.schedule(time=>{
        chain.synth.triggerAttackRelease(
          PlaybackCore.midiToToneNote(ev.midiNote),
          Math.max(0.05,ev.durationSec),
          time,
          Math.max(0.05,Math.min(1,ev.velocity/127))
        );
      },ev.startSec);
    });
    const startSec=getMeasureStart(loopStart);
    const endSec=Math.max(startSec+0.1,getMeasureEnd(loopEnd));
    Tone.Transport.loop=loopEnabled;
    Tone.Transport.loopStart=startSec;
    Tone.Transport.loopEnd=endSec;
    endEventIdRef.current=null;// Transport.cancel()이 이전 종료 이벤트도 지웠습니다.
    if(!loopEnabled)scheduleEnd();
    return true;
  },[
    ensureSynth,playableEvents,currentBpm,loopEnabled,loopStart,loopEnd,
    getMeasureStart,getMeasureEnd,scheduleEnd
  ]);

  const handlePlay=useCallback(async()=>{
    if(isPlaying||toneLoadingRef.current)return;
    if(!file){notify('먼저 파일을 업로드해주세요.','warn');return;}
    if(!window.PlaybackCore){notify('재생 코어를 불러오지 못했습니다. 새로고침해주세요.','error');return;}
    const request=++playRequestRef.current;
    if(!window.Tone){
      toneLoadingRef.current=true;setToneState('loading');
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js','sha384-c6Uo4N9c3SOEigMVzP6IshUG1wQ5uMp3xeoQFiHWAQ86joWdgyajkvopySyKy/Z6');
        if(!window.Tone)throw new Error('재생 라이브러리가 초기화되지 않았습니다.');
        setToneState('ready');
      }catch(error){setToneState('error');notify(friendlyError(error),'err');return;}
      finally{toneLoadingRef.current=false;}
    }
    if(request!==playRequestRef.current)return;
    if(!playableEvents.length){notify('재생할 음표가 없습니다.','warn');return;}
    try{await Tone.start();}catch(error){notify('오디오를 시작할 수 없습니다: '+friendlyError(error),'err');return;}
    if(request!==playRequestRef.current)return;
    if(!schedulePlayback())return;
    const basePosition=positionSec>=(playbackData.totalDuration||0)-0.01?0:positionSec;
    const loopA=getMeasureStart(loopStart);
    const loopB=getMeasureEnd(loopEnd);
    const startAt=loopEnabled&&(basePosition<loopA||basePosition>=loopB)
      ?loopA
      :Math.min(Math.max(0,basePosition),playbackData.totalDuration||0);
    Tone.Transport.seconds=startAt;
    syncCursor(startAt,playbackData.measureTimeline);
    Tone.Transport.start();
    isPlayingRef.current=true;
    setIsPlaying(true);
  },[
    isPlaying,file,playableEvents.length,schedulePlayback,positionSec,playbackData.totalDuration,
    loopEnabled,loopStart,loopEnd,getMeasureStart,getMeasureEnd,syncCursor,playbackData.measureTimeline
  ]);

  const handlePause=useCallback(()=>{
    if(!window.Tone)return;
    clearEnd();
    Tone.Transport.pause();
    isPlayingRef.current=false;
    setIsPlaying(false);
  },[clearEnd]);

  const handleSeek=useCallback(e=>{
    const next=parseFloat(e.target.value)||0;
    setPositionSec(next);
    if(window.Tone)Tone.Transport.seconds=next;
  },[]);

  const updateLoopStart=useCallback(value=>{
    const next=Math.min(totalMeasures,Math.max(1,parseInt(value,10)||1));
    setLoopStart(next);
    setLoopEnd(end=>Math.max(next,end));
  },[totalMeasures]);

  const updateLoopEnd=useCallback(value=>{
    const next=Math.min(totalMeasures,Math.max(loopStart,parseInt(value,10)||loopStart));
    setLoopEnd(next);
  },[loopStart,totalMeasures]);

  useEffect(()=>{isPlayingRef.current=isPlaying;},[isPlaying]);

  useEffect(()=>{
    if(!file){
      setSelectedParts({});
      setLoopStart(1);
      setLoopEnd(1);
      handleStop();
      return;
    }
    const defaults={};
    playbackData.parts.forEach(part=>{defaults[part.id]=true;});
    setSelectedParts(defaults);
    setLoopStart(1);
    setLoopEnd(Math.max(1,playbackData.totalMeasures||1));
    setPositionSec(0);
  },[file,partKey,expandRepeats]);

  useEffect(()=>{
    if(!window.Tone)return;
    const master=Tone.Master||Tone.Destination;
    if(master?.volume)master.volume.value=volumeDb;
  },[volumeDb,toneState]);

  useEffect(()=>{
    if(!window.Tone||!isPlayingRef.current)return;
    const startSec=getMeasureStart(loopStart);
    const endSec=Math.max(startSec+0.1,getMeasureEnd(loopEnd));
    Tone.Transport.loop=loopEnabled;
    Tone.Transport.loopStart=startSec;
    Tone.Transport.loopEnd=endSec;
    // 재생 중 A-B를 끄면 곡 끝 정지 이벤트를 새로 예약하고, 켜면 지웁니다(B10).
    clearEnd();
    if(loopEnabled)return;
    if(Tone.Transport.seconds>=totalDuration-0.05)handleStop();
    else scheduleEnd();
  },[loopEnabled,loopStart,loopEnd,getMeasureStart,getMeasureEnd,clearEnd,scheduleEnd,handleStop,totalDuration]);

  useEffect(()=>{
    if(!isPlaying)return;
    const id=setInterval(()=>{
      if(!window.Tone||!isPlayingRef.current)return;
      const sec=Math.max(0,Tone.Transport.seconds||0);
      // 안전망: 예약 이벤트가 어떤 이유로 빠져도 반복 없이 곡 끝을 지나면 한 번 정지합니다.
      if(!loopEnabled&&playbackData.totalDuration>0&&sec>=playbackData.totalDuration){finishPlayback();return;}
      setPositionSec(loopEnabled?sec:Math.min(sec,playbackData.totalDuration||sec));
      syncCursor(sec,playbackData.measureTimeline);
    },100);
    return()=>clearInterval(id);
  },[isPlaying,loopEnabled,playbackData.totalDuration,playbackData.measureTimeline,syncCursor,finishPlayback]);

  useEffect(()=>{
    onPlaybackUpdate?.({isPlaying,currentMeasure:isPlaying?currentMeasure:0});
  },[isPlaying,currentMeasure,onPlaybackUpdate]);

  useEffect(()=>()=>{handleStop();disposeSynth();},[handleStop,disposeSynth]);

  useEffect(()=>{
    playRequestRef.current++;
    if(isPlayingRef.current)handleStop();
    else if(window.Tone)Tone.Transport.cancel();
    setPositionSec(0);
  },[file,currentBpm,instrument,partKey,selectedParts,expandRepeats,handleStop]);

  return <div className="transport-inner">
    <div className="midi-player" style={{'--midi-progress':`${progressPct}%`}}>
      <div className="midi-player__controls">
        <button className={`transport__btn transport__btn--play${isPlaying?' transport__btn--playing':''}`} onClick={handlePlay} title="재생" disabled={toneState==='loading'||toneState==='error'||!window.PlaybackCore}>{toneState==='loading'?'불러오는 중…':'▶'}</button>
        {(toneState==='error'||!window.PlaybackCore)&&<span role="status">재생 라이브러리를 불러오지 못했습니다.</span>}
        <button className="transport__btn" onClick={handlePause} title="일시정지">⏸</button>
        <button className="transport__btn" onClick={handleStop} title="정지">⏹</button>
      </div>

      <div className="midi-player__progress-wrap">
        <input className="midi-player__progress" aria-label="재생 위치" type="range" min={0} max={totalDuration} step={0.01}
          value={Math.min(positionSec,totalDuration)} onChange={handleSeek}/>
        <div className="midi-player__time">
          <span>{formatSeconds(positionSec)}</span>
          {/* C16·R1: 재생이 반영하지 못하는 이동 기호와 타악기 파트. 고정 높이 재생 막대가 늘지 않도록 시간 줄 가운데 한 줄에
              표기만 짧게(예: ⚠ 재생 미반영: D.S. · 타악기 Drums) 보이고, 전체 문장은 title과 화면 낭독기용 숨김 글로 둡니다. */}
          {skippedPlayback.length>0&&<div className="player__warning" role="status" title={(playbackData.warnings||[]).join('\n')}>
            <span className="player__warning-text" aria-hidden="true">⚠ 재생 미반영: {skippedPlayback.join(' · ')}</span>
            <span className="visually-hidden">{(playbackData.warnings||[]).join(' ')}</span>
          </div>}
