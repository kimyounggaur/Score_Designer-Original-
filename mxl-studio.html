            let sd=attr.querySelector('staff-details');if(!sd){sd=doc.createElement('staff-details');attr.appendChild(sd)}
            let sl=sd.querySelector('staff-lines');if(!sl){sl=doc.createElement('staff-lines');sd.appendChild(sl)}sl.textContent='1';
            if(rmKey){const k=attr.querySelector('key fifths');if(k)k.textContent='0'}
            let cl=attr.querySelector('clef');if(cl){let sg=cl.querySelector('sign');if(sg)sg.textContent='percussion';let ln=cl.querySelector('line');if(ln)ln.textContent='2'}
          });
          let mv=0;eachAllowedMeasure(doc,measureMode,measureStart,measureEnd,measureList,measure=>{
            measure.querySelectorAll('note').forEach(n=>{const p=n.querySelector('pitch');if(!p)return;
              p.querySelector('step').textContent='B';p.querySelector('octave').textContent='4';
              const a=p.querySelector('alter');if(a)a.remove();if(rmAcc){const ac=n.querySelector('accidental');if(ac)ac.remove()}mv++});
          });
          ch.push(`1줄 보표 (${mv}음표 · ${attrCount}마디 설정)`);
        }
        if(slash){
          let sc=0;eachAllowedMeasure(doc,measureMode,measureStart,measureEnd,measureList,measure=>{
            measure.querySelectorAll('note').forEach(n=>{if(n.querySelector('rest'))return;
            let nh=n.querySelector('notehead');if(!nh){nh=doc.createElement('notehead');insertNoteheadInOrder(n,nh)}
            nh.textContent='slash';nh.removeAttribute('color');nh.removeAttribute('filled');
            if(slashPitch){const p=n.querySelector('pitch');if(p){p.querySelector('step').textContent='B';p.querySelector('octave').textContent='4';const a=p.querySelector('alter');if(a)a.remove()}const ac=n.querySelector('accidental');if(ac)ac.remove()}
            sc++});
          });
          if(!slashKeep){let hc=0;eachAllowedMeasure(doc,measureMode,measureStart,measureEnd,measureList,measure=>{
            measure.querySelectorAll('harmony').forEach(h=>{h.remove();hc++});
          });if(hc)ch.push(`슬래시 변환과 함께 코드 ${hc}개 제거`)}
          ch.push(`슬래시 ${sc}개`);
        }
        if(noteheadEnabled){
          const noteSpec=parseNumberSpec(noteheadNoteList);
          const pitchSpec=new Set(String(noteheadPitchList||'').split(',').map(s=>s.trim()).filter(Boolean));
          let converted=0,skipped=0;
          eachAllowedMeasure(doc,noteheadMeasureMode,noteheadMeasureStart,noteheadMeasureEnd,noteheadMeasureList,measure=>{
            let ord=0;
            measure.querySelectorAll('note').forEach(note=>{
              if(note.querySelector('rest'))return;
              const p=getNotePitch(note);if(!p){skipped++;return}
              ord++;
              if(noteheadNoteMode==='positions'&&!noteSpec.has(ord)){skipped++;return}
              if(noteheadNoteMode==='pitches'&&!pitchSpec.has(pitchNameKey(p))&&!pitchSpec.has(p.step)){skipped++;return}
              applyNotehead(note,doc,noteheadValue);converted++;
            });
          });
          const label=NOTEHEAD_OPTIONS.find(([v])=>v===noteheadValue)?.[1]||noteheadValue;
          ch.push(`음표머리 ${label} ${converted}개 변환`);
          if(skipped)ch.push(`음표머리 필터 제외 ${skipped}개`);
        }
        updatedFiles.push({...file,xmlDoc:doc});
        const label=ch.length?'':' (원본 복원)';
        lines.push({m:`✓ ${file.name}${label}`,t:'ok'});ch.forEach(c=>lines.push({m:`    ${c}`}));
      }
      lastOutRef.current=updatedFiles;
      onFilesUpdate(updatedFiles,'악보 표기 변환');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,hideStaff,lyrics,chords,oneLine,slash,rmAcc,rmKey,slashPitch,slashKeep,measureMode,measureStart,measureEnd,measureList,noteheadEnabled,noteheadValue,noteheadFilled,noteheadParentheses,noteheadMeasureMode,noteheadMeasureStart,noteheadMeasureEnd,noteheadMeasureList,noteheadNoteMode,noteheadNoteList,noteheadPitchList,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">악보 표기 변환</h2>
    <p className="panel__description">악보 요소를 숨기거나 변환합니다. 여러 옵션을 동시에 적용할 수 있습니다.</p>
    <div className="card"><div className="card__title">👁️‍🗨️ 스태프 숨기기</div>
      {!parts.length?<div className="card__text">파일을 업로드하면 파트 목록이 표시됩니다.</div>:
      <div className="parts-list">{parts.map(p=>
        <div className="parts-list__item" key={p.id}>
          <div><div className="parts-list__name">{p.name}</div>
            <div className="parts-list__id">{p.id} — <span className={hideStaff[p.id]?'parts-list__status--hidden':'parts-list__status--visible'}>{hideStaff[p.id]?'숨김':'표시'}</span></div>
          </div>
          <Toggle on={hideStaff[p.id]} onClick={()=>setHideStaff(s=>({...s,[p.id]:!s[p.id]}))}/>
        </div>
      )}</div>}
    </div>
    <div className="card"><div className="card__title">📍 표기 변환 작업 마디</div>
      <div className="card__text">스태프 숨기기, 가사 숨기기, 코드 심볼 숨기기, 1줄 보표 변환, 슬래시 변환에 적용됩니다.</div>
      <div className="chip-group">
        <Chip on={measureMode==='all'} onClick={()=>setMeasureMode('all')}>전체 마디</Chip>
        <Chip on={measureMode==='range'} onClick={()=>setMeasureMode('range')}>마디 범위</Chip>
        <Chip on={measureMode==='list'} onClick={()=>setMeasureMode('list')}>마디 지정</Chip>
      </div>
      {measureMode==='range' && <div className="notation-control-grid">
        <div><label className="form-label">시작 마디</label><input className="form-input form-input--mono" type="number" min="1" value={measureStart} onChange={e=>setMeasureStart(parseInt(e.target.value)||1)}/></div>
        <div><label className="form-label">끝 마디</label><input className="form-input form-input--mono" type="number" min="1" value={measureEnd} onChange={e=>setMeasureEnd(parseInt(e.target.value)||1)}/></div>
      </div>}
      {measureMode==='list' && <div><label className="form-label">마디 번호</label><input className="form-input form-input--mono" value={measureList} onChange={e=>setMeasureList(e.target.value)} placeholder="예: 1, 3, 5-8"/></div>}
    </div>
    <div className="card"><div className="toggle-row"><div className="card__title">🔇 가사 숨기기</div><Toggle on={lyrics} onClick={()=>setLyrics(!lyrics)}/></div></div>
    <div className="card"><div className="toggle-row"><div className="card__title">🔇 코드 심볼 숨기기</div><Toggle on={chords} onClick={()=>setChords(!chords)}/></div></div>
    <div className="card"><div className="toggle-row"><div className="card__title">📏 1줄 보표 변환</div><Toggle on={oneLine} onClick={()=>setOneLine(!oneLine)}/></div>
      {oneLine && <div className="chip-group section-gap">
        <Chip on={rmAcc} onClick={()=>setRmAcc(!rmAcc)}>임시표 제거</Chip>
        <Chip on={rmKey} onClick={()=>setRmKey(!rmKey)}>조표 초기화</Chip>
      </div>}
    </div>
    <div className="card"><div className="toggle-row"><div className="card__title">⧸ 슬래시 음표 변환</div><Toggle on={slash} onClick={()=>setSlash(!slash)}/></div>
      {slash && <><div className="chip-group section-gap">
        <Chip on={slashPitch} onClick={()=>setSlashPitch(!slashPitch)}>음높이 B4 통일</Chip>
        <Chip on={slashKeep} onClick={()=>setSlashKeep(!slashKeep)}>코드 심볼 유지</Chip>
      </div>
      <div className="slash-preview section-gap">
        <div><div className="slash-preview__label">원본</div><div className="slash-preview__original">♩♪♫</div></div>
        <div className="slash-preview__arrow">→</div>
        <div><div className="slash-preview__label">슬래시</div><div className="slash-preview__converted">⧸ ⧸ ⧸</div></div>
      </div></>}
    </div>
    <div className="card"><div className="toggle-row"><div className="card__title">🎵 음표머리 변환</div><Toggle on={noteheadEnabled} onClick={()=>setNoteheadEnabled(!noteheadEnabled)}/></div>
      {noteheadEnabled && <>
        <label className="form-label section-gap">음표머리 형태</label>
        <select className="form-select" value={noteheadValue} onChange={e=>setNoteheadValue(e.target.value)}>
          {NOTEHEAD_OPTIONS.map(([value,label])=><option key={value} value={value}>{label} ({value})</option>)}
        </select>
        <div className="notehead-shape-grid section-gap">
          {NOTEHEAD_OPTIONS.map(([value,label])=><button key={value} className={`notehead-shape${noteheadValue===value?' notehead-shape--selected':''}`} onClick={()=>setNoteheadValue(value)}>{label}</button>)}
        </div>
        <div className="chip-group section-gap">
          <Chip on={noteheadFilled==='auto'} onClick={()=>setNoteheadFilled('auto')}>채움 자동</Chip>
          <Chip on={noteheadFilled==='yes'} onClick={()=>setNoteheadFilled('yes')}>채움</Chip>
          <Chip on={noteheadFilled==='no'} onClick={()=>setNoteheadFilled('no')}>비움</Chip>
          <Chip on={noteheadParentheses} onClick={()=>setNoteheadParentheses(!noteheadParentheses)}>괄호</Chip>
        </div>
        <div className="card__title section-gap">마디 선택</div>
        <div className="chip-group">
          <Chip on={noteheadMeasureMode==='all'} onClick={()=>setNoteheadMeasureMode('all')}>전체 마디</Chip>
          <Chip on={noteheadMeasureMode==='range'} onClick={()=>setNoteheadMeasureMode('range')}>마디 범위</Chip>
          <Chip on={noteheadMeasureMode==='list'} onClick={()=>setNoteheadMeasureMode('list')}>마디 지정</Chip>
        </div>
        {noteheadMeasureMode==='range' && <div className="notation-control-grid">
          <div><label className="form-label">시작 마디</label><input className="form-input form-input--mono" type="number" min="1" value={noteheadMeasureStart} onChange={e=>setNoteheadMeasureStart(parseInt(e.target.value)||1)}/></div>
          <div><label className="form-label">끝 마디</label><input className="form-input form-input--mono" type="number" min="1" value={noteheadMeasureEnd} onChange={e=>setNoteheadMeasureEnd(parseInt(e.target.value)||1)}/></div>
        </div>}
        {noteheadMeasureMode==='list' && <div><label className="form-label">마디 번호</label><input className="form-input form-input--mono" value={noteheadMeasureList} onChange={e=>setNoteheadMeasureList(e.target.value)} placeholder="예: 2, 4, 9-12"/></div>}
        <div className="card__title section-gap">음표 선택</div>
        <div className="chip-group">
          <Chip on={noteheadNoteMode==='all'} onClick={()=>setNoteheadNoteMode('all')}>선택 마디의 모든 음표</Chip>
          <Chip on={noteheadNoteMode==='positions'} onClick={()=>setNoteheadNoteMode('positions')}>마디 안 n번째 음표</Chip>
          <Chip on={noteheadNoteMode==='pitches'} onClick={()=>setNoteheadNoteMode('pitches')}>특정 음높이</Chip>
        </div>
        {noteheadNoteMode==='positions' && <div><label className="form-label">음표 순번</label><input className="form-input form-input--mono" value={noteheadNoteList} onChange={e=>setNoteheadNoteList(e.target.value)} placeholder="예: 1, 3, 5-6"/></div>}
        {noteheadNoteMode==='pitches' && <div><label className="form-label">음높이</label><input className="form-input form-input--mono" value={noteheadPitchList} onChange={e=>setNoteheadPitchList(e.target.value)} placeholder="예: C4, E4, G 또는 Bb4"/></div>}
      </>}
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 표기 변환 실행</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: EXPORT (이미지 / PDF)
   ============================================================== */
function ExportPanel({files,showProgress,hideProgress}){
  const [selIdx,setSelIdx]=useState(0);
  const [format,setFormat]=useState('png');
  const [scale,setScale]=useState(1.5);
  const [bgWhite,setBgWhite]=useState(true);
  const [previewing,setPreviewing]=useState(false);
  const [previewReady,setPreviewReady]=useState(false);
  const [textFormat,setTextFormat]=useState('abc');
  const [exportText,setExportText]=useState('');
  const [log,setLog]=useState([]);
  const previewRef=useRef(null);
  const osmdRef=useRef(null);

  // Detect total measures
  const totalMeasures=useMemo(()=>{
    if(!files.length)return 0;
    return files[0].xmlDoc.querySelector('part')?.querySelectorAll('measure')?.length||0;
  },[files]);

  // Load preview with OSMD
  const loadPreview=useCallback(async()=>{
    if(!files.length||!previewRef.current)return;
    const file=files[selIdx]||files[0];
    setPreviewing(true);setPreviewReady(false);
    try{
      previewRef.current.innerHTML='';
      const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(previewRef.current,{
        autoResize:false,
        backend:'svg',
        drawTitle:true,
        drawComposer:true,
        drawPartNames:true,
        drawMeasureNumbers:true,
      });
      osmdRef.current=osmd;
      const xmlStr=new XMLSerializer().serializeToString(file.xmlDoc);
      await osmd.load(xmlStr);
      osmd.render();
      setPreviewReady(true);
    }catch(e){
      previewRef.current.innerHTML='';
      setLog(l=>[...l,{m:'❌ 렌더링 오류: '+e.message,t:'err'}]);
    }
    setPreviewing(false);
  },[files,selIdx]);

  // Export as PNG
  const exportPNG=useCallback(async()=>{
    if(!previewRef.current||!previewReady){alert('먼저 미리보기를 실행해주세요.');return}
    setLog([]);showProgress('PNG 생성 중...');await new Promise(r=>setTimeout(r,100));
    try{
      const svgEl=previewRef.current.querySelector('svg');
      if(!svgEl)throw new Error('SVG를 찾을 수 없습니다.');

      const svgRect=svgEl.getBoundingClientRect();
      const w=svgRect.width*scale;
      const h=svgRect.height*scale;

      // Clone SVG and set explicit dimensions
      const svgClone=svgEl.cloneNode(true);
      svgClone.setAttribute('width',svgRect.width);
      svgClone.setAttribute('height',svgRect.height);

      const svgData=new XMLSerializer().serializeToString(svgClone);
      const svgBlob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(svgBlob);

      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        if(bgWhite){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h)}
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);

        canvas.toBlob(blob=>{
          if(!blob){setLog([{m:'❌ PNG 변환 실패',t:'err'}]);hideProgress();return}
          const fn=files[selIdx]?.name?.replace(/\.(mxl|xml|musicxml)$/i,'')||'score';
          downloadBlob(blob,fn+'.png');
          setLog([{m:`✓ ${fn}.png (${Math.round(w)}×${Math.round(h)}px, ${(blob.size/1024).toFixed(0)}KB)`,t:'ok'},{m:'✅ 다운로드 완료!',t:'ok'}]);
          hideProgress();
        },'image/png');
      };
      img.onerror=()=>{URL.revokeObjectURL(url);setLog([{m:'❌ 이미지 로드 실패',t:'err'}]);hideProgress()};
      img.src=url;
    }catch(e){setLog([{m:'❌ '+e.message,t:'err'}]);hideProgress()}
  },[previewReady,scale,bgWhite,files,selIdx,showProgress,hideProgress]);

  // Export as PDF
  const exportPDF=useCallback(async()=>{
    if(!previewRef.current||!previewReady){alert('먼저 미리보기를 실행해주세요.');return}
    setLog([]);showProgress('PDF 생성 중...');await new Promise(r=>setTimeout(r,100));
    try{
      const svgEl=previewRef.current.querySelector('svg');
      if(!svgEl)throw new Error('SVG를 찾을 수 없습니다.');

      const fn=files[selIdx]?.name?.replace(/\.(mxl|xml|musicxml)$/i,'')||'score';
      const svgClone=svgEl.cloneNode(true);
      const svgRect=svgEl.getBoundingClientRect();
      svgClone.setAttribute('width',svgRect.width);
      svgClone.setAttribute('height',svgRect.height);
      const svgData=new XMLSerializer().serializeToString(svgClone);

      const printWindow=window.open('','_blank');
      if(!printWindow){setLog([{m:'❌ 팝업이 차단되었습니다. 팝업 허용 후 다시 시도해주세요.',t:'err'}]);hideProgress();return}

      printWindow.document.write(`<!DOCTYPE html><html><head><title>${fn}</title>
        <style>@page{margin:10mm}body{margin:0;padding:0;background:#fff}svg{max-width:100%;height:auto}</style>
        </head><body>${svgData}</body></html>`);
      printWindow.document.close();

      setTimeout(()=>{printWindow.print();
        setLog([{m:`✓ ${fn}.pdf — 인쇄 대화상자에서 "PDF로 저장"을 선택하세요.`,t:'ok'}]);
        hideProgress();
      },800);
    }catch(e){setLog([{m:'❌ '+e.message,t:'err'}]);hideProgress()}
  },[previewReady,files,selIdx,showProgress,hideProgress]);

  // Export all files as PNG zip
  const exportAllPNG=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('전체 파일 PNG 변환 중...');
    try{
      const zip=new JSZip();const lines=[];
      const container=document.createElement('div');
      container.id='osmd-batch-'+Date.now();
      document.body.appendChild(container);

      for(let fi=0;fi<files.length;fi++){
        showProgress(`PNG 변환 중... (${fi+1}/${files.length})`);
        await new Promise(r=>setTimeout(r,50));
        container.innerHTML='';

        const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(container,{
          autoResize:false,backend:'svg',drawTitle:true,drawComposer:true,drawPartNames:true,drawMeasureNumbers:true,
        });
        const xmlStr=new XMLSerializer().serializeToString(files[fi].xmlDoc);
        await osmd.load(xmlStr);
        osmd.render();

        const svgEl=container.querySelector('svg');
        if(!svgEl){lines.push({m:`⚠ ${files[fi].name}: SVG 렌더링 실패`,t:'warn'});continue}

        const svgRect=svgEl.getBoundingClientRect();
        const w=svgRect.width*scale;const h=svgRect.height*scale;
        const svgClone=svgEl.cloneNode(true);
        svgClone.setAttribute('width',svgRect.width);svgClone.setAttribute('height',svgRect.height);
        const svgData=new XMLSerializer().serializeToString(svgClone);
        const svgBlob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
        const url=URL.createObjectURL(svgBlob);

        const blob=await new Promise((resolve,reject)=>{
          const img=new Image();
          img.onload=()=>{
            const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
            const ctx=canvas.getContext('2d');
            if(bgWhite){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h)}
            ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
            canvas.toBlob(b=>b?resolve(b):reject(new Error('toBlob 실패')),'image/png');
          };
          img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이미지 로드 실패'))};
          img.src=url;
        });

        const bn=files[fi].name.replace(/\.(mxl|xml|musicxml)$/i,'');
        zip.file(`${bn}.png`,blob);
        lines.push({m:`✓ ${bn}.png (${Math.round(w)}×${Math.round(h)}px)`,t:'ok'});
      }

      document.body.removeChild(container);
      const zipBlob=await zip.generateAsync({type:'blob'});
      downloadBlob(zipBlob,'scores_png.zip');
      lines.push({m:'✅ 전체 다운로드 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,scale,bgWhite,showProgress,hideProgress]);

  // Export SVG directly
  const exportSVG=useCallback(()=>{
    if(!previewRef.current||!previewReady){alert('먼저 미리보기를 실행해주세요.');return}
    const svgEl=previewRef.current.querySelector('svg');
    if(!svgEl)return;
    const svgData=window.ExportFormatsCore?window.ExportFormatsCore.serializeSVG(svgEl):new XMLSerializer().serializeToString(svgEl);
    const blob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
    const fn=files[selIdx]?.name?.replace(/\.(mxl|xml|musicxml)$/i,'')||'score';
    downloadBlob(blob,fn+'.svg');
    setLog([{m:`✓ ${fn}.svg 다운로드 완료`,t:'ok'}]);
  },[previewReady,files,selIdx]);

  const exportAllSVG=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    if(!window.ExportFormatsCore){alert('내보내기 변환 모듈을 불러오지 못했습니다.');return}
    setLog([]);showProgress('전체 파일 SVG 변환 중...');
    const container=document.createElement('div');
    container.style.cssText='position:absolute;left:-10000px;top:0;width:1200px;background:#fff;';
    document.body.appendChild(container);
    try{
      const zip=new JSZip();const lines=[];
      for(let fi=0;fi<files.length;fi++){
        showProgress(`SVG 변환 중... (${fi+1}/${files.length})`);
        container.innerHTML='';
        const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(container,{
          autoResize:false,backend:'svg',drawTitle:true,drawComposer:true,drawPartNames:true,drawMeasureNumbers:true,
        });
        await osmd.load(new XMLSerializer().serializeToString(files[fi].xmlDoc));
        osmd.render();
        const svgEl=container.querySelector('svg');
        if(!svgEl){lines.push({m:`⚠ ${files[fi].name}: SVG 렌더링 실패`,t:'warn'});continue}
        const bn=window.ExportFormatsCore.safeName(files[fi].name);
        zip.file(`${bn}.svg`,window.ExportFormatsCore.serializeSVG(svgEl));
        lines.push({m:`✓ ${bn}.svg`,t:'ok'});
      }
      const zipBlob=await zip.generateAsync({type:'blob'});
      downloadBlob(zipBlob,'scores_svg.zip');
      lines.push({m:'✅ SVG ZIP 다운로드 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog([{m:'❌ '+e.message,t:'err'}])}
    finally{document.body.removeChild(container);hideProgress();}
  },[files,showProgress,hideProgress]);

  const generateTextExport=useCallback(()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    if(!window.ExportFormatsCore){alert('내보내기 변환 모듈을 불러오지 못했습니다.');return}
    const file=files[selIdx]||files[0];
    const text=textFormat==='abc'
      ? window.ExportFormatsCore.toABC(file.xmlDoc)
      : window.ExportFormatsCore.toLilypond(file.xmlDoc);
    setExportText(text);
    setLog([{m:`✓ ${textFormat==='abc'?'ABC':'LilyPond'} 텍스트 생성 완료`,t:'ok'}]);
  },[files,selIdx,textFormat]);

  const downloadTextExport=useCallback(()=>{
    if(!exportText){generateTextExport();return}
    const file=files[selIdx]||files[0];
    const base=window.ExportFormatsCore?.safeName(file?.name)||'score';
    const ext=textFormat==='abc'?'txt':'ly';
    const mime=textFormat==='abc'?'text/plain;charset=utf-8':'text/x-lilypond;charset=utf-8';
    downloadBlob(new Blob([exportText],{type:mime}),`${base}.${ext}`);
    setLog([{m:`✓ ${base}.${ext} 다운로드 완료`,t:'ok'}]);
  },[exportText,files,selIdx,textFormat,generateTextExport]);

  return <div>
    <h2 className="panel__heading">이미지 / PDF 내보내기</h2>
    <p className="panel__description">
      악보를 PNG 이미지, SVG 벡터 파일, 또는 PDF로 내보냅니다.
      먼저 미리보기로 렌더링 결과를 확인한 후 원하는 형식으로 저장하세요.
    </p>

    {files.length>0 && <div className="card">
      <div className="card__title">📄 파일 선택</div>
      <select className="form-select" value={selIdx} onChange={e=>setSelIdx(parseInt(e.target.value))}>
        {files.map((f,i)=><option key={i} value={i}>{f.name}</option>)}
      </select>
    </div>}

    <div className="card">
      <div className="card__title">⚙️ 내보내기 설정</div>
      <div className="export-settings">
        <div className="export-settings__row">
          <div className="export-settings__field">
            <label className="form-label">배율 (PNG)</label>
            <select className="form-select" value={scale} onChange={e=>setScale(parseFloat(e.target.value))}>
              <option value={1}>1× (원본)</option>
              <option value={1.5}>1.5× (추천)</option>
              <option value={2}>2× (고해상도)</option>
              <option value={3}>3× (인쇄용)</option>
              <option value={4}>4× (초고해상도)</option>
            </select>
          </div>
          <div className="export-settings__field">
            <label className="form-label">배경</label>
            <div className="chip-group">
              <Chip on={bgWhite} onClick={()=>setBgWhite(true)}>흰색 배경</Chip>
              <Chip on={!bgWhite} onClick={()=>setBgWhite(false)}>투명 배경</Chip>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={loadPreview} disabled={!files.length||previewing}>
        {previewing?'렌더링 중...':'👁️ 미리보기'}
      </button>
    </div>

    <div className="export-preview" ref={previewRef}/>

    {previewReady && <div className="card export-actions-card">
      <div className="card__title">📤 내보내기</div>
      <div className="export-actions">
        <button className="btn btn--primary" onClick={exportPNG}>📷 PNG 저장</button>
        <button className="btn btn--secondary" onClick={exportSVG}>🖼️ SVG 저장</button>
        <button className="btn btn--secondary" onClick={exportPDF}>📄 PDF 저장 (인쇄)</button>
        <button className="btn btn--secondary" onClick={exportAllPNG}>📦 전체 파일 PNG (ZIP)</button>
        <button className="btn btn--secondary" onClick={exportAllSVG}>📦 전체 파일 SVG (ZIP)</button>
      </div>
    </div>}

    <div className="card">
      <div className="card__title">🎼 텍스트 악보 내보내기</div>
      <div className="chip-group">
        <Chip on={textFormat==='abc'} onClick={()=>{setTextFormat('abc');setExportText('')}}>ABC Notation</Chip>
        <Chip on={textFormat==='lilypond'} onClick={()=>{setTextFormat('lilypond');setExportText('')}}>LilyPond (.ly)</Chip>
      </div>
      <div className="btn-row" style={{marginTop:'10px'}}>
        <button className="btn btn--primary" onClick={generateTextExport} disabled={!files.length}>텍스트 생성</button>
        <button className="btn btn--secondary" onClick={downloadTextExport} disabled={!files.length}>{textFormat==='abc'?'.txt 다운로드':'.ly 다운로드'}</button>
      </div>
      <textarea
        className="export-textarea"
        value={exportText}
        onChange={e=>setExportText(e.target.value)}
        placeholder={textFormat==='abc'?'ABC Notation 결과가 여기에 표시됩니다.':'LilyPond 결과가 여기에 표시됩니다.'}/>
    </div>

    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: COLOR
   ============================================================== */
function ColorPanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [doStem,setDoStem]=useState(false);
  const [log,setLog]=useState([]);

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('색깔 악보 생성 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;
        doc.querySelectorAll('note').forEach(note=>{
          const p=getNotePitch(note);if(!p)return;
          const color=NOTE_COLORS[p.step];if(!color)return;
          note.setAttribute('color',color);
          let nh=note.querySelector('notehead');if(!nh){nh=doc.createElement('notehead');nh.textContent='normal';insertNoteheadInOrder(note,nh)}
          nh.setAttribute('color',color);nh.setAttribute('filled','yes');
          if(doStem){let st=note.querySelector('stem');if(st)st.setAttribute('color',color)}
          cnt++;
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${cnt}개 색상 적용`,t:'ok'});
      }
      onFilesUpdate(updatedFiles,'색상 악보 생성');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,doStem,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">색깔 악보 만들기</h2>
    <p className="panel__description">붐웨이커 색상 체계를 기반으로 음표에 색상을 자동 부여합니다.</p>
    <div className="card"><div className="card__title">🎨 색상 체계</div>
      <div className="color-legend">
        {Object.entries(NOTE_COLORS).map(([n,c])=>
          <div className="color-swatch" key={n}><div className="color-swatch__dot" style={{'--dot-color':c}}/>{n}</div>
        )}
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 옵션</div>
      <div className="chip-group"><Chip on={doStem} onClick={()=>setDoStem(!doStem)}>기둥(Stem) 색상</Chip></div>
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 색깔 악보 생성</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: HARMONY STACKING
   ============================================================== */
function HarmonyPanel({files,showProgress,hideProgress,onFilesUpdate}){
  const [mode,setMode]=useState('up');
  const [spacingMode,setSpacingMode]=useState('diatonic-third');
  const [ivNum,setIvNum]=useState(3);
  const [ivQual,setIvQual]=useState('major');
  const [customSemi,setCustomSemi]=useState(4);
  const [target,setTarget]=useState('all');
  const [measureMode,setMeasureMode]=useState('all');
  const [measureStart,setMeasureStart]=useState(1);
  const [measureEnd,setMeasureEnd]=useState(8);
  const [measureList,setMeasureList]=useState('');
  const [noteMode,setNoteMode]=useState('all');
  const [noteList,setNoteList]=useState('');
  const [pitchList,setPitchList]=useState('');
  const [voiceMode,setVoiceMode]=useState('chord');
  const [voiceNumber,setVoiceNumber]=useState(2);
  const [staffNumber,setStaffNumber]=useState('');
  const [log,setLog]=useState([]);

  function parseNumberSpec(spec){
    const set=new Set();
    String(spec||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(token=>{
      const m=token.match(/^(\d+)\s*-\s*(\d+)$/);
      if(m){const a=parseInt(m[1]),b=parseInt(m[2]);for(let i=Math.min(a,b);i<=Math.max(a,b);i++)set.add(i)}
      else{const n=parseInt(token);if(Number.isFinite(n)&&n>0)set.add(n)}
    });
    return set;
  }

  function noteNameKey(p){
    return `${p.step}${p.alter===1?'#':p.alter===-1?'b':''}${p.octave}`;
  }

  function getMeasureNumber(measure,fallback){
    const raw=measure.getAttribute('number');
    const parsed=parseInt(raw);
    return Number.isFinite(parsed)?parsed:fallback;
  }

  function measureAllowed(num){
    if(measureMode==='all')return true;
    if(measureMode==='range')return num>=Math.min(measureStart,measureEnd)&&num<=Math.max(measureStart,measureEnd);
    return parseNumberSpec(measureList).has(num);
  }

  function makeVoiceElement(doc,value){
    const voice=doc.createElement('voice');
    voice.textContent=String(value);
    return voice;
  }

  function insertVoiceInOrder(note,voice){
    const before=note.querySelector('type')||note.querySelector('stem')||note.querySelector('staff')||note.querySelector('beam');
    if(before)note.insertBefore(voice,before);else note.appendChild(voice);
  }

  function insertStaffInOrder(note,staff){
    const before=note.querySelector('beam')||note.querySelector('notations')||note.querySelector('lyric');
    if(before)note.insertBefore(staff,before);else note.appendChild(staff);
  }

  function buildHarmonyNote(doc,source,newMidi){
    const nn=midiToNote(newMidi);const cn=doc.createElement('note');
    cn.appendChild(doc.createElement('chord'));
    const pi=doc.createElement('pitch');const st=doc.createElement('step');st.textContent=nn.step;pi.appendChild(st);
    if(nn.alter!==0){const al=doc.createElement('alter');al.textContent=nn.alter;pi.appendChild(al)}
    const oc=doc.createElement('octave');oc.textContent=nn.octave;pi.appendChild(oc);cn.appendChild(pi);
    const dur=source.querySelector('duration');if(dur){const d=doc.createElement('duration');d.textContent=dur.textContent;cn.appendChild(d)}
    if(voiceMode==='separate')cn.appendChild(makeVoiceElement(doc,voiceNumber));
    else{
      const srcVoice=source.querySelector('voice');
      if(srcVoice)cn.appendChild(makeVoiceElement(doc,srcVoice.textContent));
    }
    const typ=source.querySelector('type');if(typ){const t=doc.createElement('type');t.textContent=typ.textContent;cn.appendChild(t)}
    const dots=source.querySelectorAll('dot');dots.forEach(()=>cn.appendChild(doc.createElement('dot')));
    const staffValue=staffNumber.trim()||source.querySelector('staff')?.textContent;
    if(staffValue){const staff=doc.createElement('staff');staff.textContent=staffValue;insertStaffInOrder(cn,staff)}
    return cn;
  }

  function harmonyOffsets(midi,kr){
    const dirs=mode==='both'?[1,-1]:mode==='down'?[-1]:[1];
    return dirs.map(dir=>{
      if(spacingMode==='diatonic-third')return dir>0?getDiaThirdAbove(midi,kr):getDiaThirdBelow(midi,kr);
      if(spacingMode==='custom-semitone')return midi+(customSemi*dir);
      const semis=computeIntervalSemis(ivNum,ivQual);
      return midi+((semis||0)*dir);
    });
  }

  const preview=useMemo(()=>{
    const notes=['C4','D4','E4','F4','G4','A4','B4'];
    const doUp=mode==='up'||mode==='both',doDown=mode==='down'||mode==='both';
    return notes.map(n=>{
      const p=parseNoteStr(n);const midi=noteToMidi(p.step,p.alter,p.octave);
      const r=[n];
      const up=()=>{
        if(spacingMode==='diatonic-third')return getDiaThirdAbove(midi,0);
        if(spacingMode==='custom-semitone')return midi+customSemi;
        return midi+(computeIntervalSemis(ivNum,ivQual)||0);
      };
      const down=()=>{
        if(spacingMode==='diatonic-third')return getDiaThirdBelow(midi,0);
        if(spacingMode==='custom-semitone')return midi-customSemi;
        return midi-(computeIntervalSemis(ivNum,ivQual)||0);
      };
      if(doUp)r.push(fmtNote(midiToNote(up())));
      if(doDown)r.unshift(fmtNote(midiToNote(down())));
      return{base:n,notes:r};
    });
  },[mode,spacingMode,ivNum,ivQual,customSemi]);

  const run=useCallback(async()=>{
    if(!files.length){alert('먼저 파일을 업로드 해주세요.');return}
    setLog([]);showProgress('화성 쌓기 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[];const updatedFiles=[];
      const noteSpec=parseNumberSpec(noteList);
      const pitchSpec=new Set(String(pitchList||'').split(',').map(s=>s.trim()).filter(Boolean));
      const intervalName=spacingMode==='diatonic-third'?'다이어토닉 3도':spacingMode==='custom-semitone'?`${customSemi}반음`:`${INTERVAL_QUALITIES.find(q=>q.id===ivQual)?.label||ivQual} ${INTERVAL_NUMBERS.find(n=>n.id===ivNum)?.label||ivNum}`;
      for(const file of files){
        const doc=cloneDoc(file.xmlDoc);const kr=getKeyRoot(doc);let added=0,skipped=0,measureHits=0;
        const parts=doc.querySelectorAll('part');
        const tParts=target==='first'?[parts[0]]:Array.from(parts);
        tParts.forEach(part=>{if(!part)return;
          [...part.querySelectorAll('measure')].forEach((measure,mi)=>{
            const measureNo=getMeasureNumber(measure,mi+1);
            if(!measureAllowed(measureNo))return;
            measureHits++;
            const baseNotes=[...measure.querySelectorAll('note')].filter(note=>!note.querySelector('rest')&&!note.querySelector('chord'));
            let noteOrdinal=0;
            baseNotes.forEach(note=>{
              noteOrdinal++;
              const p=getNotePitch(note);if(!p){skipped++;return}
              if(noteMode==='positions'&&!noteSpec.has(noteOrdinal)){skipped++;return}
              if(noteMode==='pitches'&&!pitchSpec.has(noteNameKey(p))&&!pitchSpec.has(p.step)){skipped++;return}
              const midi=noteToMidi(p.step,p.alter,p.octave);
              let lastInserted=note;
              harmonyOffsets(midi,kr).forEach(newMidi=>{
                const cn=buildHarmonyNote(doc,note,newMidi);
                if(lastInserted.nextSibling)note.parentNode.insertBefore(cn,lastInserted.nextSibling);else note.parentNode.appendChild(cn);
                lastInserted=cn;added++;
              });
            });
          });
        });
        updatedFiles.push({...file,xmlDoc:doc});
        lines.push({m:`✓ ${file.name}: ${added}개 화음 추가 · 대상 마디 ${measureHits}개 · ${intervalName}${voiceMode==='separate'?` · ${voiceNumber}성부`:''}`,t:'ok'});
        if(skipped)lines.push({m:`  필터로 제외된 음표 ${skipped}개`,t:'info'});
      }
      onFilesUpdate(updatedFiles,'화성 쌓기');
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+e.message,t:'err'}])}
    hideProgress();
  },[files,mode,spacingMode,ivNum,ivQual,customSemi,target,measureMode,measureStart,measureEnd,measureList,noteMode,noteList,pitchList,voiceMode,voiceNumber,staffNumber,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">화성 쌓기</h2>
    <p className="panel__description">선택한 마디와 음표에 원하는 음정 간격으로 화음을 추가하고, 같은 화음 또는 다른 성부로 배치합니다.</p>
    <div className="card"><div className="card__title">🔗 모드</div>
      <div className="chip-group">
        <Chip on={mode==='up'} onClick={()=>setMode('up')}>위로 쌓기</Chip>
        <Chip on={mode==='down'} onClick={()=>setMode('down')}>아래로 쌓기</Chip>
        <Chip on={mode==='both'} onClick={()=>setMode('both')}>위+아래 모두</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 음정 간격</div>
      <div className="chip-group">
        <Chip on={spacingMode==='diatonic-third'} onClick={()=>setSpacingMode('diatonic-third')}>다이어토닉 3도</Chip>
        <Chip on={spacingMode==='interval'} onClick={()=>setSpacingMode('interval')}>모든 음정</Chip>
        <Chip on={spacingMode==='custom-semitone'} onClick={()=>setSpacingMode('custom-semitone')}>반음 직접</Chip>
      </div>
      {spacingMode==='interval' && <div className="harmony-control-grid">
        <div><label className="form-label">음정 수</label><div className="chip-group">{INTERVAL_NUMBERS.map(n=><Chip key={n.id} on={ivNum===n.id} onClick={()=>setIvNum(n.id)}>{n.label}</Chip>)}</div></div>
        <div><label className="form-label">음정 종류</label><div className="chip-group">{INTERVAL_QUALITIES.map(q=><Chip key={q.id} on={ivQual===q.id} onClick={()=>setIvQual(q.id)}>{q.label}</Chip>)}</div></div>
      </div>}
      {spacingMode==='custom-semitone' && <div><label className="form-label">반음 간격</label><input className="form-input form-input--mono" type="number" min="1" max="24" value={customSemi} onChange={e=>setCustomSemi(parseInt(e.target.value)||1)}/></div>}
    </div>
    <div className="card"><div className="card__title">🎯 대상</div>
      <select className="form-select" value={target} onChange={e=>setTarget(e.target.value)}>
        <option value="all">모든 파트</option><option value="first">첫 번째 파트만</option>
      </select>
    </div>
    <div className="card"><div className="card__title">📍 마디 선택</div>
      <div className="chip-group">
        <Chip on={measureMode==='all'} onClick={()=>setMeasureMode('all')}>전체 마디</Chip>
        <Chip on={measureMode==='range'} onClick={()=>setMeasureMode('range')}>마디 범위</Chip>
        <Chip on={measureMode==='list'} onClick={()=>setMeasureMode('list')}>마디 지정</Chip>
      </div>
      {measureMode==='range' && <div className="harmony-control-grid">
        <div><label className="form-label">시작 마디</label><input className="form-input form-input--mono" type="number" min="1" value={measureStart} onChange={e=>setMeasureStart(parseInt(e.target.value)||1)}/></div>
        <div><label className="form-label">끝 마디</label><input className="form-input form-input--mono" type="number" min="1" value={measureEnd} onChange={e=>setMeasureEnd(parseInt(e.target.value)||1)}/></div>
      </div>}
      {measureMode==='list' && <div><label className="form-label">마디 번호</label><input className="form-input form-input--mono" value={measureList} onChange={e=>setMeasureList(e.target.value)} placeholder="예: 1, 3, 5-8"/></div>}
    </div>
    <div className="card"><div className="card__title">🎵 음표 선택</div>
      <div className="chip-group">
        <Chip on={noteMode==='all'} onClick={()=>setNoteMode('all')}>선택 마디의 모든 음표</Chip>
        <Chip on={noteMode==='positions'} onClick={()=>setNoteMode('positions')}>마디 안 n번째 음표</Chip>
        <Chip on={noteMode==='pitches'} onClick={()=>setNoteMode('pitches')}>특정 음높이</Chip>
      </div>
      {noteMode==='positions' && <div><label className="form-label">음표 순번</label><input className="form-input form-input--mono" value={noteList} onChange={e=>setNoteList(e.target.value)} placeholder="예: 1, 3, 5-6"/></div>}
      {noteMode==='pitches' && <div><label className="form-label">음높이</label><input className="form-input form-input--mono" value={pitchList} onChange={e=>setPitchList(e.target.value)} placeholder="예: C4, E4, G 또는 Bb4"/></div>}
    </div>
    <div className="card"><div className="card__title">🎚️ 성부/보표</div>
      <div className="chip-group">
        <Chip on={voiceMode==='chord'} onClick={()=>setVoiceMode('chord')}>같은 화음으로 추가</Chip>

        <div><label className="form-label">보표 번호</label><input className="form-input form-input--mono" value={staffNumber} onChange={e=>setStaffNumber(e.target.value)} placeholder="비우면 원본"/></div>
      </div>}
      {voiceMode==='separate' && <div className="card__text">다른 성부는 MusicXML voice 값을 분리해 둡니다. 복잡한 다성부 레이아웃은 악보 프로그램에서 추가 정리가 필요할 수 있습니다.</div>}
    </div>
    <div className="card"><div className="card__title">👁️ 미리보기 (C Major)</div>
      <div className="preview-grid">{preview.map((p,i)=>
        <div className="preview-cell" key={i}>
          {p.notes.map((n,j)=><div key={j} className={n===p.base?'preview-cell__top':'preview-cell__bottom preview-cell__bottom--accent'}>{n}</div>)}
        </div>
      )}</div>

    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 화성 쌓기 실행</button></div>
