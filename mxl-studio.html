            </button>
      )}
    </nav>

    {/* ── RIGHT ACTIVITY BAR (icon strip) ── */}
    <nav className="right-activity-bar">
      {RIGHT_ACTIVITY_ITEMS.map(item=>
        item.sep
          ? <div className="activity-bar__sep" key={item.id}/>
          : <button key={item.id}
              className={`activity-bar__btn${rightPanel===item.id?' activity-bar__btn--active':''}`}
              onClick={()=>{setRightPanel(item.id);if(!showRight)setShowRight(true)}}
              title={PANEL_LABELS[item.id]||item.id}>
              {item.icon==='capo_svg'?<svg id="Fill" enableBackground="new 0 0 64 64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style={{width:'1em',height:'1em'}}><g><g><g><g><path d="m53.9844437 12.04v1.2600002l-22.1299992 3.71-9.5599995 1.6100006c-2.1276703.2700176-2.8390522 3.2936745-1.0499039 4.4800148 4.4422474 3.2166824 24.5818214 17.7894573 29.4199028 21.2899837l-.4599991.5900002-18.4500007-11.2000007c-.2600002-.1499977-.5799999-.1800003-.8600006-.079998-.2799988.0999985-.5099983.3199997-.6099987.6100006l-4.1800003 12.0099983h-1.2900009l3.4400005-13.8400002c.1000004-.4300003-.0799999-.8699989-.4599991-1.1000004l-9.9099998-6.0099983c-1.2125359-.7878056-2.9595737.191925-2.9099655 1.6400509-.0032091 6.0960388.0022526 18.8394089-.0000353 24.9899483h-2.3599997l-2.5799999-32.2999992c-.3102512-3.0670624 2.248661-5.9857826 5.3400478-6.0399542-.0000486-.0000468 38.6099511-1.6200466 38.6099511-1.6200466zm-36.0699997 6.8399992c-.101759-3.9959745-5.9388266-3.9951725-6.0399981.0000916.1043539 3.9818439 5.9362364 3.981039 6.0399981-.0000916z" fill="currentColor"/><path d="m16.974 34.39h.97v13.3h-.97z" fill="currentColor"/><path d="m14.8944445 17.8500004c1.3369493.0188828 1.3467607 2.0289402-.000041 2.0499973-1.344841-.0265503-1.3345757-2.0260124.000041-2.0499973z" fill="currentColor"/></g></g></g></g></svg>:item.icon==='panflute_svg'?<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style={{width:'1em',height:'1em'}}><g><rect x="8" y="4" width="6" height="12" rx="3" fill="currentColor"/><rect x="16" y="4" width="6" height="14" rx="3" fill="currentColor"/><rect x="24" y="4" width="6" height="16" rx="3" fill="currentColor"/><rect x="32" y="4" width="6" height="18" rx="3" fill="currentColor"/><rect x="40" y="4" width="6" height="16" rx="3" fill="currentColor"/><rect x="48" y="4" width="6" height="14" rx="3" fill="currentColor"/><path d="M6 22 Q6 16 12 16 L52 16 Q58 16 58 22 L58 28 Q58 30 56 30 L8 30 Q6 30 6 28 Z" fill="#E85A5A"/><circle cx="14" cy="24"     {/* ── INSPECTOR (left panel) ── */}
    <aside className="inspector">
      <div className="inspector__header">
        <div className="inspector__title">🛠 인스펙터 — {PANEL_LABELS[leftPanel]||leftPanel}</div>
      </div>
      <div className="inspector__content">
        {Object.entries(ALL_PANELS).filter(([id])=>!RIGHT_PANEL_IDS.has(id)).map(([id,comp])=>
          <div key={id} className={`panel${leftPanel===id?' panel--visible':''}`}>{comp}</div>
        )}
      </div>
      <HistoryPanel
        history={history}
        historyIndex={historyIndex}
        onUndo={undo}
        onRedo={redo}
        onJump={jumpHistory}
        onClear={clearHistory}
        notice={historyNotice}
      />
    </aside>

    {/* ── MAIN SCORE VIEW (center) ── */}
    <ScoreView
      files={files}
      activeFile={activeFile}
      onOsmdReady={handleOsmdReady}
      playbackMeasure={playback.currentMeasure}
      isPlaying={playback.isPlaying}
      annotations={annotations.filter(a=>!a.fileName||a.fileName===(files[activeFile]||files[0])?.name)}
      onAnnotationEdit={setOverlayEditing}
      onAnnotationCreate={()=>{setRightPanel('annotations');setShowRight(true)}}
    />
    <AnnotationEditModal
      annotation={overlayEditing}
      onClose={()=>setOverlayEditing(null)}
      onSave={ann=>{
        const fileName=(files[activeFile]||files[0])?.name||'';
        setAnnotations(prev=>[{...ann,fileName},...prev.filter(a=>a.id!==ann.id)]);
        setOverlayEditing(null);
      }}
      onDelete={id=>{
        setAnnotations(prev=>prev.filter(a=>a.id!==id));
        setOverlayEditing(null);
      }}
    />

    {/* ── RIGHT PANEL (mirrors inspector for right activity bar) ── */}
    <aside className="analysis">
      <div className="inspector__header">
        <div className="inspector__title">🧰 도구 — {PANEL_LABELS[rightPanel]||rightPanel}</div>
      </div>
      <div className="inspector__content">
        {Object.entries(ALL_PANELS).filter(([id])=>RIGHT_PANEL_IDS.has(id)).map(([id,comp])=>
          <div key={id} className={`panel${rightPanel===id?' panel--visible':''}`}>{comp}</div>
        )}
      </div>
    </aside>

    {/* ── TRANSPORT BAR (bottom) ── */}
    <TransportBar
      files={files}
      activeFile={activeFile}
      bpm={bpm}
      onBpmChange={setBpm}
      onPlaybackUpdate={handlePlaybackUpdate}
    />

    {/* ── PROGRESS OVERLAY ── */}
    <div className={`progress-overlay${progress.visible?'':' progress-overlay--hidden'}`}>
      <div className="progress-box">
        <div className="progress-spinner"/>
        <div className="progress-message">{progress.msg}</div>
      </div>
    </div>
  </div>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
