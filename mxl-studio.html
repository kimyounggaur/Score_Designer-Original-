  },[files,activeFile,scope,startMeasure,endMeasure,transposeSemi,octaveShift,ossiaLabel,showProgress,hideProgress,onFilesUpdate]);

  const clearOssia=useCallback(()=>{
    if(!files.length)return;
    const targets=new Set(targetFiles(files,activeFile,scope).map(({index})=>index));
    const updated=files.map((f,i)=>{if(!targets.has(i))return f;const{ossiaMxml,ossiaMeta,...rest}=f;return rest});
    onFilesUpdate(updated,scopeLabel('Ossia 제거',files,scope));
    setLog([{m:'✅ Ossia 오버레이 제거됨',t:'ok'}]);
  },[files,activeFile,scope,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">Ossia 마디 추가</h2>
    <p className="panel__description">
      선택한 마디 범위에 대체 연주법(Ossia)을 추가합니다. 별도의 파트로 추가되며,
      조옮김/옥타브 변형을 함께 적용할 수 있습니다. (Finale의 Ossia Staff와 유사)
    </p>

    {totalMeasures>0 && <div className="card">
      <div className="card__title">📄 악보 정보</div>
      <div className="card__text">총 {totalMeasures}마디</div>
    </div>}

    <div className="card">
      <div className="card__title">📐 Ossia 적용 마디 범위</div>
      <div className="change-entry">
        <div className="change-entry__field change-entry__field--narrow">
          <span className="change-entry__micro">시작 마디</span>
          <input className="measure-input" type="number" min={firstNumber} max={lastNumber}
            value={startMeasure} onChange={e=>setStartMeasure(e.target.value===''?firstNumber:Number(e.target.value))}/>
        </div>
        <span className="change-entry__arrow">~</span>
        <div className="change-entry__field change-entry__field--narrow">
          <span className="change-entry__micro">끝 마디</span>
          <input className="measure-input" type="number" min={firstNumber} max={lastNumber}
            value={endMeasure} onChange={e=>setEndMeasure(e.target.value===''?firstNumber:Number(e.target.value))}/>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card__title">🎵 변형 옵션</div>
      <label className="form-label">조옮김 (반음, -12 ~ +12)</label>
      <input className="form-input form-input--mono" type="number" value={transposeSemi} min={-12} max={12}
        onChange={e=>setTransposeSemi(parseInt(e.target.value)||0)}/>
      <label className="form-label">옥타브 이동 (-2 ~ +2)</label>
      <input className="form-input form-input--mono" type="number" value={octaveShift} min={-2} max={2}
        onChange={e=>setOctaveShift(parseInt(e.target.value)||0)}/>
    </div>

    <div className="card">
      <div className="card__title">🏷️ Ossia 파트 이름</div>
      <input className="form-input" type="text" value={ossiaLabel}
        onChange={e=>setOssiaLabel(e.target.value)} placeholder="Ossia"/>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={run}>▶ Ossia 추가</button>
      <button className="btn btn--secondary" onClick={clearOssia}>🗑️ Ossia 제거</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: PARTS
   ============================================================== */
function PartsPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const [partStates,setPartStates]=useState({});
  const [log,setLog]=useState([]);

  const parts=useMemo(()=>{
    if(!files.length)return[];
    const pl=activeDoc(files,activeFile).querySelector('part-list');if(!pl)return[];
    return Array.from(pl.querySelectorAll('score-part')).map(sp=>({
      id:sp.getAttribute('id'),name:sp.querySelector('part-name')?.textContent||sp.getAttribute('id')
    }));
  },[files,activeFile]);

  useEffect(()=>{const s={};parts.forEach(p=>s[p.id]=true);setPartStates(s)},[parts]);

  const toggle=useCallback(id=>{setPartStates(s=>({...s,[id]:!s[id]}))},[]);

  const run=useCallback(async()=>{
    if(!files.length)return;
    setLog([]);showProgress('파트 추출 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      const keep=Object.entries(partStates).filter(([_,v])=>v).map(([k])=>k);
      if(!keep.length){setLog([{m:'❌ 최소 1개 파트는 유지해야 합니다.',t:'err'}]);hideProgress();return;}
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);
        // 파일마다 파트 ID를 다시 검증합니다. 유지할 파트가 없는 파일은 비우지 않고 그대로 둡니다.
        const ids=Array.from(doc.querySelectorAll('part-list score-part')).map(sp=>sp.getAttribute('id'));
        const keepHere=keep.filter(id=>ids.includes(id));
        if(!keepHere.length){
          updatedFiles.push(file);
          lines.push({m:`⚠ ${file.name}: 유지할 파트(${keep.join(', ')})가 없어 건너뜁니다. 이 파일의 파트: ${ids.join(', ')||'-'}`,t:'warn'});
          continue;
        }
        let removed=0;
        doc.querySelectorAll('part-list score-part').forEach(sp=>{if(!keepHere.includes(sp.getAttribute('id'))){sp.remove();removed++}});
        doc.querySelectorAll('part').forEach(p=>{if(!keepHere.includes(p.getAttribute('id')))p.remove()});
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${keepHere.length}파트 유지 (${removed}파트 제거)`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('파트 추출',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,partStates,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">파트 추출 / 삭제</h2>
    <p className="panel__description">원하는 파트만 남기고 나머지를 삭제합니다. 전역 히스토리에서 실행 취소할 수 있습니다.</p>
    {files.length>1 && <p className="card__text">전체 적용 시 파트 ID가 현재 파일과 다른 악보는 건너뜁니다.</p>}
    <div className="card"><div className="card__title">🎼 파트 목록</div>
      {!parts.length?<div className="card__text">파일을 업로드하면 파트 목록이 표시됩니다.</div>:
      <div className="parts-list">{parts.map(p=>
        <div className="parts-list__item" key={p.id}>
          <div><div className="parts-list__name">{p.name}</div><div className="parts-list__id">{p.id}</div></div>
          <Toggle label={`${p.name} 파트 유지`} on={partStates[p.id]} onClick={()=>toggle(p.id)}/>
        </div>
      )}</div>}
    </div>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={run}>▶ 추출 실행</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: NOTATION EDITING
   ============================================================== */
function NotationPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [hideStaff,setHideStaff]=useState({});
  const [lyrics,setLyrics]=useState(false);
  const [chords,setChords]=useState(false);
  const [oneLine,setOneLine]=useState(false);
  const [slash,setSlash]=useState(false);
  const [rmAcc,setRmAcc]=useState(true);
  const [rmKey,setRmKey]=useState(true);
  const [slashPitch,setSlashPitch]=useState(true);
  const [slashKeep,setSlashKeep]=useState(false);
  const [log,setLog]=useState([]);
  // 변환 전 원본은 파일 객체의 notationBackup(변환 직전 XML)에 있습니다. 파트 목록은 그 원본 기준이라 파트를 제거한 뒤에도 전체가 보입니다.
  const parts=useMemo(()=>{
    const file=files[activeFile]||files[0];
    let src=file?.xmlDoc||null;
    if(file?.notationBackup){try{src=notationBackupDoc(file.notationBackup);}catch(_){}}
    if(!src)return[];
    const pl=src.querySelector('part-list');if(!pl)return[];
    return Array.from(pl.querySelectorAll('score-part')).map(sp=>({
      id:sp.getAttribute('id'),name:sp.querySelector('part-name')?.textContent||sp.getAttribute('id')
    }));
  },[files,activeFile]);

  useEffect(()=>{const s={};parts.forEach(p=>s[p.id]=false);setHideStaff(s)},[parts]);

  // 보관한 원본으로 되돌립니다. 보관본이 없는 파일은 그대로 두고 알리며, 되돌린 파일이 하나도 없으면 악보와 작업 기록을 바꾸지 않습니다.
  const restore=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('원본 복원 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];let restored=0;
      for(const {file} of targetFiles(files,activeFile,scope)){
        if(!file.notationBackup){updatedFiles.push(file);lines.push({m:`ℹ ${file.name}: 복원할 원본이 없습니다.`,t:'info'});continue}
        updatedFiles.push(restoreNotationBackup(file));restored++;
        lines.push({m:`✓ ${file.name} (원본 복원)`,t:'ok'});
      }
      if(restored){
        onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('악보 표기 원본 복원',files,scope));
        lines.push({m:'✅ 복원 완료!',t:'ok'});
      }
      setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,notify,showProgress,hideProgress,onFilesUpdate]);

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    const hIds=Object.entries(hideStaff).filter(([_,v])=>v).map(([k])=>k);
    // 아무 변환도 고르지 않고 실행하면 원본 복원과 같습니다.
    if(!hIds.length&&!lyrics&&!chords&&!oneLine&&!slash)return restore();
    setLog([]);showProgress('표기 변환 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        // 변환 직전 XML을 파일에 보관하고(이미 있으면 그대로 물려줌) 언제나 그 원본에서 다시 시작합니다. 옵션을 바꿔 다시 실행해도 변환이 겹치지 않습니다.
        const backup=file.notationBackup||{xml:file.xmlString};
        const doc=file.notationBackup?parseNotationBackup(file.notationBackup):cloneDoc(file.xmlDoc);const ch=[];
        if(hIds.length){hIds.forEach(id=>{doc.querySelector(`part-list score-part[id="${id}"]`)?.remove();doc.querySelector(`part[id="${id}"]`)?.remove()});ch.push(`${hIds.length}파트 제거`)}
        if(lyrics){const ls=doc.querySelectorAll('lyric');ch.push(`가사 ${ls.length}개 제거`);ls.forEach(l=>l.remove())}
        if(chords){const hs=doc.querySelectorAll('harmony');ch.push(`코드 ${hs.length}개 제거`);hs.forEach(h=>h.remove())}
        if(oneLine){
          doc.querySelectorAll('attributes').forEach(attr=>{
            let sd=attr.querySelector('staff-details');if(!sd){sd=doc.createElement('staff-details');attr.appendChild(sd)}
            let sl=sd.querySelector('staff-lines');if(!sl){sl=doc.createElement('staff-lines');sd.appendChild(sl)}sl.textContent='1';
            if(rmKey){const k=attr.querySelector('key fifths');if(k)k.textContent='0'}
            let cl=attr.querySelector('clef');if(cl){let sg=cl.querySelector('sign');if(sg)sg.textContent='percussion';let ln=cl.querySelector('line');if(ln)ln.textContent='2'}
          });
          let mv=0;doc.querySelectorAll('note').forEach(n=>{const p=n.querySelector('pitch');if(!p)return;
            p.querySelector('step').textContent='B';p.querySelector('octave').textContent='4';
            const a=p.querySelector('alter');if(a)a.remove();if(rmAcc){const ac=n.querySelector('accidental');if(ac)ac.remove()}mv++});
          ch.push(`1줄 보표 (${mv}음표)`);
        }
        if(slash){
          let sc=0;doc.querySelectorAll('note').forEach(n=>{if(n.querySelector('rest'))return;
            let nh=n.querySelector('notehead');if(!nh){nh=doc.createElement('notehead');insertNoteheadInOrder(n,nh)}
            nh.textContent='slash';nh.removeAttribute('color');nh.removeAttribute('filled');
            if(slashPitch){const p=n.querySelector('pitch');if(p){p.querySelector('step').textContent='B';p.querySelector('octave').textContent='4';const a=p.querySelector('alter');if(a)a.remove()}const ac=n.querySelector('accidental');if(ac)ac.remove()}
            sc++});
          if(!slashKeep)doc.querySelectorAll('harmony').forEach(h=>h.remove());
          ch.push(`슬래시 ${sc}개`);
        }
        updatedFiles.push(commitFile(file,doc,{notationBackup:backup}));
        lines.push({m:`✓ ${file.name}`,t:'ok'});ch.forEach(c=>lines.push({m:`    ${c}`}));
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('악보 표기 변환',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,hideStaff,lyrics,chords,oneLine,slash,rmAcc,rmKey,slashPitch,slashKeep,showProgress,hideProgress,onFilesUpdate,restore]);

  const hasBackup=targetFiles(files,activeFile,scope).some(({file})=>file.notationBackup);
  return <div>
    <h2 className="panel__heading">악보 표기 변환</h2>
    <p className="panel__description">악보 요소를 숨기거나 변환합니다. 여러 옵션을 동시에 적용할 수 있습니다.</p>
    <div role="status">{hasBackup&&<p className="card__text">표기 변환 전 원본을 보관 중입니다. 다른 도구로 악보를 바꾸면 보관본은 사라집니다.</p>}</div>
    <div className="card"><div className="card__title">👁️‍🗨️ 파트 제거</div>
      {!parts.length?<div className="card__text">파일을 업로드하면 파트 목록이 표시됩니다.</div>:
      <div className="parts-list">{parts.map(p=>
        <div className="parts-list__item" key={p.id}>
          <div><div className="parts-list__name">{p.name}</div>
            <div className="parts-list__id">{p.id} — <span className={hideStaff[p.id]?'parts-list__status--hidden':'parts-list__status--visible'}>{hideStaff[p.id]?'제거':'유지'}</span></div>
          </div>
          <Toggle label={`${p.name} 파트 제거(출력에서 삭제)`} on={hideStaff[p.id]} onClick={()=>setHideStaff(s=>({...s,[p.id]:!s[p.id]}))}/>
        </div>
      )}</div>}
    </div>
    <div className="card"><div className="toggle-row"><div className="card__title">🔇 가사 숨기기</div><Toggle label="가사 숨기기" on={lyrics} onClick={()=>setLyrics(!lyrics)}/></div></div>
    <div className="card"><div className="toggle-row"><div className="card__title">🔇 코드 심볼 숨기기</div><Toggle label="코드 심볼 숨기기" on={chords} onClick={()=>setChords(!chords)}/></div></div>
    <div className="card"><div className="toggle-row"><div className="card__title">📏 1줄 보표 변환</div><Toggle label="1줄 보표 변환" on={oneLine} onClick={()=>setOneLine(!oneLine)}/></div>
      {oneLine && <div className="chip-group section-gap">
        <Chip on={rmAcc} onClick={()=>setRmAcc(!rmAcc)}>임시표 제거</Chip>
        <Chip on={rmKey} onClick={()=>setRmKey(!rmKey)}>조표 초기화</Chip>
      </div>}
    </div>
    <div className="card"><div className="toggle-row"><div className="card__title">⧸ 슬래시 음표 변환</div><Toggle label="슬래시 음표 변환" on={slash} onClick={()=>setSlash(!slash)}/></div>
      {slash && <><div className="chip-group section-gap">
        <Chip on={slashPitch} onClick={()=>setSlashPitch(!slashPitch)}>음높이 B4 통일</Chip>
        <Chip on={slashKeep} onClick={()=>setSlashKeep(!slashKeep)}>코드 심볼 유지</Chip>
      </div>
      <div className="slash-preview section-gap">
        <div><div className="slash-preview__label">원본</div><div className="slash-preview__original">♩♪♫</div></div>
        <div className="slash-preview__arrow">→</div>
        <div><div className="slash-preview__label">슬래시</div><div className="slash-preview__converted">⧸ ⧸ ⧸</div></div>
      </div></>}
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 표기 변환 실행</button><button className="btn btn--secondary" onClick={restore}>↩ 원본 복원</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: EXPORT (이미지 / PDF)
   ============================================================== */
function ExportPanel({files,activeFile=0,scope='all',onSelectActiveFile,showProgress,hideProgress,isActive=true}){
  const notify=useNotify();
  const [selIdx,setSelIdx]=useState(activeFile);
  useEffect(()=>setSelIdx(activeFile),[activeFile]);
  const [format,setFormat]=useState('png');
  const [scale,setScale]=useState(1.5);
  const [exportWidth,setExportWidth]=useState(window.ExportCore.DEFAULT_EXPORT_WIDTH);
  const [paper,setPaper]=useState('A4_P');
  const [bgWhite,setBgWhite]=useState(true);
  const [previewing,setPreviewing]=useState(false);
  const [previewReady,setPreviewReady]=useState(false);
  const [log,setLog]=useState([]);
  const previewRef=useRef(null);
  const osmdRef=useRef(null);

  const previewGeneration=useRef(0);
  useEffect(()=>{
    if(!isActive){previewGeneration.current++;if(previewRef.current)previewRef.current.innerHTML='';osmdRef.current=null;setPreviewReady(false);setPreviewing(false);}
    return()=>{previewGeneration.current++;if(previewRef.current)previewRef.current.innerHTML='';osmdRef.current=null;};
  },[isActive]);

  // Detect total measures
  const totalMeasures=useMemo(()=>{
    if(!files.length)return 0;
    return activeDoc(files,activeFile).querySelector('part')?.querySelectorAll('measure')?.length||0;
  },[files,activeFile]);

  // 미리보기가 그린 파일·문서·Ossia·폭을 기억합니다. 선택 파일이나 악보, 악보 폭이 바뀌면 미리보기를 지웁니다(B05·J-4).
  const previewSourceRef=useRef(null);
  const sameScoreAsPreview=useCallback(()=>{
    const source=previewSourceRef.current,current=files[selIdx];
    return !!(source&&current&&source.index===selIdx&&source.xmlDoc===current.xmlDoc&&source.ossiaMxml===current.ossiaMxml);
  },[files,selIdx]);
  const previewMatches=useCallback(()=>sameScoreAsPreview()&&previewSourceRef.current.width===exportWidth,[sameScoreAsPreview,exportWidth]);
  useEffect(()=>{
    if(!previewReady||previewMatches())return;
    const widthOnly=sameScoreAsPreview();
    previewGeneration.current++;
    if(previewRef.current)previewRef.current.innerHTML='';
    osmdRef.current=null;previewSourceRef.current=null;setPreviewReady(false);
    setLog([{m:widthOnly?'ℹ 악보 폭이 바뀌어 미리보기를 지웠습니다. 다시 실행하세요.':'ℹ 선택 파일이나 악보가 바뀌어 미리보기를 지웠습니다. 다시 실행하세요.',t:'info'}]);
  },[files,selIdx,exportWidth,previewReady,previewMatches,sameScoreAsPreview]);

  // 본보와 Ossia를 화면 밖 고정 폭 상자에서 렌더한 뒤 미리보기로 옮깁니다(Ossia 위, 본보 아래).
  // 미리보기 상자 안에서는 CSS로만 줄여 보이며, SVG의 width·height 속성(=내보내기 크기)은 그대로입니다.
  const loadPreview=useCallback(async()=>{
    if(!files.length||!previewRef.current)return;
    const index=files[selIdx]?selIdx:0;const file=files[index];
    const generation=++previewGeneration.current;
    const width=window.ExportCore.clampExportWidth(exportWidth);
    setPreviewing(true);setPreviewReady(false);previewSourceRef.current=null;
    previewRef.current.innerHTML='';
    let rendered=null;
    try{
      rendered=await renderForExport(file,{width,isStale:()=>generation!==previewGeneration.current});
      if(!rendered||generation!==previewGeneration.current||!previewRef.current)return;
      rendered.boxes.forEach(box=>previewRef.current.appendChild(box));
      osmdRef.current=rendered.osmd;
      previewSourceRef.current={index,xmlDoc:file.xmlDoc,ossiaMxml:file.ossiaMxml,width};
      setPreviewReady(true);
    }catch(e){
      if(previewRef.current)previewRef.current.innerHTML='';
      setLog(l=>[...l,{m:'❌ 렌더링 오류: '+friendlyError(e),t:'err'}]);
    }finally{
      if(rendered)rendered.dispose();
      if(generation===previewGeneration.current)setPreviewing(false);
    }
  },[files,selIdx,exportWidth]);

  const previewSvgs=()=>[previewRef.current?.querySelector('.export-preview__ossia svg'),previewRef.current?.querySelector('.export-preview__main svg')];
  const stemOf=name=>safeFileStem(String(name||'score').replace(/\.(mxl|xml|musicxml)$/i,''));

  // Export as PNG
  const exportPNG=useCallback(async()=>{
    if(!previewRef.current||!previewReady){notify('먼저 미리보기를 실행해주세요.','warn');return}
    if(!previewMatches()){notify('미리보기와 선택 파일이 다릅니다. 미리보기를 다시 실행하세요.','warn');return}
    setLog([]);showProgress('PNG 생성 중...');await new Promise(r=>setTimeout(r,100));
    try{
      const stacked=stackSvgMarkup(previewSvgs());
      const {blob,width,height}=await svgMarkupToPngBlob(stacked,{scale,bgWhite});
      const fn=stemOf(files[selIdx]?.name);
      downloadBlob(blob,fn+'.png');
      setLog([{m:`✓ ${fn}.png (${Math.round(width)}×${Math.round(height)}px, ${(blob.size/1024).toFixed(0)}KB${files[selIdx]?.ossiaMxml?', Ossia 포함':''})`,t:'ok'},{m:'✅ 다운로드 완료!',t:'ok'}]);
    }catch(e){setLog([{m:'❌ '+friendlyError(e),t:'err'}]);}
    hideProgress();
  },[previewReady,previewMatches,scale,bgWhite,files,selIdx,showProgress,hideProgress]);

  // PDF·인쇄: 화면 밖에서 용지 쪽 나눔으로 렌더한 인쇄 영역을 만들어 인쇄 창을 엽니다(대상을 'PDF로 저장'으로 고르면 PDF).
  const exportPDF=useCallback(async()=>{
    const file=files[selIdx]||files[activeFile];
    if(!file){notify('먼저 파일을 업로드하세요.','warn');return;}
    showProgress('인쇄 준비 중...');
    await new Promise(resolve=>setTimeout(resolve,50));
    try{await printScore(file,paper,{beforePrint:hideProgress});}
    catch(e){notify(friendlyError(e),'err');}
    finally{hideProgress();}
  },[files,activeFile,selIdx,paper,notify,showProgress,hideProgress]);

  // Export all files as PNG zip
  const exportAllPNG=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('전체 파일 PNG 변환 중...');
    const width=window.ExportCore.clampExportWidth(exportWidth);
    const lines=[];
    try{
      const zip=new JSZip();const used=new Set();
      for(let fi=0;fi<files.length;fi++){
        showProgress(`PNG 변환 중... (${fi+1}/${files.length})`);
        await new Promise(r=>setTimeout(r,50));
        // 파일마다 화면 밖 고정 폭 상자에서 렌더하고 바로 지웁니다. 미리보기와 같은 폭이라 PNG 저장과 크기가 같습니다(O2).
        const rendered=await renderForExport(files[fi],{width});
        try{
          if(!rendered?.main){lines.push({m:`⚠ ${files[fi].name}: SVG 렌더링 실패`,t:'warn'});continue}
          const stacked=stackSvgMarkup([rendered.ossia,rendered.main]);
          const problem=pngSizeProblem(stacked,scale);
          if(problem){lines.push({m:`❌ ${files[fi].name}: ${problem}`,t:'err'});continue}
          const {blob,width:pixelWidth,height:pixelHeight}=await svgMarkupToPngBlob(stacked,{scale,bgWhite});
          // 같은 이름의 .xml·.mxl이 있어도 엔트리가 덮이지 않게 고유 이름을 씁니다(B06).
          const bn=uniqueStem(stemOf(files[fi].name),used);
          zip.file(`${bn}.png`,blob);
          lines.push({m:`✓ ${bn}.png (${pixelWidth}×${pixelHeight}px${rendered.ossia?', Ossia 포함':''})`,t:'ok'});
        }finally{rendered?.dispose();}
      }
      if(!used.size){lines.push({m:'⚠ 만든 PNG가 없어 ZIP을 내려받지 않았습니다.',t:'warn'});setLog(lines);}
      else{
        const zipBlob=await zip.generateAsync({type:'blob'});
        downloadBlob(zipBlob,'scores_png.zip');
        lines.push({m:`✅ ${used.size}개 PNG를 ZIP으로 내려받았습니다.${used.size<files.length?` (${files.length-used.size}개 제외)`:''}`,t:'ok'});setLog(lines);
      }
    }catch(e){setLog([...lines,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,scale,bgWhite,exportWidth,showProgress,hideProgress]);

  // Export SVG directly (Ossia가 있으면 위에 함께 넣습니다)
  const exportSVG=useCallback(()=>{
    if(!previewRef.current||!previewReady){notify('먼저 미리보기를 실행해주세요.','warn');return}
    if(!previewMatches()){notify('미리보기와 선택 파일이 다릅니다. 미리보기를 다시 실행하세요.','warn');return}
    try{
      const [ossia,main]=previewSvgs();
      if(!main)throw new Error('SVG를 찾을 수 없습니다.');
      const markup=ossia?stackSvgMarkup([ossia,main]).markup:new XMLSerializer().serializeToString(main);
      const blob=new Blob([markup],{type:'image/svg+xml'});
      const fn=stemOf(files[selIdx]?.name);
      downloadBlob(blob,fn+'.svg');
      setLog([{m:`✓ ${fn}.svg 다운로드 완료${files[selIdx]?.ossiaMxml?' (Ossia 포함)':''}`,t:'ok'}]);
    }catch(e){setLog([{m:'❌ '+friendlyError(e),t:'err'}]);}
  },[previewReady,previewMatches,files,selIdx]);

  return <div>
    <h2 className="panel__heading">이미지 / PDF 내보내기</h2>
    <p className="panel__description">
      악보를 PNG 이미지, SVG 벡터 파일, 또는 PDF로 내보냅니다.
      먼저 미리보기로 렌더링 결과를 확인한 후 원하는 형식으로 저장하세요.
    </p>

    {files.length>0 && <div className="card">
      <div className="card__title">📄 파일 선택</div>
      <select className="form-select" value={selIdx} onChange={e=>{const index=parseInt(e.target.value);setSelIdx(index);onSelectActiveFile?.(index);}}>
        {files.map((f,i)=><option key={i} value={i}>{f.name}</option>)}
      </select>
    </div>}

    <div className="card">
      <div className="card__title">⚙️ 내보내기 설정</div>
      <div className="export-settings">
        <div className="export-settings__row">
          <div className="export-settings__field">
            <label className="form-label" htmlFor="export-width">악보 폭</label>
            <select id="export-width" className="form-select" aria-label="악보 폭" value={exportWidth} onChange={e=>setExportWidth(window.ExportCore.clampExportWidth(e.target.value))}>
              {window.ExportCore.EXPORT_WIDTHS.map(w=><option key={w} value={w}>{w}px{w===window.ExportCore.DEFAULT_EXPORT_WIDTH?' (기본)':''}</option>)}
            </select>
            <div className="export-settings__hint">폭이 넓을수록 한 줄에 마디가 많이 들어갑니다.</div>
          </div>
          <div className="export-settings__field">
            <label className="form-label">배율 (PNG)</label>
            <select className="form-select" aria-label="배율 (PNG)" value={scale} onChange={e=>setScale(parseFloat(e.target.value))}>
              <option value={1}>1× (원본)</option>
              <option value={1.5}>1.5× (추천)</option>
              <option value={2}>2× (고해상도)</option>
              <option value={3}>3× (인쇄용)</option>
              <option value={4}>4× (초고해상도)</option>
            </select>
          </div>
          <div className="export-settings__field">
            <label className="form-label">배경</label>
            <div className="chip-group">
              <Chip on={bgWhite} onClick={()=>setBgWhite(true)}>흰색 배경</Chip>
              <Chip on={!bgWhite} onClick={()=>setBgWhite(false)}>투명 배경</Chip>
            </div>
          </div>
        </div>
        <div className="export-settings__row">
          <div className="export-settings__field">
            <label className="form-label" htmlFor="export-paper">용지 (PDF·인쇄)</label>
            <select id="export-paper" className="form-select" aria-label="용지" value={paper} onChange={e=>setPaper(window.ExportCore.PAGE_FORMATS[e.target.value]?e.target.value:'A4_P')}>
              {Object.entries(window.ExportCore.PAGE_FORMATS).map(([key,format])=><option key={key} value={key}>{format.label}</option>)}
            </select>
          </div>
        </div>
      </div>
    </div>

    <div className="btn-row">
      <button className="btn btn--primary" onClick={loadPreview} disabled={!files.length||previewing}>
        {previewing?'렌더링 중...':'👁️ 미리보기'}
      </button>
    </div>

    <div className="export-preview" ref={previewRef}/>

    {previewReady && <div className="card export-actions-card">
      <div className="card__title">📤 내보내기</div>
      <div className="export-actions">
        <button className="btn btn--primary" onClick={exportPNG}>📷 PNG 저장</button>
        <button className="btn btn--secondary" onClick={exportSVG}>🖼️ SVG 저장</button>
        <button className="btn btn--secondary" onClick={exportPDF}>🖨️ 인쇄 / PDF로 저장</button>
        <button className="btn btn--secondary" onClick={exportAllPNG}>📦 전체 파일 PNG (ZIP)</button>
      </div>
      <div className="export-settings__hint">인쇄 창에서 대상을 'PDF로 저장'으로 고르면 PDF 파일이 됩니다.</div>
    </div>}

    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: COLOR
   ============================================================== */
function ColorPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [doStem,setDoStem]=useState(false);
  const [log,setLog]=useState([]);

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('색깔 악보 생성 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let cnt=0,badColor=0;
        doc.querySelectorAll('note').forEach(note=>{
          const p=getNotePitch(note);if(!p)return;
          if(!NOTE_COLORS[p.step])return;
          const color=noteColorFor(p.step);if(!color){badColor++;return}
          note.setAttribute('color',color);
          let nh=note.querySelector('notehead');if(!nh){nh=doc.createElement('notehead');nh.textContent='normal';insertNoteheadInOrder(note,nh)}
          // 머리 채움(filled)은 음표 길이가 정하므로 건드리지 않고 색만 바꿉니다(C14).
          nh.setAttribute('color',color);
          if(doStem){let st=note.querySelector('stem');if(st)st.setAttribute('color',color)}
          cnt++;
        });
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${cnt}개 색상 적용`,t:'ok'});
        if(badColor)lines.push({m:`⚠ ${file.name}: 색상 형식 오류로 ${badColor}개 음표는 건너뛰었습니다.`,t:'warn'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('색상 악보 생성',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,doStem,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">색깔 악보 만들기</h2>
    <p className="panel__description">붐웨이커 색상 체계를 기반으로 음표에 색상을 자동 부여합니다.</p>
    <div className="card"><div className="card__title">🎨 색상 체계</div>
      <div className="color-legend">
        {Object.entries(NOTE_COLORS).map(([n,c])=>
          <div className="color-swatch" key={n}><div className="color-swatch__dot" style={{'--dot-color':c}}/>{n}</div>
        )}
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 옵션</div>
      <div className="chip-group"><Chip on={doStem} onClick={()=>setDoStem(!doStem)}>기둥(Stem) 색상</Chip></div>
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 색깔 악보 생성</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: HARMONY STACKING
   ============================================================== */
// 원음과 같은 시간·성부·보표를 갖는 화음 음표. 붙임줄은 유지하고 셋잇단·슬러·아티큘레이션은 원음에만 둡니다.
function buildChordNote(doc,source,pitch){
  const note=doc.createElement('note');
  note.appendChild(doc.createElement('chord'));
  const pitchEl=doc.createElement('pitch');
  const step=doc.createElement('step');step.textContent=pitch.step;pitchEl.appendChild(step);
  if(pitch.alter){const alter=doc.createElement('alter');alter.textContent=String(pitch.alter);pitchEl.appendChild(alter);}
  const octave=doc.createElement('octave');octave.textContent=String(pitch.octave);pitchEl.appendChild(octave);
  note.appendChild(pitchEl);
  for(const tag of ['duration','tie','voice','type','dot','time-modification','stem','staff'])xmlChildren(source,tag).forEach(child=>note.appendChild(child.cloneNode(true)));
  const tied=Array.from(source.querySelectorAll(':scope > notations > tied'));
  if(tied.length){const notations=doc.createElement('notations');tied.forEach(tie=>notations.appendChild(tie.cloneNode(true)));note.appendChild(notations);}
  return note;
}

function HarmonyPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [mode,setMode]=useState('up');
  const [chromatic,setChromatic]=useState(false);
  const [target,setTarget]=useState('all');
  const [log,setLog]=useState([]);

  const preview=useMemo(()=>{
    const notes=['C4','D4','E4','F4','G4','A4','B4'];
    const doUp=mode==='up'||mode==='both',doDown=mode==='down'||mode==='both';
    const third=(pitch,direction)=>chromatic?PitchCore.chromaticThird(pitch,direction):PitchCore.diatonicThird(pitch,0,direction);
    return notes.map(n=>{
      const p=parseNoteStr(n);
      const r=[n];
      if(doUp)r.push(fmtNote(third(p,'above')));
      if(doDown)r.unshift(fmtNote(third(p,'below')));
      return{base:n,notes:r};
    });
  },[mode,chromatic]);

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('화성 쌓기 중...');await new Promise(r=>setTimeout(r,50));
    const directions=[...(mode==='up'||mode==='both'?['above']:[]),...(mode==='down'||mode==='both'?['below']:[])];
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let added=0,skipped=0;
        const parts=Array.from(doc.querySelectorAll('score-partwise > part'));
        for(const part of target==='first'?parts.slice(0,1):parts){
          // 마디를 따라 현재 조표를 추적하고, 그 조표로 3도 음의 철자를 정합니다.
          let fifths=0;
          for(const measure of xmlChildren(part,'measure')){
            for(const node of Array.from(measure.children)){
              if(node.localName==='attributes'){const value=node.querySelector('key fifths');if(value)fifths=Number(value.textContent)||0;continue;}
              if(node.localName!=='note'||['rest','chord','grace','cue','unpitched'].some(tag=>xmlChild(node,tag)))continue;
              const pitch=PitchCore.readPitch(node);if(!pitch)continue;
              // 이 음에 이미 붙은 chord 음표와 같은 음(step·alter·octave)은 다시 넣지 않습니다(반복 실행 시 중복, E17).
              const existing=[];
              for(let sibling=node.nextElementSibling;sibling;sibling=sibling.nextElementSibling){
                if(sibling.localName!=='note')continue;
                if(!xmlChild(sibling,'chord'))break;
                const chordPitch=PitchCore.readPitch(sibling);if(chordPitch)existing.push(chordPitch);
              }
              const samePitch=(a,b)=>a.step===b.step&&(a.alter||0)===(b.alter||0)&&a.octave===b.octave;
              let anchor=node;
              for(const direction of directions){
                const next=chromatic?PitchCore.chromaticThird(pitch,direction):PitchCore.diatonicThird(pitch,fifths,direction);
                if(existing.some(other=>samePitch(other,next))){skipped++;continue;}
                const chordNote=buildChordNote(doc,node,next);
                measure.insertBefore(chordNote,anchor.nextSibling);
                PitchCore.syncAccidental(chordNote,fifths);
                existing.push(next);anchor=chordNote;added++;
              }
            }
          }
        }
        // 3도 위/아래 음이 옥타브 0~9를 벗어나면(B9의 3도 위 등) 이 파일은 적용하지 않습니다.
        if(!guardPitchRange(file,doc,lines,{label:file.name})){updatedFiles.push(file);continue}
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${added}개 추가, ${skipped}개는 이미 있어 건너뜀`,t:'ok'});
      }
      commitIfChanged(onFilesUpdate,files,mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('화성 쌓기',files,scope),lines);
      setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,mode,chromatic,target,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">화성 쌓기</h2>
    <p className="panel__description">멜로디에 3도 위/아래 화음을 자동으로 추가합니다.</p>
    <div className="card"><div className="card__title">🔗 모드</div>
      <div className="chip-group">
        <Chip on={mode==='up'} onClick={()=>setMode('up')}>3도 위</Chip>
        <Chip on={mode==='down'} onClick={()=>setMode('down')}>3도 아래</Chip>
        <Chip on={mode==='both'} onClick={()=>setMode('both')}>위+아래 모두</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 간격</div>
      <div className="chip-group">
        <Chip on={!chromatic} onClick={()=>setChromatic(false)}>다이어토닉 (조성 기반)</Chip>
        <Chip on={chromatic} onClick={()=>setChromatic(true)}>크로매틱 (항상 장3도)</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">🎯 대상</div>
      <select className="form-select" value={target} onChange={e=>setTarget(e.target.value)}>
        <option value="all">모든 파트</option><option value="first">첫 번째 파트만</option>
      </select>
    </div>
    <div className="card"><div className="card__title">👁️ 미리보기 (C Major)</div>
      <div className="preview-grid">{preview.map((p,i)=>
        <div className="preview-cell" key={i}>
          {p.notes.map((n,j)=><div key={j} className={n===p.base?'preview-cell__top':'preview-cell__bottom preview-cell__bottom--accent'}>{n}</div>)}
        </div>
      )}</div>
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 화성 쌓기 실행</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: CHORD TOOLS
   ============================================================== */

function ChordToolsPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [rules,setRules]=useState([{from:'',to:''}]);
  const [replaceExisting,setReplaceExisting]=useState(false);
  const [inv,setInv]=useState(1);
  const [log,setLog]=useState([]);

  const addRule=useCallback(()=>setRules(r=>[...r,{from:'',to:''}]),[]);
  const removeRule=useCallback(i=>setRules(r=>r.filter((_,j)=>j!==i)),[]);
  const updateRule=useCallback((i,field,val)=>setRules(r=>r.map((x,j)=>j===i?{...x,[field]:val}:x)),[]);

  const runReplace=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    const valid=rules.filter(r=>r.from.trim()&&r.to.trim());
    if(!valid.length){notify('변경 규칙을 입력해주세요.','warn');return}
    setLog([]);showProgress('코드 변경 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;
        doc.querySelectorAll('harmony').forEach(h=>{
          const cs=harmonyToString(h);
          valid.forEach(rule=>{if(cs===rule.from){
            const p=parseChordSymbol(rule.to);if(!p)return;
            ChordSymbolCore.apply(h,p);cnt++;
          }});
        });
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${cnt}개 변경`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('코드 일괄 변경',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,rules,showProgress,hideProgress,onFilesUpdate]);

  const runAutoInsert=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('코드 분석 & 삽입 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);
        // 박 단위 수직 분석에서 마디마다 첫 박의 확정 코드만 넣습니다(마디당 1개).
        // 분석 행의 measureIndex로 같은 문서의 마디를 찾으므로 못갖춘마디·반복 번호도 어긋나지 않습니다.
        // 덮어쓰기를 켜도 코드를 확정한 마디에서만 기존 코드를 바꾸고, 건너뛴 마디의 기존 코드는 그대로 둡니다(D01).
        const res=window.ChordToolsCore.insertAutoChords(doc,groupVerticalities(window.RomanAnalysis.analyzeVerticalities(doc)),{replaceExisting});
        updatedFiles.push(commitFile(file,doc));
        res.unsettled.slice(0,10).forEach(u=>lines.push({m:`⚠ 마디 ${u.measure}: ${unsettledChordReason(u.row)} 코드를 확정하지 않았습니다${replaceExisting&&u.existing?` (기존 코드 ${u.existing}개는 그대로 둡니다)`:''}`,t:'warn'}));
        if(res.unsettled.length>10)lines.push({m:`⚠ … 그 밖에 ${res.unsettled.length-10}마디도 코드를 확정하지 않았습니다`,t:'warn'});
        lines.push({m:`✓ ${file.name}: ${res.inserted}마디 코드 삽입${replaceExisting?` (기존 코드 ${res.replaced}개 교체, 미확정 마디의 기존 코드 ${res.keptExisting}개 유지)`:res.skippedExisting?` (기존 코드가 있는 ${res.skippedExisting}마디는 건너뜀)`:''}`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('코드 분석 및 삽입',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,replaceExisting,showProgress,hideProgress,onFilesUpdate]);

  const runInversion=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress(`${inv}st/nd/rd inversion 적용 중...`);await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let ok=0,skip=0;
        doc.querySelectorAll('harmony').forEach(h=>{
          const rootEl=xmlChild(h,'root');const kindEl=xmlChild(h,'kind');
          if(!rootEl||!kindEl){skip++;return}
          // 베이스 음은 근음 철자에서 구성음 음정(음이름 간격+반음)으로 계산합니다 (E 1st → G#, B7 1st → D#).
          const root={step:xmlText(rootEl,'root-step').trim(),alter:Number(xmlText(rootEl,'root-alter','0'))||0};
          const bassPitch=PitchCore.bassForInversion(root,kindEl.textContent.trim()||'major',inv);
          if(!bassPitch){skip++;return}
          const bStep=bassPitch.step,bAlter=bassPitch.alter;
          h.querySelectorAll('inversion').forEach(e=>e.remove());
          h.querySelectorAll('bass').forEach(e=>e.remove());
          const invEl=doc.createElement('inversion');invEl.textContent=String(inv);
          if(kindEl.nextSibling)kindEl.parentNode.insertBefore(invEl,kindEl.nextSibling);else kindEl.parentNode.appendChild(invEl);
          const bass=doc.createElement('bass');
          const bs=doc.createElement('bass-step');bs.textContent=bStep;bass.appendChild(bs);
          if(bAlter!==0){const baEl=doc.createElement('bass-alter');baEl.textContent=String(bAlter);bass.appendChild(baEl)}
          if(invEl.nextSibling)invEl.parentNode.insertBefore(bass,invEl.nextSibling);else invEl.parentNode.appendChild(bass);
          ok++;
        });
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${ok}개 적용${skip?`, ${skip}개 생략`:''}`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('코드 자리바꿈',files,scope));
      lines.push({m:'✅ 자리바꿈 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,inv,showProgress,hideProgress,onFilesUpdate]);

  const runInversionReset=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('원위치 복원 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
    for(const {file} of targetFiles(files,activeFile,scope)){
      const doc=cloneDoc(file.xmlDoc);let n=0;
      doc.querySelectorAll('harmony').forEach(h=>{
        const invEl=h.querySelector('inversion');const bassEl=h.querySelector('bass');
        if(invEl){invEl.remove();n++}if(bassEl){bassEl.remove();n++}
      });
      updatedFiles.push(commitFile(file,doc));
      lines.push({m:`✓ ${file.name}: ${n}개 요소 제거`,t:'ok'});
    }
    onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('코드 자리바꿈 원위치',files,scope));
    lines.push({m:'✅ 원위치 복원 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">코드 도구</h2>
    <p className="panel__description">코드 심볼을 일괄 변경하거나, 마디별 음표 분석을 통해 코드를 자동 삽입합니다.</p>
    <div className="card"><div className="card__title">🔄 코드 심볼 일괄 변경</div>
      <div className="card__text">기존 코드 기호를 찾아 다른 코드로 일괄 교체합니다.</div>
      {rules.map((r,i)=>
        <div className="chord-rule" key={i}>
          <input className="form-input form-input--mono" placeholder="원본 (예: Am)" value={r.from} onChange={e=>updateRule(i,'from',e.target.value)}/>
          <span className="chord-rule__arrow">→</span>
          <input className="form-input form-input--mono" placeholder="변경 (예: Am7)" value={r.to} onChange={e=>updateRule(i,'to',e.target.value)}/>
          <button className="chord-rule__remove" onClick={()=>removeRule(i)}>✕</button>
        </div>
      )}
      <button className="btn btn--secondary" onClick={addRule}>+ 규칙 추가</button>
      <div className="btn-row"><button className="btn btn--primary" onClick={runReplace}>▶ 코드 일괄 변경</button></div>
    </div>
    <div className="card"><div className="card__title">🎸 코드 자동 분석 & 삽입</div>
      <div className="card__text">마디마다 첫 박에 함께 울리는 음으로 코드를 판정해 악보 위에 넣습니다(마디당 1개). 음이 3개 미만이거나 화음 패턴에 맞지 않는 마디는 건너뛰고 로그에 이유를 남깁니다. ‘기존 코드 덮어쓰기’를 켜도 코드를 확정한 마디의 기존 코드만 바꾸며, 건너뛴 마디의 기존 코드는 그대로 둡니다.</div>
      <div className="chip-group"><Chip on={replaceExisting} onClick={()=>setReplaceExisting(!replaceExisting)}>기존 코드 덮어쓰기</Chip></div>
      <div className="btn-row"><button className="btn btn--primary" onClick={runAutoInsert}>▶ 코드 분석 & 삽입</button></div>
    </div>
    <div className="card"><div className="card__title">🔁 코드 자리바꿈 (Inversion)</div>
      <div className="card__text">모든 코드 기호에 자리바꿈 번호와 베이스 음을 지정합니다. (예: C major + 1st → C/E)</div>
      <div className="chip-group">
        <Chip on={inv===1} onClick={()=>setInv(1)}>1st inversion</Chip>
        <Chip on={inv===2} onClick={()=>setInv(2)}>2nd inversion</Chip>
        <Chip on={inv===3} onClick={()=>setInv(3)}>3rd inversion</Chip>
        <Chip on={inv===4} onClick={()=>setInv(4)}>4th inversion</Chip>
        <Chip on={inv===5} onClick={()=>setInv(5)}>5th inversion</Chip>
      </div>
      <div className="btn-row">
        <button className="btn btn--primary" onClick={runInversion}>▶ 자리바꿈 적용</button>
        <button className="btn btn--secondary" onClick={runInversionReset} aria-describedby="inversion-reset-note">↺ 원위치</button>
      </div>
      <div className="card__text" id="inversion-reset-note">원위치는 모든 코드의 자리바꿈 번호와 슬래시 베이스를 지웁니다. 불러온 악보의 원래 슬래시 베이스도 함께 제거됩니다.</div>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: NUMBER NOTATION
   ============================================================== */
function NumberingPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [mode,setMode]=useState('fixed');
  const [showOct,setShowOct]=useState(true);
  const [showSharp,setShowSharp]=useState(false);
  const [keepLyrics,setKeepLyrics]=useState(false);
  const [baseOctave,setBaseOctave]=useState(4);
  const [log,setLog]=useState([]);

  const preview=useMemo(()=>{
    if(mode==='original')return[];
    const ex=[{s:'C',a:0,o:4},{s:'D',a:0,o:4},{s:'E',a:0,o:4},{s:'F',a:0,o:4},{s:'G',a:0,o:4},{s:'A',a:0,o:4},{s:'B',a:0,o:4},{s:'F',a:1,o:4},{s:'C',a:0,o:3},{s:'C',a:0,o:5},{s:'C',a:0,o:6}];
    return ex.map(n=>({note:n.s+(n.a===1?'#':n.a===-1?'♭':'')+n.o,num:NumberingCore.noteToNumStr(n.s,n.a,n.o,{fifths:0,mode,showOct,showSharp,baseOctave})}));
  },[mode,showOct,showSharp,baseOctave]);

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress(mode==='original'?'기존 가사 복원 중...':'숫자 악보 생성 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);
        if(mode==='original'){
          // 원본 가사 백업은 파일 객체(lyricBackup)에 있어 다른 패널이 커밋해도 남습니다.
          const generated=NumberingCore.removeGeneratedLyrics(doc);
          if(file.lyricBackup){
            const {restored,missing}=NumberingCore.restoreLyrics(doc,file.lyricBackup);
            updatedFiles.push(commitFile(file,doc,{lyricBackup:undefined}));
            lines.push({m:`✓ ${file.name}: 원본 가사 ${restored}개 복원${missing?`, ${missing}개는 음표를 찾지 못함`:''}`,t:missing?'warn':'ok'});
          }else if(generated){
            updatedFiles.push(commitFile(file,doc));
            lines.push({m:`✓ ${file.name}: 숫자 가사 ${generated}개 제거 (원본 가사는 그대로 있었습니다)`,t:'ok'});
          }else{
            updatedFiles.push(file);
            lines.push({m:`⚠ ${file.name}: 숫자 악보를 만든 기록이 없어 복원할 원본 가사가 없습니다`,t:'warn'});
          }
          continue;
        }
        NumberingCore.removeGeneratedLyrics(doc);
        // 처음 만들 때만 원본 가사를 백업합니다. 다시 만들면 기존 백업을 유지하고 생성 가사만 바꿉니다.
        let backup=file.lyricBackup;
        if(!keepLyrics){
          if(!backup)backup=NumberingCore.backupLyrics(doc);
          NumberingCore.removeUserLyrics(doc);
        }
        const {count}=NumberingCore.generateNumberLyrics(doc,{mode,showOct,showSharp,keepLyrics,baseOctave});
        updatedFiles.push(commitFile(file,doc,{lyricBackup:backup}));
        lines.push({m:`✓ ${file.name}: ${count}개 숫자 삽입`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel(mode==='original'?'숫자 악보 원본 가사 복원':'숫자 악보 생성',files,scope));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,mode,showOct,showSharp,keepLyrics,baseOctave,showProgress,hideProgress,onFilesUpdate]);

  return <div>
    <h2 className="panel__heading">숫자 악보</h2>
    <p className="panel__description">음높이를 숫자로 변환하여 가사(Lyric) 위치에 삽입합니다. 이동 도법은 마디마다 그 시점의 조표를 따릅니다.</p>
    <p className="card__text">원본 가사 백업은 이 브라우저 탭 안에서만 유지됩니다. 세션 저장·공유·새로고침 뒤에는 복원할 수 없습니다.</p>
    <div className="card"><div className="card__title">🔢 번호 체계</div>
      <div className="chip-group">
        <Chip on={mode==='fixed'} onClick={()=>setMode('fixed')}>고정 도법 (C=1)</Chip>
        <Chip on={mode==='movable'} onClick={()=>setMode('movable')}>이동 도법</Chip>
        <Chip on={mode==='korean'} onClick={()=>setMode('korean')}>한국어 계이름</Chip>
        <Chip on={mode==='original'} onClick={()=>setMode('original')}>기존 가사 복원</Chip>
      </div>
    </div>
    <div className="card"><div className="card__title">⚙️ 옵션</div>
      <div className="chip-group">
        <Chip on={showOct} onClick={()=>setShowOct(!showOct)}>옥타브 점 표시</Chip>
        <Chip on={showSharp} onClick={()=>setShowSharp(!showSharp)}># / ♭ 표시</Chip>
        <Chip on={keepLyrics} onClick={()=>setKeepLyrics(!keepLyrics)}>기존 가사 유지</Chip>
      </div>
      <div className="toggle-row section-gap">
        <span className="card__text">기준 옥타브 (점 없음)</span>
        <select className="form-select" aria-label="기준 옥타브" value={baseOctave} disabled={!showOct}
          onChange={e=>setBaseOctave(Number(e.target.value))}>
          {[2,3,4,5,6].map(octave=><option key={octave} value={octave}>{`${octave}옥타브 (C${octave})`}</option>)}
        </select>
      </div>
    </div>
    <div className="card"><div className="card__title">👁️ 미리보기</div>
      <div className="preview-grid">{preview.map((p,i)=>
        <div className="preview-cell preview-cell--number" key={i}>
          <div className="preview-cell__note-label">{p.note}</div>
          <div className="preview-cell__number-value">{p.num}</div>
        </div>
      )}</div>
    </div>
    <div className="btn-row"><button className="btn btn--primary" onClick={run}>▶ 숫자 악보 생성</button></div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: LYRIC STYLE
   ============================================================== */
const LYRIC_FONT_FAMILIES=[
  {id:'',label:'기본값'},
  {id:'Malgun Gothic',label:'맑은 고딕'},
  {id:'Nanum Gothic',label:'나눔고딕'},
  {id:'Nanum Myeongjo',label:'나눔명조'},
  {id:'Gothic',label:'고딕'},
  {id:'Times New Roman',label:'Times New Roman'},
  {id:'Arial',label:'Arial'},
  {id:'Georgia',label:'Georgia'},
  {id:'Courier New',label:'Courier New'},
  {id:'Comic Sans MS',label:'Comic Sans MS'},
];

function LyricStylePanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  // 크기 입력은 문자열로 두고 실행할 때 4~72인지 검사합니다(E54).
  const [sizeText,setSizeText]=useState('10');
  const size=Number(sizeText);
  const sizeValid=sizeText.trim()!==''&&Number.isFinite(size)&&size>=4&&size<=72;
  const [applySize,setApplySize]=useState(true);
  const [bold,setBold]=useState(false);
  const [applyBold,setApplyBold]=useState(true);
  const [italic,setItalic]=useState(false);
  const [applyItalic,setApplyItalic]=useState(true);
  const [family,setFamily]=useState('');
  const [applyFamily,setApplyFamily]=useState(false);
  const [log,setLog]=useState([]);

  const nothingToApply=!applySize&&!applyBold&&!applyItalic&&!applyFamily;
  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    // 바꿀 항목이 없으면 기록을 만들지 않습니다(E51). 크기가 범위 밖이면 커밋하지 않습니다(E54).
    if(nothingToApply){setLog([{m:'⚠ 적용할 항목을 하나 이상 켜세요.',t:'warn'}]);return}
    if(applySize&&!sizeValid){setLog([{m:`❌ 폰트 크기 '${sizeText}'은(는) 4~72 사이 숫자여야 합니다.`,t:'err'}]);return}
    setLog([]);showProgress('가사 스타일 적용 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;
        doc.querySelectorAll('lyric').forEach(lyric=>{
          const targets=lyric.querySelectorAll('text, syllabic, elision, extend');
          const texts=lyric.querySelectorAll('text');
          if(!texts.length)return;
          texts.forEach(t=>{
            if(applySize)t.setAttribute('font-size',String(size));
            if(applyBold)t.setAttribute('font-weight',bold?'bold':'normal');
            if(applyItalic)t.setAttribute('font-style',italic?'italic':'normal');
            if(applyFamily){if(family)t.setAttribute('font-family',family);else t.removeAttribute('font-family')}
            cnt++;
          });
        });
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${cnt}개 가사 텍스트 수정`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('가사 스타일 적용',files,scope));
      lines.push({m:'✅ 가사 스타일 적용 완료',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,size,sizeText,sizeValid,nothingToApply,applySize,bold,applyBold,italic,applyItalic,family,applyFamily,showProgress,hideProgress,onFilesUpdate]);

  const runReset=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('가사 스타일 초기화 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
    for(const {file} of targetFiles(files,activeFile,scope)){
      const doc=cloneDoc(file.xmlDoc);let cnt=0;
      doc.querySelectorAll('lyric text').forEach(t=>{
        ['font-size','font-weight','font-style','font-family','color'].forEach(a=>t.removeAttribute(a));cnt++;
      });
      updatedFiles.push(commitFile(file,doc));
      lines.push({m:`✓ ${file.name}: ${cnt}개 초기화`,t:'ok'});
    }
    onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('가사 스타일 초기화',files,scope));
    lines.push({m:'✅ 초기화 완료',t:'ok'});setLog(lines);hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,onFilesUpdate]);

  const runColorByPitch=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('계이름 색상 적용 중...');await new Promise(r=>setTimeout(r,50));
    try{
      const lines=[scopeLogLine(files,activeFile,scope)];const updatedFiles=[];
      for(const {file} of targetFiles(files,activeFile,scope)){
        const doc=cloneDoc(file.xmlDoc);let cnt=0;let skipRest=0;let badColor=0;
        doc.querySelectorAll('note').forEach(note=>{
          const lyrics=note.querySelectorAll('lyric');if(!lyrics.length)return;
          if(note.querySelector('rest')){skipRest++;return}
          const p=getNotePitch(note);if(!p)return;
          if(!NOTE_COLORS[p.step])return;
          const color=noteColorFor(p.step);if(!color){badColor++;return}
          lyrics.forEach(lyric=>{
            lyric.querySelectorAll('text').forEach(t=>{t.setAttribute('color',color);cnt++});
          });
        });
        updatedFiles.push(commitFile(file,doc));
        lines.push({m:`✓ ${file.name}: ${cnt}개 가사에 계이름 색상 적용`,t:'ok'});
        if(badColor)lines.push({m:`⚠ ${file.name}: 색상 형식 오류로 ${badColor}개 음표의 가사는 건너뛰었습니다.`,t:'warn'});
      }
      onFilesUpdate(mergeTargets(files,targetFiles(files,activeFile,scope),updatedFiles),scopeLabel('가사 색상 적용',files,scope));
      lines.push({m:'✅ 가사 색상 적용 완료',t:'ok'});setLog(lines);
    }catch(e){setLog(l=>[...l,{m:'❌ '+friendlyError(e),t:'err'}])}
    hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,onFilesUpdate]);

  const previewStyle={
    fontSize:applySize&&sizeValid?`${size*1.5}px`:undefined,
    fontWeight:applyBold?(bold?'bold':'normal'):undefined,
    fontStyle:applyItalic?(italic?'italic':'normal'):undefined,
    fontFamily:applyFamily&&family?family:undefined,
  };

  return <div>
    <h2 className="panel__heading">가사 스타일</h2>
    <p className="panel__description">악보 내 모든 가사(lyric)의 글꼴·크기·굵기·기울기를 일괄 변경합니다.</p>

    <div className="card"><div className="card__title">🔠 크기</div>
      <div className="chip-group"><Chip on={applySize} onClick={()=>setApplySize(!applySize)}>크기 적용</Chip></div>
      <label className="form-label" htmlFor="lyric-font-size">폰트 크기 (pt, 4~72)</label>
      <input id="lyric-font-size" className="form-input form-input--mono" type="number" value={sizeText} min={4} max={72}
        aria-invalid={applySize&&!sizeValid} onChange={e=>setSizeText(e.target.value)} disabled={!applySize}/>
    </div>

    <div className="card"><div className="card__title">𝐁 굵기</div>
      <div className="chip-group">
        <Chip on={applyBold} onClick={()=>setApplyBold(!applyBold)}>굵기 적용</Chip>
        <Chip on={bold} onClick={()=>setBold(!bold)}>Bold</Chip>
      </div>
    </div>

    <div className="card"><div className="card__title">𝐼 기울기</div>
      <div className="chip-group">
        <Chip on={applyItalic} onClick={()=>setApplyItalic(!applyItalic)}>기울기 적용</Chip>
        <Chip on={italic} onClick={()=>setItalic(!italic)}>Italic</Chip>
      </div>
    </div>

    <div className="card"><div className="card__title">🔤 글꼴</div>
      <div className="chip-group"><Chip on={applyFamily} onClick={()=>setApplyFamily(!applyFamily)}>글꼴 적용</Chip></div>
      <div className="chip-group">
        {LYRIC_FONT_FAMILIES.map(f=><Chip key={f.id||'default'} on={family===f.id} onClick={()=>setFamily(f.id)}>{f.label}</Chip>)}
      </div>
    </div>

    <div className="card"><div className="card__title">👁️ 미리보기</div>
      <div style={{padding:'12px',background:'#fff',border:'1px solid #e5e7eb',borderRadius:'6px',textAlign:'center',...previewStyle}}>
        나는 가사입니다 Lyric Sample
      </div>
    </div>

    <div className="card"><div className="card__title">🎨 계이름 색상으로 가사 채색</div>
      <div className="card__text">각 음표(C·D·E·F·G·A·B)의 고유 색상을 해당 가사 텍스트에 적용합니다.</div>
      <div className="chip-group">
        {Object.entries(NOTE_COLORS).map(([n,c])=>
          <span key={n} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 8px',border:'1px solid #e5e7eb',borderRadius:'4px',marginRight:'4px'}}>
            <span style={{width:'10px',height:'10px',borderRadius:'50%',background:c,display:'inline-block'}}/>
            <span style={{color:c,fontWeight:'bold'}}>{n}</span>
          </span>
        )}
      </div>
      <div className="btn-row"><button className="btn btn--primary" onClick={runColorByPitch}>▶ 계이름 색상 적용</button></div>
    </div>

    {nothingToApply&&<p className="card__text" id="lyric-style-empty">적용할 항목을 하나 이상 켜세요.</p>}
    <div className="btn-row">
      <button className="btn btn--primary" onClick={run} disabled={nothingToApply} aria-describedby={nothingToApply?'lyric-style-empty':undefined}>▶ 가사 스타일 적용</button>
      <button className="btn btn--secondary" onClick={runReset}>↺ 초기화</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: CHORD ANALYSIS
   ============================================================== */
function ChordsPanel({files,activeFile=0,scope='all',showProgress,hideProgress}){
  const notify=useNotify();
  const [log,setLog]=useState([]);
  // 분석한 파일·범위가 바뀌면 이전 결과를 지웁니다(D12).
  const markAnalyzed=useAnalysisTargets(files,activeFile,scope,useCallback(()=>setLog([]),[]));

  const run=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('코드 분석 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[scopeLogLine(files,activeFile,scope)];
    const analyzedFiles=targetFiles(files,activeFile,scope).map(target=>target.file);
    try{
      for(const {file} of targetFiles(files,activeFile,scope)){
        lines.push({m:`── ${file.name} ──`,t:'info'});
        // 박(onset)마다 함께 울리는 음으로 판정하고, 마디는 number 속성으로 적습니다(C15·C18).
        const rows=window.RomanAnalysis.analyzeVerticalities(file.xmlDoc);
        if(!rows.length){lines.push({m:'  (음표 없음)',t:'warn'});continue;}
        for(const {measure,beats} of groupVerticalities(rows))
          lines.push({m:`  마디 ${measure}: ${beats.map(row=>`${row.beat}박 ${row.chord?.symbol||'?'}`).join(' · ')}`});
        const settled=rows.filter(row=>row.chord).length;
        lines.push({m:`  박 ${rows.length}개 중 ${settled}개 코드 확정 (?: 음이 3개 미만이거나 화음 패턴에 맞지 않음)`,t:settled?'ok':'warn'});
      }
      lines.push({m:'✅ 분석 완료',t:'ok'});
    }catch(e){lines.push({m:'❌ '+friendlyError(e),t:'err'});}
    setLog(lines);markAnalyzed(analyzedFiles);hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,markAnalyzed]);

  const runIdentify=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    setLog([]);showProgress('코드 기호 파악 중...');await new Promise(r=>setTimeout(r,50));
    const lines=[scopeLogLine(files,activeFile,scope)];let grandTotal=0;const grandTally={};
    const analyzedFiles=targetFiles(files,activeFile,scope).map(target=>target.file);
    for(const {file} of targetFiles(files,activeFile,scope)){
      lines.push({m:`── ${file.name} ──`,t:'info'});
      const parts=file.xmlDoc.querySelectorAll('part');
      const mc=parts[0]?.querySelectorAll('measure')?.length||0;
      const tally={};let count=0;
      for(let m=0;m<mc;m++){
        const seen=[];
        parts.forEach(part=>{const meas=part.querySelectorAll('measure')[m];if(!meas)return;
          meas.querySelectorAll('harmony').forEach(h=>{
            const cs=harmonyToString(h);if(!cs)return;
            seen.push(cs);tally[cs]=(tally[cs]||0)+1;grandTally[cs]=(grandTally[cs]||0)+1;count++;grandTotal++;
          });
        });
        if(seen.length){const number=window.MeasureCore.measureNumber(parts[0].querySelectorAll('measure')[m]);lines.push({m:`  마디 ${Number.isFinite(number)?number:m+1}: ${seen.join(', ')}`});}
      }
      if(!count){lines.push({m:'  (코드 기호 없음)',t:'warn'});continue}
      const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
      lines.push({m:`  총 ${count}개 · 고유 ${sorted.length}종: ${sorted.map(([k,v])=>`${k}(${v})`).join(', ')}`,t:'ok'});
    }
    if(files.length>1&&grandTotal){
      const sorted=Object.entries(grandTally).sort((a,b)=>b[1]-a[1]);
      lines.push({m:`── 전체 합계 ──`,t:'info'});
      lines.push({m:`총 ${grandTotal}개 · 고유 ${sorted.length}종: ${sorted.map(([k,v])=>`${k}(${v})`).join(', ')}`,t:'ok'});
    }
    lines.push({m:'✅ 코드 기호 파악 완료',t:'ok'});setLog(lines);markAnalyzed(analyzedFiles);hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,markAnalyzed]);

  return <div>
    <h2 className="panel__heading">코드 분석</h2>
    <p className="panel__description">악보에 있는 코드 기호(harmony)를 파악하거나, 박마다 함께 울리는 음을 분석해 코드를 찾습니다. 음이 3개 이상이거나 완전5도 두 음일 때만 확정하고 나머지는 ?로 표시합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runIdentify}>🔖 코드 기호 파악</button>
      <button className="btn btn--secondary" onClick={run}>▶ 수직 음향 분석</button>
    </div>
    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: ROMAN NUMERAL ANALYSIS
   ============================================================== */
function RomanAnalysisPanel({files,activeFile=0,scope='all',showProgress,hideProgress,onFilesUpdate}){
  const notify=useNotify();
  const [analysis,setAnalysis]=useState(null);
  const [log,setLog]=useState([]);
  const fileIndex=files[activeFile]?activeFile:0;
  const file=files[fileIndex];
  const cadenceTypes=['완전종지 (PAC)','불완전정격종지 (IAC)','반종지 (HC)','변격종지 (PC)','위종지 (DC)'];
  // 이 패널이 악보에 삽입해 만든 파일 객체입니다. 그 밖의 변경(파일 전환·다른 도구·실행 취소)은 결과를 지웁니다(C18, K-4).
  const ownFileRef=useRef(null);
  useEffect(()=>{
    if(file&&file===ownFileRef.current)return;
    ownFileRef.current=null;
    setAnalysis(null);setLog([]);
  },[file]);

  const keyInfo=useMemo(()=>{
    if(!file?.xmlDoc||!window.RomanAnalysis)return null;
    return window.RomanAnalysis.getKeyInfo(file.xmlDoc);
  },[file]);
  const keyLabel=key=>key?(key.mode==='minor'?`${key.keyName.toLowerCase()}단조`:`${key.keyName}장조`):'';

  const runAnalysis=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드하세요.','warn');return}
    if(!window.RomanAnalysis){notify('로마 숫자 분석 모듈을 불러오지 못했습니다.','err');return}
    setLog([]);
    showProgress('로마 숫자 분석 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      const result=window.RomanAnalysis.detectRomanNumeral(file.xmlDoc);
      setAnalysis(result);
      const changes=(result.keyChanges||[]).map(change=>`마디 ${change.measure}부터 ${keyLabel(change)}`).join(', ');
      const lines=[
        {m:`${file.name} · ${keyLabel(result)}${changes?` (${changes})`:''} · ${result.rows.length}개 코드 분석`,t:'info'},
        {m:`종지 ${result.cadences.length}개 · 진행 요약 ${result.progressions.length}개`,t:'ok'},
      ];
      if(!result.rows.length)lines.push({m:'분석 가능한 수직 음향을 찾지 못했습니다.',t:'warn'});
      setLog(lines);
    }catch(e){
      setLog([{m:'❌ '+friendlyError(e),t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files.length,file,showProgress,hideProgress]);

  const insertIntoScore=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드하세요.','warn');return}
    if(!window.RomanAnalysis){notify('로마 숫자 분석 모듈을 불러오지 못했습니다.','err');return}
    showProgress('로마 숫자를 악보에 삽입 중...');
    await new Promise(r=>setTimeout(r,50));
    try{
      // 결과 배열은 targetFiles 순서·길이와 같아야 합니다(현재 파일 범위에서 다른 파일을 덮어쓰던 회귀 수정).
      const targets=targetFiles(files,activeFile,scope);
      const updatedFiles=[];const lines=[scopeLogLine(files,activeFile,scope)];
      let activeDocAfter=null;
      for(const {file:target,index} of targets){
        const doc=cloneDoc(target.xmlDoc);
        const source=window.RomanAnalysis.detectRomanNumeral(doc);
        const count=window.RomanAnalysis.insertRomanNumerals(doc,source.rows);
        const committed=commitFile(target,doc);
        updatedFiles.push(committed);
        if(index===fileIndex){activeDocAfter=doc;ownFileRef.current=committed;}
        lines.push({m:`✓ ${target.name}: ${count}개 마디에 로마 숫자 삽입`,t:'ok'});
      }
      onFilesUpdate(mergeTargets(files,targets,updatedFiles),scopeLabel('로마 숫자 삽입',files,scope));
      if(activeDocAfter)setAnalysis(window.RomanAnalysis.detectRomanNumeral(activeDocAfter));
      lines.push({m:'✅ 적용 완료!',t:'ok'});setLog(lines);
    }catch(e){
      setLog([{m:'❌ '+friendlyError(e),t:'err'}]);
    }finally{
      hideProgress();
    }
  },[files,activeFile,scope,fileIndex,onFilesUpdate,showProgress,hideProgress]);

  return <div>
    <h2 className="panel__heading">로마 숫자 분석</h2>
    <p className="panel__description">마디별 수직 음향을 그 마디의 조표 기준 로마 숫자 화성으로 해석하고 종지를 요약합니다. 음이 3개 이상 겹치는 박만 화음으로 확정합니다. 이조 악기는 <code>&lt;transpose&gt;</code>를 적용한 실음으로 분석합니다. 최상성부 종지 판정은 하지 않습니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runAnalysis} disabled={!files.length}>
        {keyInfo?`${keyInfo.mode==='minor'?keyInfo.keyName.toLowerCase():keyInfo.keyName}${keyInfo.mode==='minor'?'단조':'장조'} 분석 시작`:'로마 숫자 분석 시작'}
      </button>
      <button className="btn btn--secondary" onClick={insertIntoScore} disabled={!files.length}>
        악보에 삽입
      </button>
    </div>

    {analysis&&<div className="stats-row roman-cadence-grid">
      {cadenceTypes.map(type=>
        <div className="stat-tile" key={type}>
          <div className="stat-tile__value">{analysis.cadenceCounts?.[type]||0}</div>
          <div className="stat-tile__label">{type}</div>
        </div>
      )}
    </div>}

    {analysis&&<div className="card">
      <div className="card__title">코드 진행 Top 5</div>
      {analysis.progressions.length?
        <ol className="roman-progressions">
          {analysis.progressions.map(item=><li key={item.pair}><span>{item.pair}</span><b>{item.count}</b></li>)}
        </ol>:
        <div className="card__text">반복되는 2-chord 진행이 아직 없습니다.</div>}
    </div>}

    {analysis&&<div className="roman-table-wrap">
      <table className="roman-table">
        <thead><tr><th>마디번호</th><th>박자</th><th>조성</th><th>코드명</th><th>로마숫자</th><th>전위</th><th>종지여부</th></tr></thead>
        <tbody>
          {analysis.rows.map((row,index)=>
            <tr key={`${row.measure}-${row.beat}-${index}`}>
              <td>{row.measure}</td>
              <td>{row.beat}</td>
              <td className="roman-table__key">{row.keyName&&(row.keyName!==analysis.keyName||row.mode!==analysis.mode)?keyLabel(row):''}</td>
              <td>{row.chordName}</td>
              <td className="roman-table__numeral">{row.roman}</td>
              <td>{row.figure||'기본위치'}</td>
              <td>{row.cadence||'-'}</td>
            </tr>
          )}
        </tbody>
      </table>
    </div>}

    <LogPanel lines={log}/>
  </div>;
}

/* ==============================================================
   PANEL: STATISTICS
   ============================================================== */
function StatsPanel({files,activeFile=0,scope='all',showProgress,hideProgress}){
  const notify=useNotify();
  const [basicData,setBasicData]=useState(null);
  const [composerData,setComposerData]=useState(null);
  // 분석한 파일·범위가 바뀌면 두 결과를 모두 지워 서로 다른 악보의 수치가 한 화면에 섞이지 않게 합니다(D04).
  const markAnalyzed=useAnalysisTargets(files,activeFile,scope,useCallback(()=>{setBasicData(null);setComposerData(null);},[]));

  const runBasic=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    showProgress('통계 분석 중...');await new Promise(r=>setTimeout(r,50));
    const nc={C:0,D:0,E:0,F:0,G:0,A:0,B:0};const rc={};
    let tn=0,tr=0,tm=0,tp=0,lo=127,hi=0,loN=null,hiN=null;
    const rKo={whole:'온음표',half:'2분음표',quarter:'4분음표',eighth:'8분음표','16th':'16분음표','32nd':'32분음표',
      '점whole':'점온음표','점half':'점2분음표','점quarter':'점4분음표','점eighth':'점8분음표'};
    for(const {file} of targetFiles(files,activeFile,scope)){
      // 마디 수는 첫 파트 기준(B09). 음표·쉼표는 전체 파트 합계입니다.
      const doc=file.xmlDoc;tm+=xmlChildren(window.MeasureCore.firstPart(doc),'measure').length;
      tp+=xmlChildren(doc.documentElement,'part').filter(part=>xmlChildren(part,'measure').length).length;
      doc.querySelectorAll('note').forEach(note=>{
        if(note.querySelector('rest')){tr++;return}
        const p=getNotePitch(note);if(!p)return;tn++;nc[p.step]=(nc[p.step]||0)+1;
        // 최저·최고음은 악보에 적힌 철자 그대로 보여 줍니다(N6).
        const midi=noteToMidi(p.step,p.alter,p.octave);if(midi<lo){lo=midi;loN=p;}if(midi>hi){hi=midi;hiN=p;}
        const te=note.querySelector('type');if(te){let rn=te.textContent;if(note.querySelector('dot'))rn='점'+rn;rc[rn]=(rc[rn]||0)+1}
      });
    }
    const rcDisplay={};Object.entries(rc).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{rcDisplay[rKo[k]||k]=v});
    setBasicData({target:analysisTargetLabel(files,activeFile,scope),fileCount:targetFiles(files,activeFile,scope).length,totalNotes:tn,totalRests:tr,totalMeasures:tm,totalParts:tp,
      lowest:fmtNote(loN),highest:fmtNote(hiN),noteCounts:nc,rhythmCounts:rcDisplay});
    markAnalyzed(targetFiles(files,activeFile,scope).map(target=>target.file));
    hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,markAnalyzed]);

  const runComposer=useCallback(async()=>{
    if(!files.length){notify('먼저 파일을 업로드 해주세요.','warn');return}
    showProgress('작곡 스타일 분석 중...');await new Promise(r=>setTimeout(r,50));
    const allIv={},allProg={},phrases=[];
    let tn=0,tm=0,steps=0,leaps=0,reps=0;
    const ksc={},tsc={},tempos=[];let rMin=127,rMax=0,rMinN=null,rMaxN=null;
    for(const {file} of targetFiles(files,activeFile,scope)){
      const doc=file.xmlDoc;const measures=xmlChildren(window.MeasureCore.firstPart(doc),'measure');tm+=measures.length;
      // 조성은 첫 조표의 fifths와 mode로 분류합니다(A단조가 C로 잡히던 C08).
      const firstKey=doc.querySelector('key');const ks=xmlChild(firstKey,'fifths');
      if(ks){const k=`${parseInt(ks.textContent,10)||0}|${xmlChild(firstKey,'mode')?.textContent.trim()==='minor'?'minor':'major'}`;ksc[k]=(ksc[k]||0)+1}
      const ts=doc.querySelector('time');if(ts){const sig=(ts.querySelector('beats')?.textContent||'?')+'/'+(ts.querySelector('beat-type')?.textContent||'?');tsc[sig]=(tsc[sig]||0)+1}
      const snd=doc.querySelector('sound[tempo]');if(snd)tempos.push(parseFloat(snd.getAttribute('tempo')));
      let prevChord=null,pLen=0,fifths=0;
      measures.forEach(measure=>{const ns=[];
        for(const attributes of xmlChildren(measure,'attributes')){const keys=xmlChildren(attributes,'key');const key=keys.find(k=>!k.hasAttribute('number')||k.getAttribute('number')==='1')||keys[0];const value=xmlChild(key,'fifths');if(value)fifths=parseInt(value.textContent,10)||0;}
        measure.querySelectorAll('note').forEach(note=>{if(note.querySelector('rest')){if(pLen>0){phrases.push(pLen);pLen=0}return}
          tn++;pLen++;const p=getNotePitch(note);if(!p)return;
          const midi=noteToMidi(p.step,p.alter,p.octave);if(midi<rMin){rMin=midi;rMinN=p;}if(midi>rMax){rMax=midi;rMaxN=p;}
          ns.push(midi%12)});
        const chord=window.ChordToolsCore.detectChordFromPitchClasses(ns,{fifths})?.symbol;if(chord&&prevChord){const pr=prevChord+' → '+chord;allProg[pr]=(allProg[pr]||0)+1}if(chord)prevChord=chord;
      });if(pLen>0)phrases.push(pLen);
      let pm=null;doc.querySelectorAll('part:first-of-type note').forEach(note=>{
        if(note.querySelector('rest')||note.querySelector('chord'))return;
        const p=getNotePitch(note);if(!p)return;const midi=noteToMidi(p.step,p.alter,p.octave);
        if(pm!==null){const iv=Math.abs(midi-pm);allIv[getIntervalName(Math.min(iv,12))]=(allIv[getIntervalName(Math.min(iv,12))]||0)+1;
          if(iv===0)reps++;else if(iv<=2)steps++;else leaps++}pm=midi});
    }
    const move=steps+leaps+reps||1;
    const avgPh=phrases.length?(phrases.reduce((a,b)=>a+b,0)/phrases.length).toFixed(1):'-';
    const avgTm=tempos.length?(tempos.reduce((a,b)=>a+b,0)/tempos.length).toFixed(0):'-';
    const topProg={};Object.entries(allProg).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([k,v])=>topProg[k]=v);
    const pBk={};phrases.forEach(l=>{const b=l<=4?'1-4':l<=8?'5-8':l<=12?'9-12':l<=16?'13-16':'17+';pBk[b]=(pBk[b]||0)+1});
    const topKeys=Object.entries(ksc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>{const [fifths,mode]=k.split('|');return{name:keyDisplayName(Number(fifths),mode),count:v}});
    const topTime=Object.entries(tsc).sort((a,b)=>b[1]-a[1]).slice(0,5);
    setComposerData({target:analysisTargetLabel(files,activeFile,scope),fileCount:targetFiles(files,activeFile,scope).length,totalNotes:tn,totalMeasures:tm,avgTempo:avgTm,
      lowest:fmtNote(rMinN),highest:fmtNote(rMaxN),
      avgPhrase:avgPh,stepPct:(steps/move*100).toFixed(1),leapPct:(leaps/move*100).toFixed(1),repPct:(reps/move*100).toFixed(1),
      topKeys,topTime,intervals:allIv,progressions:topProg,phraseBuckets:pBk});
    markAnalyzed(targetFiles(files,activeFile,scope).map(target=>target.file));
    hideProgress();
  },[files,activeFile,scope,showProgress,hideProgress,markAnalyzed]);

  return <div>
    <h2 className="panel__heading">통계 분석</h2>
    <p className="panel__description">음표 빈도, 리듬 패턴, 음정 도약, 코드 진행 등을 분석합니다.</p>
    <div className="btn-row">
      <button className="btn btn--primary" onClick={runBasic}>▶ 기본 분석</button>
      <button className="btn btn--secondary" onClick={runComposer}>📋 작곡 스타일 분석</button>
    </div>

    {basicData && <div>
      <p className="stats-caption">분석 대상: {basicData.target} · 마디 {basicData.totalMeasures} · 파트 {basicData.totalParts}개 (마디는 첫 파트 기준, 음표·쉼표는 전체 파트 합계)</p>
      <div className="stats-row">
        <div className="stat-tile"><div className="stat-tile__value">{basicData.fileCount}</div><div className="stat-tile__label">파일 수</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalNotes}</div><div className="stat-tile__label">음표 (전체 파트)</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalRests}</div><div className="stat-tile__label">쉼표 (전체 파트)</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.totalMeasures}</div><div className="stat-tile__label">마디</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.lowest}</div><div className="stat-tile__label">최저음</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{basicData.highest}</div><div className="stat-tile__label">최고음</div></div>
      </div>
      <div className="card"><div className="card__title">📊 음표 분포</div>
        <BarChart data={basicData.noteCounts} labelWidth={48}/></div>
      <div className="card"><div className="card__title">🎵 리듬 유형</div>
        <BarChart data={basicData.rhythmCounts} labelWidth={80}/></div>
    </div>}

    {composerData && <div>
      <h3 className="stats-heading">작곡 스타일 (첫 파트 선율 기준)</h3>
      <p className="stats-caption">분석 대상: {composerData.target}</p>
      <div className="stats-row">
        <div className="stat-tile"><div className="stat-tile__value">{composerData.fileCount}</div><div className="stat-tile__label">분석 곡 수</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{composerData.totalNotes}</div><div className="stat-tile__label">음표 (첫 파트)</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{composerData.totalMeasures}</div><div className="stat-tile__label">마디</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{composerData.avgTempo}</div><div className="stat-tile__label">평균 BPM</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{composerData.lowest}–{composerData.highest}</div><div className="stat-tile__label">음역대</div></div>
        <div className="stat-tile"><div className="stat-tile__value">{composerData.avgPhrase}</div><div className="stat-tile__label">평균 프레이즈</div></div>
      </div>
      <div className="card"><div className="card__title">음직임 패턴</div>
        <div className="composer-movement">
          <span className="composer-metric--step">순차: {composerData.stepPct}%</span>{' · '}
          <span className="composer-metric--leap">도약: {composerData.leapPct}%</span>{' · '}
          <span className="composer-metric--repeat">반복: {composerData.repPct}%</span>
        </div>
        <div className="composer-keys">
          조성: {composerData.topKeys.map(k=><span key={k.name}><span className="composer-tag">{k.name}</span>({k.count}곡) </span>)}<br/>
          박자: {composerData.topTime.map(([t,v])=><span key={t}><span className="composer-tag">{t}</span>({v}곡) </span>)}
        </div>
      </div>
      <div className="card"><div className="card__title">📊 음정 도약 분포</div>
