name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # MusicXML 스키마 검증(tests/e2e/25-schema.spec.js)은 xmllint-wasm을 먼저 쓰고, 안 되면 시스템 xmllint로 폴백합니다.
      - run: sudo apt-get install -y libxml2-utils
      - run: npm test
      - run: npm run e2e:smoke
      - run: npx playwright test --grep '@panels|@a11y'
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report
          path: |
            playwright-report
            test-results
          retention-days: 7
