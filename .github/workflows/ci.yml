name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e:smoke
      - run: npx playwright test --grep '@panels|@a11y'
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report
          path: |
            playwright-report
            test-results
          retention-days: 7
