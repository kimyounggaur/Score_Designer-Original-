name: Nightly Full Test
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux visual baselines as a reviewable artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Generate canonical Linux screenshots
        if: ${{ inputs.update_snapshots == true }}
        run: npx playwright test --grep '@visual' --update-snapshots
        env:
          UPDATE_SNAPSHOTS: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots == true }}
        with:
          name: linux-visual-baselines
          path: tests/e2e/__snapshots__/
          if-no-files-found: error
          retention-days: 30
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: |
            playwright-report
            test-results
          retention-days: 14
  prod-smoke:
    if: ${{ vars.PROD_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:prod
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
