name: Post-deploy Smoke
on:
  workflow_run:
    workflows: [Deploy static site to GitHub Pages]
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.PROD_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:prod
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-report
          path: |
            playwright-report
            test-results
