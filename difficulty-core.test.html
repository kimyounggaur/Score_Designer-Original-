<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Difficulty Core Tests</title>
<script src="difficulty-core.js?v=1"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
function assert(condition,message){if(!condition)throw new Error(message)}
function parseXml(text){return new DOMParser().parseFromString(text,'text/xml')}
function note(step,oct,dur=1){return `<note><pitch><step>${step}</step><octave>${oct}</octave></pitch><duration>${dur}</duration><type>quarter</type></note>`}

try{
  assert(window.DifficultyCore, 'DifficultyCore namespace is missing');
  const doc=parseXml(`<score-partwise><part-list><score-part id="P1"><part-name>Piano</part-name></score-part></part-list><part id="P1">
    <measure number="1"><attributes><divisions>1</divisions><key><fifths>3</fifths></key></attributes><direction><direction-type><metronome><per-minute>120</per-minute></metronome></direction-type></direction>${note('C',4)}${note('G',4)}${note('E',5)}<harmony><root><root-step>C</root-step></root><kind>major</kind></harmony></measure>
    <measure number="2">${note('C',6,2)}<note><rest/><duration>1</duration></note><harmony><root><root-step>G</root-step></root><kind>dominant</kind></harmony></measure>
  </part><part id="P2"><measure number="1">${note('C',3)}</measure></part></score-partwise>`);
  const result=window.DifficultyCore.scoreDifficulty(doc);
  assert(result.total>=0 && result.total<=100, 'total range');
  assert(result.breakdown.rangeScore>0, 'range score');
  assert(result.breakdown.keyScore===30, 'key score');
  assert(result.breakdown.harmonyScore===16, 'harmony kinds');
  assert(result.breakdown.polyScore===25, 'poly score');
  assert(result.details.rangeLabel.includes('C3'), 'range label low');
  assert(['입문','초급','중급','고급','전문가'].includes(result.level), 'level label');

  const list=window.DifficultyCore.compareFiles([{name:'test.xml',xmlDoc:doc}]);
  assert(list[0].name==='test.xml' && list[0].total===result.total, 'compare files');
  assert(window.DifficultyCore.recommendation(result).length>0, 'recommendation');

  document.getElementById('out').textContent='PASS';
}catch(error){
  document.getElementById('out').textContent=`FAIL\n${error.message}`;
  throw error;
}
</script>
</body>
</html>
