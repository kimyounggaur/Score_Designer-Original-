<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Voice Leading Core Tests</title>
<script src="voice-leading-core.js?v=1"></script>
</head>
<body>
<pre id="out">running...</pre>
<script>
function assert(condition,message){
  if(!condition)throw new Error(message);
}

function parseXml(text){
  return new DOMParser().parseFromString(text,'text/xml');
}

try{
  assert(window.VoiceLeadingCore, 'VoiceLeadingCore namespace is missing');

  const beat1=[{midi:60,partIdx:0,beat:1,measure:1,partName:'S'},{midi:53,partIdx:1,beat:1,measure:1,partName:'B'}];
  const beat2=[{midi:62,partIdx:0,beat:2,measure:1,partName:'S'},{midi:55,partIdx:1,beat:2,measure:1,partName:'B'}];
  assert(window.VoiceLeadingCore.checkParallelFifths(beat1,beat2).length===1, 'parallel fifth detected');

  const oct1=[{midi:72,partIdx:0,beat:1,measure:1,partName:'S'},{midi:60,partIdx:1,beat:1,measure:1,partName:'B'}];
  const oct2=[{midi:74,partIdx:0,beat:2,measure:1,partName:'S'},{midi:62,partIdx:1,beat:2,measure:1,partName:'B'}];
  assert(window.VoiceLeadingCore.checkParallelOctaves(oct1,oct2).length===1, 'parallel octave detected');

  const hidden1=[{midi:64,partIdx:0,beat:1,measure:2,partName:'S'},{midi:48,partIdx:3,beat:1,measure:2,partName:'B'}];
  const hidden2=[{midi:71,partIdx:0,beat:2,measure:2,partName:'S'},{midi:52,partIdx:3,beat:2,measure:2,partName:'B'}];
  assert(window.VoiceLeadingCore.checkHiddenFifths(hidden1,hidden2).length===1, 'hidden fifth detected');

  const crossing=[{midi:62,partIdx:0,beat:1,measure:3,partName:'S'},{midi:64,partIdx:1,beat:1,measure:3,partName:'A'}];
  assert(window.VoiceLeadingCore.checkVoiceCrossing([],crossing).length===1, 'voice crossing detected');

  assert(window.VoiceLeadingCore.checkLargeLeap({midi:60,measure:4,beat:1},{midi:74,measure:4,beat:2},'S').length===1, 'large leap detected');
  assert(window.VoiceLeadingCore.checkConsecutiveLeaps([
    {midi:60,measure:5,beat:1,partName:'S'},
    {midi:64,measure:5,beat:2,partName:'S'},
    {midi:68,measure:5,beat:3,partName:'S'},
    {midi:72,measure:5,beat:4,partName:'S'},
  ]).length===1, 'consecutive leaps detected');

  const doc=parseXml(`<score-partwise>
    <part-list>
      <score-part id="P1"><part-name>Soprano</part-name></score-part>
      <score-part id="P2"><part-name>Bass</part-name></score-part>
    </part-list>
    <part id="P1"><measure number="1"><attributes><divisions>1</divisions></attributes>
      <note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
    </measure></part>
    <part id="P2"><measure number="1"><attributes><divisions>1</divisions></attributes>
      <note><pitch><step>F</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
      <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>
    </measure></part>
  </score-partwise>`);
  const result=window.VoiceLeadingCore.analyzeVoiceLeading(doc);
  assert(result.violations.some(v=>v.type==='평행5도'), 'analyzer finds parallel fifth');
  assert(result.score===90, 'score subtracts error weight');

  document.getElementById('out').textContent='PASS';
}catch(error){
  document.getElementById('out').textContent=`FAIL\n${error.message}`;
  throw error;
}
</script>
</body>
</html>
